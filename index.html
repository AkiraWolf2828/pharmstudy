<!DOCTYPE html>
<html lang="ru" data-theme="warm-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b8d6ce">
<title>PharmStudy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --mint:#7cc5b8;--mint-soft:#e0f2ef;
  --lavender-deco:#b8a8e0;--lavender-soft:#ede7f7;
  --warm:#f5be7c;--warm-soft:#fdf0dd;
  --success:#7fc99a;--success-soft:#e0f4e7;
  --error:#f09098;--error-soft:#fde6e8;
}
[data-theme="warm-light"]{--sidebar-bg:#b8d6ce;--sidebar-text:#5d7268;--sidebar-text-active:#2d3f38;--sidebar-active-bg:rgba(255,255,255,0.7);--bg:#faf4ec;--card:#ffffff;--card-2:#f7f0e6;--text:#3d3535;--text-muted:#8a7d78;--border:rgba(180,160,140,0.12);--shadow:0 4px 20px rgba(180,160,140,0.12);--shadow-sm:0 2px 10px rgba(180,160,140,0.08);--accent:#ff9e85;--accent-soft:#ffe6df;--accent-deep:#e8836a;--hero-from:#ffb8a0;--hero-to:#c5b5e8;--avatar-from:#ffc4b0;--avatar-to:#c5b5e8}
[data-theme="warm-dark"]{--sidebar-bg:#232a28;--sidebar-text:#a8b8b0;--sidebar-text-active:#f0f5f0;--sidebar-active-bg:rgba(124,197,184,0.18);--bg:#2a2520;--card:#38322c;--card-2:#443d36;--text:#f5ede2;--text-muted:#a89c90;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.25);--shadow-sm:0 2px 10px rgba(0,0,0,0.18);--accent:#ffa88e;--accent-soft:rgba(255,168,142,0.15);--accent-deep:#ff9578;--hero-from:#7a5a48;--hero-to:#5a4d70;--avatar-from:#c58a78;--avatar-to:#8a7ab0}
[data-theme="mint-light"]{--sidebar-bg:#c8dfd8;--sidebar-text:#4a6862;--sidebar-text-active:#1f3330;--sidebar-active-bg:rgba(255,255,255,0.75);--bg:#f2f8f6;--card:#ffffff;--card-2:#e8f3ef;--text:#2a3a37;--text-muted:#758a85;--border:rgba(100,140,130,0.1);--shadow:0 4px 20px rgba(120,170,155,0.12);--shadow-sm:0 2px 10px rgba(120,170,155,0.08);--accent:#5fb8a8;--accent-soft:#dcf2ed;--accent-deep:#44948a;--hero-from:#8dd4c4;--hero-to:#a8c8e0;--avatar-from:#8dd4c4;--avatar-to:#a8c8e0}
[data-theme="mint-dark"]{--sidebar-bg:#1d2b28;--sidebar-text:#90aca4;--sidebar-text-active:#e8f5f1;--sidebar-active-bg:rgba(95,184,168,0.2);--bg:#1a2422;--card:#243330;--card-2:#2d3e3a;--text:#e5f2ee;--text-muted:#8aa39c;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-sm:0 2px 10px rgba(0,0,0,0.2);--accent:#7cd0be;--accent-soft:rgba(124,208,190,0.15);--accent-deep:#5fb8a8;--hero-from:#3a6a5f;--hero-to:#3a5a70;--avatar-from:#6db8a8;--avatar-to:#7aa8c0}
[data-theme="lavender-light"]{--sidebar-bg:#d8cce8;--sidebar-text:#63557a;--sidebar-text-active:#2d2140;--sidebar-active-bg:rgba(255,255,255,0.75);--bg:#f7f2fa;--card:#ffffff;--card-2:#f0e8f5;--text:#322a3d;--text-muted:#857a92;--border:rgba(140,120,160,0.1);--shadow:0 4px 20px rgba(170,140,190,0.14);--shadow-sm:0 2px 10px rgba(170,140,190,0.08);--accent:#b89dd6;--accent-soft:#ede2f5;--accent-deep:#9575b8;--hero-from:#c8aae0;--hero-to:#f0b5d0;--avatar-from:#c8aae0;--avatar-to:#f0b5d0}
[data-theme="lavender-dark"]{--sidebar-bg:#252030;--sidebar-text:#a094b5;--sidebar-text-active:#efe8f8;--sidebar-active-bg:rgba(184,157,214,0.2);--bg:#1f1a2a;--card:#2a2438;--card-2:#352d45;--text:#efe8f8;--text-muted:#9d90ad;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-sm:0 2px 10px rgba(0,0,0,0.2);--accent:#c8aae0;--accent-soft:rgba(200,170,224,0.15);--accent-deep:#b89dd6;--hero-from:#5a4870;--hero-to:#7a4868;--avatar-from:#9a7ab8;--avatar-to:#c88aa0}
[data-theme$="-dark"]{--mint-soft:rgba(124,197,184,0.15);--lavender-soft:rgba(197,181,232,0.15);--warm-soft:rgba(245,190,124,0.15);--success-soft:rgba(127,201,154,0.15);--error-soft:rgba(240,144,152,0.15);--accent-soft:rgba(255,168,142,0.15);color-scheme:dark}
[data-theme$="-light"]{color-scheme:light}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--card-2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:5px;border:2px solid var(--card-2)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);padding:24px 14px;display:flex;flex-direction:column;gap:20px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:10;border-radius:0 28px 28px 0;transition:background .3s}
.profile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 4px 20px;border-bottom:1px solid rgba(255,255,255,0.3)}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;box-shadow:0 4px 14px rgba(150,120,140,0.25)}
.profile-name{color:var(--sidebar-text-active);font-weight:700;font-size:16px}
.profile-sub{color:var(--sidebar-text);font-size:12px;text-align:center;opacity:0.85}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:transparent;color:var(--sidebar-text);font-size:14px;font-family:inherit;font-weight:600;border-radius:16px;cursor:pointer;text-align:left;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,0.4);color:var(--sidebar-text-active)}
.nav-btn.active{background:var(--sidebar-active-bg);color:var(--sidebar-text-active);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
.premium-block{background:linear-gradient(150deg,rgba(255,255,255,0.5),rgba(255,255,255,0.25));border-radius:20px;padding:18px 12px;text-align:center;border:1px solid rgba(255,255,255,0.4)}
.premium-block .crown{font-size:26px;margin-bottom:6px}
.premium-block h4{color:var(--sidebar-text-active);font-size:13px;margin-bottom:4px;font-weight:700}
.premium-block p{color:var(--sidebar-text);font-size:11px;margin-bottom:12px}
.premium-block button{width:100%;padding:10px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.content{flex:1;margin-left:240px;padding:28px 36px 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}
.topbar h1{font-size:26px;font-weight:700}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm)}
.theme-toggle svg{width:16px;height:16px}
.hero{background:linear-gradient(135deg,var(--hero-from) 0%,var(--hero-to) 100%);border-radius:28px;padding:32px;margin-bottom:24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(150,120,140,0.22)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,0.15)}
.hero h2{font-size:24px;font-weight:700;margin-bottom:6px;position:relative}
.hero p{font-size:14px;opacity:.95;margin-bottom:20px;position:relative}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:16px;border:none;background:#fff;color:var(--accent-deep);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;position:relative;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
.hero-btn svg{width:16px;height:16px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stat-card:nth-child(1){background:linear-gradient(160deg,var(--mint-soft),var(--card))}
.stat-card:nth-child(2){background:linear-gradient(160deg,var(--accent-soft),var(--card))}
.stat-card:nth-child(3){background:linear-gradient(160deg,var(--lavender-soft),var(--card))}
.stat-card:nth-child(4){background:linear-gradient(160deg,var(--warm-soft),var(--card))}
.stat-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:var(--card)}
.stat-icon svg{width:20px;height:20px}
.stat-icon.mint{color:var(--mint)}.stat-icon.lavender{color:var(--lavender-deco)}.stat-icon.accent{color:var(--accent)}.stat-icon.warm{color:var(--warm)}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.stat-value{font-size:28px;font-weight:700;line-height:1.1}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.row-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px}
.panel{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel-head h3{font-size:16px;font-weight:700}
.panel-head .badge{font-size:11px;color:var(--text-muted);background:var(--card-2);padding:5px 12px;border-radius:10px;font-weight:600}
.topic-list{display:flex;flex-direction:column;gap:16px}
.topic-row{display:flex;flex-direction:column;gap:8px}
.topic-top{display:flex;justify-content:space-between;font-size:12px}
.topic-name{font-weight:600}
.topic-pct{color:var(--text-muted);font-weight:600}
.topic-bar{height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.topic-fill{height:100%;border-radius:4px;transition:width .4s}
.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:var(--card-2);cursor:pointer;transition:all .2s}
.recent-item:hover{background:var(--accent-soft);transform:translateX(3px)}
.recent-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.recent-info{flex:1;min-width:0}
.recent-title{font-size:13px;font-weight:700}
.recent-sub{font-size:11px;color:var(--text-muted)}
.question-card,.case-card,.report-card,.case-picker{background:var(--card);border-radius:28px;padding:36px;box-shadow:var(--shadow);max-width:820px;margin:0 auto}
.q-progress{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.q-progress-bar{flex:1;height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.q-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--lavender-deco));border-radius:4px;transition:width .3s}
.q-progress-text{font-size:12px;color:var(--text-muted);font-weight:600}
.q-text{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:28px}
.q-options{display:flex;flex-direction:column;gap:12px}
.q-option{padding:18px 20px;border-radius:18px;background:var(--card-2);border:2px solid transparent;color:var(--text);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:14px}
.q-option:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.q-option:disabled{cursor:default}
.q-option-letter{width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.q-option.correct{background:var(--success-soft);border-color:var(--success)}
.q-option.correct .q-option-letter{background:var(--success);color:#fff}
.q-option.wrong{background:var(--error-soft);border-color:var(--error)}
.q-option.wrong .q-option-letter{background:var(--error);color:#fff}
.explanation{margin-top:24px;padding:22px;background:var(--accent-soft);border-radius:20px;border-left:4px solid var(--accent)}
.explanation h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.3px}
.explanation p{font-size:14px;line-height:1.65;color:var(--text)}
.explanation .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:10px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--card);color:var(--text-muted);letter-spacing:0.2px}
.explanation .source{font-size:11px;color:var(--text-muted);margin-top:12px;font-style:italic}
.next-btn{margin-top:22px;width:100%;padding:16px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,0.15)}
.case-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.case-badge{padding:5px 12px;border-radius:10px;background:var(--warm-soft);color:#b8801f;font-size:11px;font-weight:700;letter-spacing:0.3px}
.case-title{font-size:17px;font-weight:700}
.case-intro{padding:22px;background:var(--lavender-soft);border-radius:20px;font-size:14px;line-height:1.65;margin-bottom:24px;border-left:4px solid var(--lavender-deco)}
.case-question{font-size:17px;font-weight:600;margin-bottom:18px}
.case-feedback{padding:18px;border-radius:18px;margin-top:18px;font-size:13px;line-height:1.65}
.case-feedback.good{background:var(--success-soft);border-left:4px solid var(--success)}
.case-feedback.bad{background:var(--error-soft);border-left:4px solid var(--error)}
.case-feedback.neutral{background:var(--warm-soft);border-left:4px solid var(--warm)}
.case-pick-item{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--card-2);cursor:pointer;margin-bottom:12px;transition:all .2s}
.case-pick-item:hover{background:var(--accent-soft);transform:translateX(4px)}
.case-pick-icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--lavender-deco));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.case-pick-info{flex:1}
.case-pick-title{font-size:15px;font-weight:700;margin-bottom:2px}
.case-pick-sub{font-size:12px;color:var(--text-muted)}
.report-card{text-align:center}
.report-emoji{font-size:56px;margin-bottom:16px}
.report-title{font-size:24px;font-weight:700;margin-bottom:8px}
.report-sub{font-size:14px;color:var(--text-muted);margin-bottom:28px}
.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.report-stat{background:var(--card-2);border-radius:20px;padding:18px}
.report-stat-val{font-size:26px;font-weight:700}
.report-stat-lbl{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.report-weak{text-align:left;margin-bottom:22px}
.report-weak h4{font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.3px}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{padding:12px 14px;border-radius:14px;background:var(--error-soft);border-left:3px solid var(--error);font-size:13px;font-weight:500}
.theory-section{margin-bottom:32px}
.theory-card{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:12px;cursor:pointer;transition:all .2s}
.theory-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.theory-card-head{display:flex;align-items:center;gap:12px}
.theory-card-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.theory-card-title{font-size:16px;font-weight:700}
.theory-card-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.theory-card-body{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;line-height:1.7;color:var(--text)}
.theory-card-body.show{display:block}
.theory-card-body h4{font-size:12px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:6px;margin-top:14px}
.theory-card-body h4:first-child{margin-top:0}
.theory-card-body ul{margin:0 0 8px 0;padding-left:20px}
.theory-card-body li{margin-bottom:3px}
.theory-card-body strong{color:var(--text)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ref-section{margin-bottom:32px}
.ref-section-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text)}
.ref-card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s}
.ref-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ref-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ref-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.ref-card h3{font-size:14px;font-weight:700;line-height:1.3}
.ref-card p{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5}
.ref-drugs{display:flex;flex-wrap:wrap;gap:6px}
.ref-drug{font-size:11px;padding:4px 10px;border-radius:8px;background:var(--card-2);color:var(--text-muted);font-weight:600}
.palette-card{padding:16px;border-radius:18px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;text-align:center}
.palette-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.palette-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.palette-swatch{width:100%;height:50px;border-radius:12px;margin-bottom:10px}
.palette-name{font-size:13px;font-weight:700;margin-bottom:4px}
.palette-sub{font-size:11px;color:var(--text-muted)}
.topic-pick{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card-2);cursor:pointer;transition:all .2s;border:2px solid transparent;margin-bottom:10px}
.topic-pick:hover{background:var(--accent-soft)}
.topic-pick.selected{border-color:var(--accent);background:var(--accent-soft)}
.topic-check{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;font-weight:700;transition:all .2s}
.topic-pick-info{flex:1}
.topic-pick-title{font-size:14px;font-weight:700;margin-bottom:2px}
.topic-pick-sub{font-size:12px;color:var(--text-muted)}
.topic-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.topic-actions button{padding:8px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.topic-actions button:hover{border-color:var(--accent);color:var(--accent-deep)}
.summary-box{padding:18px;background:var(--card-2);border-radius:18px;margin-bottom:18px;text-align:center}
.summary-box .lbl{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.summary-box .val{font-size:26px;font-weight:700}
.summary-box .sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.classify-hint{font-size:12px;color:var(--text-muted);margin-bottom:10px;font-weight:500}
.classify-input{width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--border);background:var(--card-2);color:var(--text);font-family:inherit;font-size:15px;font-weight:500;transition:border-color .2s;outline:none}
.classify-input:focus{border-color:var(--accent);background:var(--card)}
.classify-input::placeholder{color:var(--text-muted);opacity:0.7}
.classify-result{margin-top:18px;padding:18px;background:var(--card-2);border-radius:16px;display:flex;flex-direction:column;gap:8px}
.classify-line{font-size:14px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.classify-mark{font-weight:700;flex-shrink:0;width:20px;text-align:center}
.classify-mark.ok{color:var(--success)}
.classify-mark.miss{color:var(--error)}
.classify-mark.extra{color:var(--warm)}
.conspect{margin-top:20px;padding:20px;background:var(--card-2);border-radius:18px;display:flex;flex-direction:column;gap:16px}
.conspect-block{display:flex;flex-direction:column;gap:6px}
.conspect-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--accent-deep)}
.conspect-text{font-size:13px;line-height:1.6;color:var(--text)}
.conspect-list{margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:var(--text)}
.conspect-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.conspect-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.conspect-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.conspect-card-title{font-size:15px;font-weight:700}
.conspect-card-drugs{font-size:12px;color:var(--text-muted);margin-bottom:14px;font-weight:500}

.viz-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.viz-tab{padding:10px 16px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.viz-tab:hover{border-color:var(--accent);color:var(--text)}
.viz-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.synapse-wrap{max-width:1100px;margin:0 auto}
.synapse-scenarios{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.scen-btn{padding:8px 14px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.scen-btn:hover{border-color:var(--accent);color:var(--accent-deep)}
.scen-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 10px rgba(232,131,106,0.25)}
.synapse-stage{position:relative;background:#1a2138;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.synapse-svg,.eye-svg{display:block;width:100%;height:auto}
.synapse-svg .synapse-el,.eye-svg .synapse-el{cursor:pointer;transition:filter .2s}
.synapse-svg .synapse-el:hover,.eye-svg .synapse-el:hover{filter:brightness(1.35) drop-shadow(0 0 10px rgba(255,180,120,0.8))}
.synapse-tooltip{position:absolute;padding:8px 12px;background:rgba(20,28,40,0.95);color:#fff;font-size:12px;font-weight:600;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;white-space:nowrap;border:1px solid rgba(255,255,255,0.15)}
.synapse-tooltip.show{opacity:1}
.synapse-info{padding:20px;background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm);margin-bottom:16px;min-height:90px}
.synapse-info-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text)}
.synapse-info-desc{font-size:13px;line-height:1.6;color:var(--text-muted)}
.synapse-chain{padding:20px;background:var(--accent-soft);border-radius:20px;border-left:4px solid var(--accent)}
.synapse-chain-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--accent-deep);margin-bottom:8px}
.synapse-chain-text{font-size:14px;line-height:1.6;color:var(--text)}
.ach-float{animation:achFloat 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vesicle-bob{animation:vesicleBob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vesicle-bob.d1{animation-delay:-0.7s}
.vesicle-bob.d2{animation-delay:-1.5s}
.vesicle-bob.d3{animation-delay:-2.3s}
.ache-pulse{animation:achePulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ca-ion-flow{animation:caFlow 3s linear infinite;transform-box:fill-box;transform-origin:center}
.ca-ion-flow.d1{animation-delay:-1.5s}
.na-ion-flow{animation:naFlow 3.5s linear infinite;transform-box:fill-box;transform-origin:center}
.na-ion-flow.d1{animation-delay:-1.2s}
.na-ion-flow.d2{animation-delay:-2.4s}
.m-recept,.n-recept{transform-box:fill-box;transform-origin:center;transition:filter .3s}
.ca-channel-anim{transform-box:fill-box;transform-origin:center;animation:channelGlow 2.5s ease-in-out infinite}
.block-x{display:none}
.eye-svg .iris-el,.eye-svg .lens-el{transition:transform .5s ease;transform-box:fill-box;transform-origin:center}

@keyframes achFloat{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(5px,-7px) rotate(8deg)}50%{transform:translate(-3px,-12px) rotate(-5deg)}75%{transform:translate(-7px,-5px) rotate(6deg)}}
@keyframes vesicleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes achePulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.2)}}
@keyframes caFlow{0%{transform:translate(0,-45px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,45px);opacity:0}}
@keyframes naFlow{0%{transform:translate(0,25px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,-55px);opacity:0}}
@keyframes channelGlow{0%,100%{filter:drop-shadow(0 0 3px #a88adf)}50%{filter:drop-shadow(0 0 12px #d0b8ff)}}
@keyframes receptorPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes receptorFade{0%,100%{opacity:1}50%{opacity:0.5}}
.synapse-svg[data-scenario="m-agonist"] .m-recept{animation:receptorPulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #c8aaff) brightness(1.3)}
.synapse-svg[data-scenario="n-agonist"] .n-recept{animation:receptorPulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #7ce8c8) brightness(1.3)}
.synapse-svg[data-scenario="m-blocker"] .m-recept{animation:receptorFade 2.5s ease-in-out infinite;filter:drop-shadow(0 0 10px #ff6080) brightness(0.7)}
.synapse-svg[data-scenario="m-blocker"] .m-recept .block-x{display:block}
.synapse-svg[data-scenario="n-blocker"] .n-recept{animation:receptorFade 2.5s ease-in-out infinite;filter:drop-shadow(0 0 10px #ff6080) brightness(0.7)}
.synapse-svg[data-scenario="n-blocker"] .n-recept .block-x{display:block}
.synapse-svg[data-scenario="ache-block"] .ache,.synapse-svg[data-scenario="fos"] .ache{filter:drop-shadow(0 0 16px #ff4060) brightness(1.15);animation:achePulse 1.5s ease-in-out infinite}
.synapse-svg[data-scenario="ache-block"] .ach-float,.synapse-svg[data-scenario="fos"] .ach-float{animation-duration:1.4s;filter:drop-shadow(0 0 10px #ff80a0)}
.synapse-svg[data-scenario="ache-block"] .n-recept,.synapse-svg[data-scenario="fos"] .n-recept{animation:receptorPulse 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #7ce8c8) brightness(1.3)}
.synapse-svg[data-scenario="ache-block"] .m-recept,.synapse-svg[data-scenario="fos"] .m-recept{animation:receptorPulse 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #c8aaff) brightness(1.3)}
.synapse-svg[data-scenario="reactivator"] .ache{filter:drop-shadow(0 0 18px #7fc99a) brightness(1.4);animation:achePulse 2s ease-in-out infinite}
.synapse-svg[data-scenario="botox"] .vesicle-bob{opacity:0.35;filter:grayscale(1);animation-play-state:paused}
.synapse-svg[data-scenario="botox"] .ach-float{opacity:0.15;animation-play-state:paused}
.synapse-svg[data-scenario="normal"] .ca-channel-anim{filter:drop-shadow(0 0 8px #b8a0ff)}

.eye-svg[data-scenario="m-agonist"] .iris-el{transform:translateY(var(--iris-shift))}
.eye-svg[data-scenario="m-agonist"] .lens-el{transform:scaleY(1.2)}
.eye-svg[data-scenario="m-blocker"] .iris-el{transform:translateY(var(--iris-shift))}
.eye-svg[data-scenario="m-blocker"] .lens-el{transform:scaleY(0.85)}
.eye-svg[data-scenario="acute-glaucoma"] .iris-el{transform:translateY(var(--iris-shift))}
.eye-svg[data-scenario="acute-glaucoma"] .trabecular-el{filter:drop-shadow(0 0 10px #ff3040) brightness(1.3)}
.eye-svg[data-scenario="acute-glaucoma"] .iris-el{filter:drop-shadow(0 0 8px #ff5060)}

@media (max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.row-2{grid-template-columns:1fr}}
@media (max-width:768px){
  .sidebar{top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;padding:10px 8px;gap:4px;overflow-x:auto;border-radius:24px 24px 0 0}

  .nav-btn svg{width:22px;height:22px}

  .hero{padding:24px;border-radius:24px}

  .question-card,.case-card,.report-card,.case-picker{padding:24px 20px;border-radius:24px}
  .q-text{font-size:16px}
  .report-stats{grid-template-columns:1fr 1fr}
  .theme-toggle span{display:none}
  .stat-value{font-size:24px}
  .synapse-stage{border-radius:16px}
}
</style>

};
const SKILL_LIST=['Классификация','Механизм','Показания','Побочки'];
const QUESTIONS=[
{id:'q_001',section:'Холиномиметики',text:'Какой препарат относится к прямым М-холиномиметикам?',options:['Пилокарпин','Неостигмин','Цитизин','Карбоксим'],correct:0,explanation:'Пилокарпин — прямой М-холиномиметик, действует непосредственно на М-холинорецепторы. Неостигмин — непрямой (оиХЭ периферического действия), цитизин — частичный агонист Н-ХР, карбоксим — реактиватор холинэстеразы.',tags:['Прямые холиномиметики','Механизм','Пилокарпин','Сложность 1'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_002',section:'Холиномиметики',text:'Пациенту с болезнью Альцгеймера назначен Галантамин. К какой группе он относится?',options:['М-холиномиметик','оиХЭ центрального действия','оиХЭ периферического действия','Реактиватор холинэстеразы'],correct:1,explanation:'Галантамин (Нивалин) — обратимый ингибитор холинэстеразы центрального действия. Проникает через ГЭБ, повышает концентрацию ацетилхолина в ЦНС.',tags:['оиХЭ центрального действия','Показания','Галантамин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_003',section:'Холиномиметики',text:'Какой препарат является частичным агонистом Н-ХР и применяется для отказа от курения?',options:['Никотин','Варениклин','Карбахол','Ипидакрин'],correct:1,explanation:'Варениклин (Чампикс) — частичный агонист Н-ХР. Слабее никотина, но блокирует его эффект от сигарет.',tags:['Н-холиномиметики','Показания','Варениклин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_004',section:'Холиномиметики',text:'Через 30 минут после введения Неостигмина появились брадикардия, слюнотечение и спазм аккомодации. Что произошло?',options:['Аллергическая реакция','Передозировка с развитием мускариновых эффектов','Анафилактический шок','Никотиновые эффекты'],correct:1,explanation:'Неостигмин — оиХЭ периферического действия. При передозировке накапливается ацетилхолин → мускариновые эффекты (SLUDGE-синдром). Антидот — атропин.',tags:['оиХЭ периферического действия','Побочки','Неостигмин','Сложность 3'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_005',section:'Холиномиметики',text:'Какой препарат применяется как реактиватор холинэстеразы при отравлении ФОС?',options:['Пилокарпин','Карбоксим','Донепезил','Цитизин'],correct:1,explanation:'Карбоксим разрушает связь ФОС с ферментом и восстанавливает его активность. Применяется вместе с атропином.',tags:['Реактиваторы холинэстеразы','Антидот','Карбоксим','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_006',section:'Холиноблокаторы',text:'Какой механизм действия у атропина?',options:['Блокада М-холинорецепторов','Блокада Н-холинорецепторов','Ингибирование холинэстеразы','Стимуляция М-холинорецепторов'],correct:0,explanation:'Атропин — неселективный М-холиноблокатор. Конкурентно блокирует М-рецепторы: расширяет зрачок, вызывает тахикардию, снижает секрецию, расслабляет гладкую мускулатуру.',tags:['М-холиноблокаторы','Механизм','Атропин','Сложность 1'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_007',section:'Холиноблокаторы',text:'Пациент 65 лет с гиперактивным мочевым пузырём. Какой препарат предпочтителен?',options:['Атропин','Солифенацин','Пилокарпин','Прозерин'],correct:1,explanation:'Солифенацин (Везикар) — селективный урологический М-ХБ. Избирательно блокирует М3-рецепторы детрузора.',tags:['Урологические М-ХБ','Показания','Солифенацин','Сложность 2'],source:'Харкевич Д.А. + клин. рекомендации'},
{id:'q_008',section:'Холиноблокаторы',text:'Какой ингаляционный М-ХБ длительного действия применяется при ХОБЛ?',options:['Ипратропия бромид','Тиотропия бромид','Атропин','Гиосцина бутилбромид'],correct:1,explanation:'Тиотропия бромид (Спирива) — М-ХБ длительного действия (24 ч), 1 раз в сутки при ХОБЛ.',tags:['Ингаляционные М-ХБ','Показания','Тиотропия бромид','Сложность 2'],source:'Харкевич Д.А. + клин. рекомендации по ХОБЛ'},
{id:'q_009',section:'Холиноблокаторы',text:'Для диагностики глазного дна нужно расширить зрачок на несколько часов. Какой препарат?',options:['Пилокарпин','Тропикамид','Тимолол','Бримонидин'],correct:1,explanation:'Тропикамид — офтальмологический М-ХБ, вызывает мидриаз и циклоплегию на 4–6 ч.',tags:['Офтальмологические М-ХБ','Показания','Тропикамид','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_010',section:'Холиноблокаторы',text:'Пациенту с болезнью Паркинсона назначен Тригексифенидил. К какой группе он относится?',options:['Периферический М-ХБ','Центральный М-ХБ','Ганглиоблокатор','Миорелаксант центрального действия'],correct:1,explanation:'Тригексифенидил (Паркопан) — центральный М-ХБ. Блокада центральных М-рецепторов восстанавливает баланс дофамин/ацетилхолин.',tags:['Центральные М-ХБ','Механизм','Тригексифенидил','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_011',section:'Миорелаксанты',text:'Какой препарат относится к деполяризующим миорелаксантам?',options:['Пипекурония бромид','Рокурония бромид','Суксаметония йодид','Атракурия безилат'],correct:2,explanation:'Суксаметоний (дитилин) — единственный деполяризующий миорелаксант. Применяется для кратковременной релаксации.',tags:['Миорелаксанты','Механизм','Суксаметоний','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_012',section:'Миорелаксанты',text:'Каким препаратом устранить действие недеполяризующего миорелаксанта после операции?',options:['Атропин','Неостигмин','Суксаметоний','Карбоксим'],correct:1,explanation:'Неостигмин повышает концентрацию ацетилхолина, который competitively вытесняет миорелаксант из связи с Н-ХР. Применяется с атропином.',tags:['Миорелаксанты','Антидот','Неостигмин','Сложность 3'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_013',section:'Миорелаксанты',text:'Механизм действия ботулинического токсина типа А?',options:['Блокада Н-ХР','Нарушение высвобождения АХ из везикул','Ингибирование холинэстеразы','Блокада М-ХР'],correct:1,explanation:'Ботулотоксин типа А нарушает высвобождение ацетилхолина из пресинаптических везикул. Эффект длится 3–6 месяцев.',tags:['Средства, нарушающие высвобождение АХ','Механизм','Ботулотоксин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_014',section:'Миорелаксанты',text:'Какой препарат является миорелаксантом центрального действия?',options:['Суксаметоний','Пипекурония бромид','Толперизон','Дантролен'],correct:2,explanation:'Толперизон (Калмирекс, Мидокалм) снижает патологически повышенный мышечный тонус через ЦНС.',tags:['Миорелаксанты центрального действия','Механизм','Толперизон','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_015',section:'Миорелаксанты',text:'Какой препарат применяется при злокачественной гипертермии на фоне суксаметония?',options:['Атропин','Неостигмин','Дантролен','Пропранолол'],correct:2,explanation:'Злокачественная гипертермия — осложнение суксаметония. Антидот — дантролен, блокирующий рианодиновые рецепторы.',tags:['Миорелаксанты','Побочки','Дантролен','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации'},
{id:'q_016',section:'Адреномиметики',text:'Какой рецепторный профиль у эпинефрина (адреналина)?',options:['Только α1','Только β1','α1, α2, β1, β2','Только β2'],correct:2,explanation:'Эпинефрин — неселективный α-,β-адреномиметик. Действует на все типы адренорецепторов. Препарат выбора при анафилактическом шоке.',tags:['Неселективные α-,β-АМ','Механизм','Эпинефрин','Сложность 1'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_017',section:'Адреномиметики',text:'Чем отличается норэпинефрин от эпинефрина по действию на рецепторы?',options:['Действует только на β2','Действует на α1, α2, β1, но не на β2','Действует только на α1','Действует только на β1'],correct:1,explanation:'Норэпинефрин действует на α1, α2 и β1, но не на β2. Сильнее сужает сосуды, но не расширяет бронхи.',tags:['Неселективные α-,β-АМ','Механизм','Норэпинефрин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_018',section:'Адреномиметики',text:'Пациенту с кардиогенным шоком назначен допамин в низких дозах. Какой эффект ожидается?',options:['Сужение сосудов почек','Расширение почечных сосудов и усиление диуреза','Бронхоспазм','Брадикардия'],correct:1,explanation:'В низких дозах допамин действует на D1-рецепторы почек → расширение почечных сосудов, усиление диуреза.',tags:['Дофаминергические средства','Показания','Допамин','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации'},
{id:'q_019',section:'Адреномиметики',text:'Какой препарат применяется как топический деконгестант при насморке?',options:['Фенилэфрин системно','Ксилометазолин','Бримонидин','Добутамин'],correct:1,explanation:'Ксилометазолин (Отривин) — α1,2-АМ местного действия. Сужает сосуды слизистой носа, уменьшает отёк. Курс не более 5–7 дней.',tags:['Топические деконгестанты','Показания','Ксилометазолин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_020',section:'Адреномиметики',text:'Какой препарат применяется для лечения открытоугольной глаукомы как α2-адреномиметик?',options:['Тетризолин','Бримонидин','Фенилэфрин','Сальбутамол'],correct:1,explanation:'Бримонидин (Альфаган) — α2-АМ для офтальмологии. Снижает продукцию внутриглазной жидкости и увеличивает отток.',tags:['Офтальмологические α2-АМ','Показания','Бримонидин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_021',section:'Адреномиметики',text:'Механизм действия клонидина (Клофелина)?',options:['Блокада α1-рецепторов','Стимуляция α2-рецепторов ЦНС','Блокада β1-рецепторов','Стимуляция β2-рецепторов'],correct:1,explanation:'Клонидин — α2-АМ центрального действия. Стимулирует α2-рецепторы в продолговатом мозге → брадикардия, снижение АД.',tags:['α2-АМ центрального действия','Механизм','Клонидин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_022',section:'Адреномиметики',text:'Какой препарат является β1-адреномиметиком и применяется при острой сердечной недостаточности?',options:['Сальбутамол','Добутамин','Мирабегрон','Фенотерол'],correct:1,explanation:'Добутамин — селективный β1-АМ. Усиливает сократимость миокарда, увеличивает сердечный выброс. При острой декомпенсации ХСН.',tags:['β1-АМ','Показания','Добутамин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_023',section:'Адреномиметики',text:'Какой β2-адреномиметик короткого действия применяется для купирования приступа бронхиальной астмы?',options:['Салметерол','Формотерол','Сальбутамол','Индакатерол'],correct:2,explanation:'Сальбутамол (Вентолин) — β2-АМ короткого действия (4–6 ч). Для купирования приступа. Салметерол и формотерол — длительного действия.',tags:['β2-АМ короткого действия','Показания','Сальбутамол','Сложность 2'],source:'Харкевич Д.А. + клин. рекомендации по астме'},
{id:'q_024',section:'Адреномиметики',text:'Какой препарат применяется как токолитик при угрозе преждевременных родов?',options:['Сальбутамол','Гексопреналин','Добутамин','Мирабегрон'],correct:1,explanation:'Гексопреналин (Гинипрал) — β2-АМ токолитического действия. Расслабляет миометрий.',tags:['β2-АМ токолитики','Показания','Гексопреналин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_025',section:'Адреномиметики',text:'Какой препарат является β3-адреномиметиком и применяется при гиперактивном мочевом пузыре?',options:['Солифенацин','Мирабегрон','Фенилэфрин','Добутамин'],correct:1,explanation:'Мирабегрон (Бетмига) — β3-АМ. Расслабляет детрузор. Не даёт сухости во рту, хорошая альтернатива у пожилых.',tags:['β3-АМ','Показания','Мирабегрон','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации по СНМП'},
{id:'q_026',section:'Адреноблокаторы',text:'Какой препарат является α,β-адреноблокатором?',options:['Метопролол','Карведилол','Доксазозин','Пропранолол'],correct:1,explanation:'Карведилол — единственный α1-,β1-,β2-АБ. Блокирует β1,β2 и α1. Применяется при ХСН, ИБС, АГ.',tags:['α,β-АБ','Механизм','Карведилол','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_027',section:'Адреноблокаторы',text:'Пациент 68 лет с аденомой простаты и СНМП. Какой препарат предпочтителен?',options:['Атенолол','Тамсулозин','Пропранолол','Клонидин'],correct:1,explanation:'Тамсулозин (Омник) — уроселективный α1-АБ. Блокирует α1A-рецепторы в простате, улучшая отток мочи. Минимально влияет на АД.',tags:['Уроселективные α1-АБ','Показания','Тамсулозин','Сложность 2'],source:'Харкевич Д.А. + клин. рекомендации по ДГПЖ'},
{id:'q_028',section:'Адреноблокаторы',text:'Какой β-блокатор применяется для неотложной терапии гипертонического криза и расслаивающей аневризмы аорты?',options:['Метопролол','Эсмолол','Бисопролол','Атенолол'],correct:1,explanation:'Эсмолол (Бревиблок) — ультракороткодействующий β1-АБ. Эффект начинается через 1–2 мин, заканчивается через 10–30 мин после инфузии.',tags:['Ультракороткодействующие β1-АБ','Показания','Эсмолол','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации'},
{id:'q_029',section:'Адреноблокаторы',text:'Какой β-блокатор обладает дополнительным вазодилатирующим действием?',options:['Метопролол','Пропранолол','Небиволол','Бисопролол'],correct:2,explanation:'Небиволол (Небилет) — селективный β1-АБ с вазодилатацией за счёт модуляции высвобождения NO в эндотелии.',tags:['β1-АБ с вазодилатацией','Механизм','Небиволол','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_030',section:'Адреноблокаторы',text:'Почему неселективные β-блокаторы опасны у пациентов с бронхиальной астмой?',options:['Вызывают тахикардию','Блокируют β2-рецепторы бронхов → бронхоспазм','Повышают АД','Вызывают гипергликемию'],correct:1,explanation:'Неселективные β1,β2-АБ (пропранолол, тимолол, соталол) блокируют β2-рецепторы бронхов → бронхоспазм.',tags:['Неселективные β-АБ','Противопоказания','Пропранолол','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_031',section:'Адреноблокаторы',text:'Механизм действия метилдопы?',options:['Блокада α1-рецепторов','Стимуляция α2-рецепторов ЦНС (ложный медиатор)','Блокада β1-рецепторов','Блокада кальциевых каналов'],correct:1,explanation:'Метилдопа (Допегит) — симпатолитик центрального действия. Превращается в α-метилнорадреналин (ложный медиатор), стимулирующий α2-рецепторы в ЦНС.',tags:['Симпатолитики','Механизм','Метилдопа','Сложность 3'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_032',section:'Адреноблокаторы',text:'Какой α1-АБ применяется для неотложной антигипертензивной терапии?',options:['Тамсулозин','Урапидил','Доксазозин','Йохимбин'],correct:1,explanation:'Урапидил (Эбрантил) — α1-АБ с центральным компонентом. Блокирует α1-рецепторы сосудов и стимулирует 5-HT1A-рецепторы ЦНС. В/в при гипертоническом кризе.',tags:['α1-АБ для неотложной терапии','Показания','Урапидил','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации'},
{id:'q_033',section:'Адреноблокаторы',text:'Какой препарат является неселективным α1,α2-АБ и применяется при нарушениях мозгового кровообращения?',options:['Ницерголин','Доксазозин','Теразозин','Силодозин'],correct:0,explanation:'Ницерголин (Сермион) — неселективный α1,α2-АБ. Расширяет периферические и мозговые сосуды, улучшает кровоток.',tags:['Неселективные α-АБ','Показания','Ницерголин','Сложность 3'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_034',section:'Адреноблокаторы',text:'Пациенту с ХСН и тахикардией планируется назначить β-блокатор. Какой препарат предпочтителен?',options:['Пропранолол','Бисопролол','Тимолол','Соталол'],correct:1,explanation:'Бисопролол (Конкор) — кардиоселективный β1-АБ. Один из четырёх β-блокаторов, доказавших эффективность при ХСН.',tags:['Селективные β1-АБ','Показания','Бисопролол','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации по ХСН'},
{id:'q_035',section:'Адреноблокаторы',text:'Какое побочное действие характерно для α1-адреноблокаторов?',options:['Бронхоспазм','Ортостатическая гипотензия','Брадикардия','Гиперкалиемия'],correct:1,explanation:'α1-АБ вызывают вазодилатацию → ортостатическая гипотензия, особенно после первой дозы. У уроселективных (тамсулозин) меньше.',tags:['α1-АБ','Побочки','Доксазозин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'}
];

const THEORY=[
{icon:'⚡',color:'var(--accent)',bg:'var(--accent-soft)',title:'Холинергический синапс',sub:'5 этапов передачи сигнала',body:`
<h4>1. Синтез ацетилхолина</h4>
<p>В пресинаптическом окончании: <strong>холин + ацетил-КоА → ацетилхолин</strong> с участием фермента <strong>холинацетилтрансферазы</strong>.</p>
<h4>2. Накопление в везикулах</h4>
<p>АХ упаковывается в синаптические везикулы и хранится до прихода нервного импульса.</p>
<h4>3. Экзоцитоз (выброс)</h4>
<p>При поступлении импульса открываются <strong>потенциалзависимые Ca²⁺-каналы</strong> → Ca²⁺ входит в клетку → везикулы сливаются с мембраной → АХ выходит в щель.</p>
<h4>4. Действие на рецепторы</h4>
<p>АХ связывается с <strong>М-</strong> или <strong>Н-холинорецепторами</strong> на постсинаптической мембране → изменение функции следующей клетки.</p>
<h4>5. Инактивация</h4>
<p><strong>Ацетилхолинэстераза (АХЭ)</strong> быстро расщепляет АХ на холин и ацетат. Холин возвращается в окончание и используется повторно. Если АХЭ подавлена — АХ накапливается и действует дольше.</p>
`},
{icon:'АХЭ',color:'var(--mint)',bg:'var(--mint-soft)',title:'АХЭ и БХЭ — две холинэстеразы',sub:'Зачем их различать',body:`
<h4>Ацетилхолинэстераза (АХЭ)</h4>
<p>Основной фермент, который <strong>быстро</strong> прекращает сигнал в синапсе. Расщепляет АХ на холин и ацетат.</p>
<h4>Бутирилхолинэстераза (БХЭ)</h4>
<p>Она же плазменная или псевдохолинэстераза. Синтезируется в печени, циркулирует в крови, есть и в тканях. Тоже расщепляет АХ, но <strong>медленнее</strong>.</p>
<h4>Почему это важно</h4>
<ul>
<li><strong>Ривастигмин</strong> подавляет <em>оба</em> фермента — АХЭ и БХЭ. Поэтому в механизме указывают и то, и другое.</li>
<li><strong>Суксаметоний</strong> (миорелаксант) расщепляется БХЭ. При сниженной активности фермента блокада затягивается, вплоть до паралича дыхательных мышц.</li>
</ul>
`},
{icon:'М',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'М-холинорецепторы (М1–М5)',sub:'Метаботропные, связаны с G-белком',body:`
<h4>Общее</h4>
<p>Название — от чувствительности к <strong>мускарину</strong>. Передают сигнал через G-белки и вторые посредники.</p>
<h4>М1</h4>
<p><strong>Где:</strong> нейроны головного мозга (обучение, память), нейроны вегетативных ганглиев, нервные сплетения ЖКТ.<br><strong>Эффект:</strong> повышение возбудимости нейронов.</p>
<h4>М2</h4>
<p><strong>Где:</strong> сердце (синусовый и AV-узлы), пресинаптические окончания.<br><strong>Эффект:</strong> брадикардия, замедление AV-проведения. На пресинапсе — уменьшение выброса АХ.</p>
<h4>М3</h4>
<p><strong>Где:</strong> гладкие мышцы бронхов, ЖКТ, детрузор, сфинктер зрачка, цилиарная мышца, железы, эндотелий сосудов.<br><strong>Эффект:</strong> бронхоспазм, усиление моторики и секреции, миоз, спазм аккомодации, вазодилатация (через NO).</p>
<h4>М4, М5</h4>
<p>Преимущественно ЦНС. М4 — уменьшение выброса АХ на ряде окончаний, влияние на дофаминовые цепи. М5 — модуляция дофаминовой передачи.</p>
`},
{icon:'Н',color:'var(--success)',bg:'var(--success-soft)',title:'Н-холинорецепторы (Нн и Нм)',sub:'Ионотропные — сами ионные каналы',body:`
<h4>Общее</h4>
<p>Название — от чувствительности к <strong>никотину</strong>. При связывании с АХ открывают канал для катионов → деполяризация мембраны.</p>
<h4>Нн — нейрональные</h4>
<p><strong>Где:</strong> вегетативные ганглии (симпатические и парасимпатические), мозговое вещество надпочечников (хромаффинные клетки), ЦНС.<br><strong>Эффект:</strong> передача сигнала через ганглий; выброс адреналина/норадреналина в кровь; в ЦНС — внимание, обучение, зависимость.</p>
<h4>Нм — мышечные</h4>
<p><strong>Где:</strong> концевая пластинка скелетного мышечного волокна.<br><strong>Эффект:</strong> деполяризация → сокращение мышцы.</p>
<h4>Важно</h4>
<p>Длительная чрезмерная стимуляция Нм → сначала подёргивания (фасцикуляции), затем слабость и паралич — из-за стойкой деполяризации мембрана не может «перезарядиться».</p>
`},
{icon:'👁',color:'var(--warm)',bg:'var(--warm-soft)',title:'Эффекты холинергической стимуляции',sub:'По органам и системам',body:`
<h4>Глаз</h4>
<ul><li>Сфинктер радужки сокращается → <strong>миоз</strong></li><li>Цилиарная мышца сокращается → <strong>спазм аккомодации</strong>, зрение вблизи</li><li>Улучшение оттока водянистой влаги → снижение ВГД</li></ul>
<h4>Сердце (М2)</h4>
<ul><li>Уменьшение ЧСС, замедление AV-проведения → брадикардия, возможны блокады, обмороки</li></ul>
<h4>Бронхи (М3)</h4>
<ul><li>Бронхоспазм, усиление бронхиальной секреции (бронхорея) — опасные реакции</li></ul>
<h4>ЖКТ (М3)</h4>

<ul><li>Сокращение детрузора → облегчение опорожнения</li></ul>
<h4>Железы (М3)</h4>
<ul><li>Усиление слюно-, слезо- и потоотделения — признаки избыточной холинергической стимуляции</li></ul>
<h4>Скелетные мышцы (Нм)</h4>
<ul><li>Улучшение передачи при миастении; при передозировке — нарастание слабости</li></ul>
<h4>Сосуды</h4>
<ul><li>Большинство не имеет парасимпатической иннервации. Но М3 на эндотелии → NO → вазодилатация при действии агониста</li></ul>
`}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function editDist(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);}return dp[m][n];}
function normalize(s){return s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,'').replace(/[^а-яa-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim();}
function isDrugMatch(input,drug){const a=normalize(input),b=normalize(drug);if(!a||a.length<4)return false;if(a===b)return true;if(b.startsWith(a)||a.startsWith(b))return true;const threshold=Math.max(1,Math.floor(Math.max(a.length,b.length)/6));return editDist(a,b)<=threshold;}
function classifyCheck(input,drugs){
  const parts=input.split(/[,;]+/).map(s=>s.trim()).filter(s=>s);
  const usedDrugs=new Set();const usedInputs=new Set();const matched=[];
  parts.forEach((p,pi)=>{drugs.forEach((d,di)=>{if(usedDrugs.has(di))return;if(isDrugMatch(p,d)){usedDrugs.add(di);usedInputs.add(pi);matched.push(d);}});});
  const missed=drugs.filter((d,i)=>!usedDrugs.has(i));
  const extra=parts.filter((p,i)=>!usedInputs.has(i));
  return {matched,missed,extra,correct:matched.length,total:drugs.length};
}

  const selectedCount=sections.filter(s=>state.selectedTopics[s]).length;
  const activeSkills=SKILL_LIST.filter(s=>state.selectedSkills[s]);
  const totalSelected=sections.filter(s=>state.selectedTopics[s]).reduce((sum,s)=>{

function toggleSkill(s){
  state.selectedSkills[s]=!state.selectedSkills[s];
  renderSessionSetup();
}
function toggleTopic(sec){state.selectedTopics[sec]=!state.selectedTopics[sec];renderSessionSetup();}
function selectAllTopics(v){const sections=[...new Set(QUESTIONS.map(q=>q.section))];sections.forEach(s=>state.selectedTopics[s]=v);state.selectedTopics._init=true;renderSessionSetup();}
function startSession(){
  const sections=[...new Set(QUESTIONS.map(q=>q.section))];
  const selected=sections.filter(s=>state.selectedTopics[s]);
  const activeSkills=SKILL_LIST.filter(s=>state.selectedSkills[s]);
  let pool=QUESTIONS.filter(q=>selected.includes(q.section) && activeSkills.includes(SKILLS[q.id]));
  if(pool.length===0){alert('Нет вопросов под выбранные фильтры');return;}
  pool=shuffle(pool);
  state.session={questions:pool,index:0,answers:[]};
  titleEl.textContent='Тестирование';
  renderQuestion();
}
function renderQuestion(){
  const s=state.session;
  if(s.index>=s.questions.length){renderReport();return}
  const q=s.questions[s.index];
  const progress=(s.index/s.questions.length)*100;
  screenEl.innerHTML=`
    <div class="question-card">
      <div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${progress}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.questions.length}</span></div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px">${q.section}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options" id="qOptions">${q.options.map((opt,i)=>`<button class="q-option" onclick="answerQuestion(${i})"><span class="q-option-letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></button>`).join('')}</div>
      <div id="feedbackArea"></div>
    </div>`;
}
function answerQuestion(i){
  const s=state.session;const q=s.questions[s.index];
  const buttons=document.querySelectorAll('#qOptions .q-option');
  buttons.forEach(b=>b.disabled=true);
  const isCorrect=i===q.correct;
  buttons[i].classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect)buttons[q.correct].classList.add('correct');
  s.answers.push({id:q.id,correct:isCorrect,section:q.section});
  if(!state.progress[q.id])state.progress[q.id]={correct:0,wrong:0};
  if(isCorrect)state.progress[q.id].correct++;else state.progress[q.id].wrong++;
  saveProgress();
  document.getElementById('feedbackArea').innerHTML=`
    <div class="explanation">
      <h4>${isCorrect?'✓ Верно':'✗ Правильный ответ: '+String.fromCharCode(65+q.correct)}</h4>
      <p>${q.explanation}</p>
      <div class="tags">${q.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="source">Источник: ${q.source}</div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">${s.index+1>=s.questions.length?'Завершить тест':'Следующий вопрос'}</button>`;
}
function nextQuestion(){state.session.index++;renderQuestion()}
function renderReport(){
  const s=state.session;
  const correct=s.answers.filter(a=>a.correct).length;
  const total=s.answers.length;
  const pct=Math.round(correct/total*100);
  const wrongIds=s.answers.filter(a=>!a.correct).map(a=>a.id);
  const wrongQs=QUESTIONS.filter(q=>wrongIds.includes(q.id));
  const weakTags=[...new Set(wrongQs.flatMap(q=>q.tags.slice(0,2)))];
  state.progress._sessions=(state.progress._sessions||0)+1;
  saveProgress();
  screenEl.innerHTML=`
    <div class="report-card">
      <div class="report-emoji">${pct>=80?'🎉':pct>=50?'👍':'📚'}</div>
      <div class="report-title">Тест завершён</div>
      <div class="report-sub">${total} вопросов</div>
      <div class="report-stats">
        <div class="report-stat"><div class="report-stat-val" style="color:var(--success)">${correct}</div><div class="report-stat-lbl">правильно</div></div>
        <div class="report-stat"><div class="report-stat-val" style="color:var(--error)">${total-correct}</div><div class="report-stat-lbl">ошибок</div></div>
        <div class="report-stat"><div class="report-stat-val">${pct}%</div><div class="report-stat-lbl">точность</div></div>
      </div>
      ${weakTags.length?`<div class="report-weak"><h4>Слабые места — стоит повторить:</h4><div class="weak-list">${weakTags.map(t=>`<div class="weak-item">${t}</div>`).join('')}</div></div>`:`<div style="padding:16px;background:var(--success-soft);border-radius:12px;margin-bottom:20px;color:#2f8b5c;font-weight:700;font-size:14px">Отличный результат!</div>`}
      <div style="display:flex;gap:12px;flex-wrap:wrap">

      </div>
      <button class="next-btn" style="background:transparent;color:var(--text-muted);margin-top:8px;box-shadow:none" onclick="setScreen('dashboard')">На главную</button>

}

function startClassify(){
  const sections=[...new Set(GROUPS.map(g=>g.section))];
  const selected=sections.filter(s=>state.selectedClassifySections[s]);
  let pool=GROUPS.filter(g=>selected.includes(g.section));
  if(pool.length===0){alert('Выбери хотя бы один раздел');return;}
  pool=shuffle(pool);
  state.classifySession={groups:pool,index:0,results:[]};
  titleEl.textContent='Классификация';
  renderClassifyQuestion();

function renderClassifyQuestion(){
  const s=state.classifySession;
  if(s.index>=s.groups.length){renderClassifyReport();return;}
  const g=s.groups[s.index];
  const progress=(s.index/s.groups.length)*100;
  screenEl.innerHTML=`
    <div class="question-card">
      <div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${progress}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.groups.length}</span></div>

function checkClassifyAnswer(){
  const s=state.classifySession;
  const g=s.groups[s.index];
  const input=document.getElementById('classifyInput').value;
  const res=classifyCheck(input,g.drugs);
  s.results.push({group:g.group,section:g.section,...res});
  const status=res.correct===res.total?'good':res.correct===0?'bad':'partial';
  const headerText=status==='good'?'✓ Всё верно':status==='partial'?`~ Частично: ${res.correct} из ${res.total}`:'✗ Ничего не угадано';
  const headerClass=status==='good'?'good':status==='bad'?'bad':'neutral';
  screenEl.innerHTML=`
    <div class="question-card">
      <div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${((s.index+1)/s.groups.length)*100}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.groups.length}</span></div>

        ${res.extra.length?`<div class="classify-line"><span class="classify-mark extra">+</span> Лишнее: ${res.extra.join(', ')}</div>`:''}
      </div>

      </div>
      <button class="next-btn" onclick="nextClassify()">${s.index+1>=s.groups.length?'Завершить':'Следующая группа'}</button>
    </div>`;
}

  const svg=document.getElementById('eyeSvg');
  const tooltip=document.getElementById('eyeTooltip');
  const stage=svg.parentElement;
  svg.querySelectorAll('.synapse-el').forEach(el=>{
    el.addEventListener('mousemove',e=>{const r=stage.getBoundingClientRect();tooltip.textContent=el.dataset.name;tooltip.style.left=(e.clientX-r.left+14)+'px';tooltip.style.top=(e.clientY-r.top+14)+'px';tooltip.classList.add('show')});
    el.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));
    el.addEventListener('click',()=>{document.getElementById('eyeInfo').innerHTML='<div class="synapse-info-title">'+el.dataset.name+'</div><div class="synapse-info-desc">'+el.dataset.desc+'</div>'});
  });
  document.querySelectorAll('#eyeScenarios .scen-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const key=b.dataset.scen;
      document.querySelectorAll('#eyeScenarios .scen-btn').forEach(x=>x.classList.toggle('active',x===b));
      svg.setAttribute('data-scenario',key);
      let shift='0px';
      if(key==='m-agonist')shift='28px';
      else if(key==='m-blocker')shift='-28px';
      else if(key==='acute-glaucoma')shift='-38px';
      svg.style.setProperty('--iris-shift',shift);
      document.getElementById('eyeChainText').innerHTML=EYE_SCENARIOS[key].chain;
    });
  });
}

  return `<div class="classify-tabs">
    <button class="ctab ${active==='input'?'active':''}" onclick="switchClassifyTab('input')">✍️ Ввод ответа</button>
    <button class="ctab ${active==='distribute'?'active':''}" onclick="switchClassifyTab('distribute')">🎯 Распределение</button>
    <button class="ctab ${active==='conspect'?'active':''}" onclick="switchClassifyTab('conspect')">📖 Конспекты</button>
  </div>`;
}
function switchClassifyTab(t){
  state.classifyMode=t;
  if(t==='input')renderClassifySetup();
  else if(t==='distribute')renderDistributeSetup();
  else if(t==='conspect')renderClassifyConspects();
}

function renderDistributeSetup(){
  const sections=[...new Set(GROUPS.map(g=>g.section))];
  const colors=['var(--mint)','var(--accent)','var(--lavender-deco)','var(--warm)','var(--success)'];
  if(state.selectedClassifySections._init!==true){sections.forEach(s=>state.selectedClassifySections[s]=true);state.selectedClassifySections._init=true;}
  const selectedCount=sections.filter(s=>state.selectedClassifySections[s]).length;
  const totalDrugs=sections.filter(s=>state.selectedClassifySections[s]).reduce((sum,s)=>sum+GROUPS.filter(g=>g.section===s).reduce((a,g)=>a+g.drugs.length,0),0);
  screenEl.innerHTML=`
    <div class="case-picker">
      ${renderClassifyTabs('distribute')}
      <div style="font-size:20px;font-weight:700;margin-bottom:6px">Распределение по группам</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px">Даны препараты. Нужно разложить их по группам. Перетаскивай карточки мышкой или тапни препарат → группу.</div>
      <div class="topic-actions"><button onclick="selectAllClassify(true)">✓ Выбрать все</button><button onclick="selectAllClassify(false)">✗ Снять все</button></div>
      <div style="margin-bottom:24px">
        ${sections.map((sec,i)=>`<div class="topic-pick ${state.selectedClassifySections[sec]?'selected':''}" onclick="toggleClassifySection('${sec}')"><div class="topic-check" style="background:${state.selectedClassifySections[sec]?colors[i%colors.length]:'var(--card)'};color:${state.selectedClassifySections[sec]?'#fff':'var(--text-muted)'}">${state.selectedClassifySections[sec]?'✓':''}</div><div class="topic-pick-info"><div class="topic-pick-title">${sec}</div><div class="topic-pick-sub">${GROUPS.filter(g=>g.section===sec).reduce((a,g)=>a+g.drugs.length,0)} препаратов</div></div></div>`).join('')}
      </div>
      <div class="summary-box"><div class="lbl">Доступно</div><div class="val">${totalDrugs} препаратов</div><div class="sub">${selectedCount} разделов</div></div>
      <button class="next-btn" ${totalDrugs===0?'disabled style="opacity:0.4;cursor:not-allowed;box-shadow:none"':''} onclick="startDistribute()">Начать</button>
      <button class="next-btn" style="background:transparent;color:var(--text-muted);box-shadow:none;margin-top:8px" onclick="setScreen('dashboard')">На главную</button>
    </div>`;
}

function startDistribute(){
  const sections=[...new Set(GROUPS.map(g=>g.section))];
  const selected=sections.filter(s=>state.selectedClassifySections[s]);
  let pool=GROUPS.filter(g=>selected.includes(g.section));
  if(pool.length===0){alert('Выбери хотя бы один раздел');return;}
  const allDrugs=[];
  pool.forEach(g=>{g.drugs.forEach(d=>allDrugs.push({drug:d,group:g.group,section:g.section}));});
  const shuffled=shuffle(allDrugs);
  const count=Math.min(8,shuffled.length);
  const round=shuffled.slice(0,count);
  const groups=shuffle([...new Set(round.map(r=>r.group))]);
  state.distribute={round,groups,placement:{},selected:null,checked:false};
  titleEl.textContent='Распределение';
  renderDistributeRound();
}

function renderDistributeRound(){
  const d=state.distribute;
  const placedCount=Object.keys(d.placement).length;
  const allPlaced=placedCount===d.round.length;
  const correctCount=d.round.filter((r,i)=>d.placement[i]===r.group).length;
  screenEl.innerHTML=`
    <div class="dist-wrap">
      <div class="dist-header">
        <div class="dist-title">Распредели препараты по группам</div>
        <div class="dist-sub">${d.checked?`Результат: ${correctCount} из ${d.round.length} правильно`:'Перетащи карточку в группу или тапни препарат, потом группу'}</div>
      </div>
      <div class="dist-zones">
        ${d.groups.map((g,gi)=>`
          <div class="dist-zone ${d.checked?'checked':''}" data-gi="${gi}" onclick="dropDrug(${gi})" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');dropDrug(${gi})">
            <div class="dist-zone-title">${g}</div>
            <div class="dist-zone-items">
              ${d.round.map((r,i)=>{
                if(d.placement[i]!==g)return '';
                let cls='';
                if(d.checked)cls=r.group===g?'correct':'wrong';
                return `<div class="dist-drug-chip ${cls}">${r.drug}</div>`;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      ${!allPlaced?`
        <div class="dist-pool-wrap">
          <div class="dist-pool-title">Осталось распределить: <strong>${d.round.length-placedCount}</strong></div>
          <div class="dist-pool">
            ${d.round.map((r,i)=>{
              if(d.placement[i]!==undefined)return '';
              const sel=d.selected===i?'selected':'';
              return `<div class="dist-drug-pool ${sel}" draggable="true" ondragstart="startDrag(${i},event)" onclick="selectDrug(${i})">${r.drug}</div>`;
            }).join('')}
          </div>
        </div>
      `:''}
      ${d.checked?`
        <div class="dist-result">
          <div class="dist-result-score">${correctCount} / ${d.round.length}</div>
          <div class="dist-result-label">правильно</div>
        </div>
        <button class="next-btn" onclick="startDistribute()">Новый раунд</button>
        <button class="next-btn" style="background:transparent;color:var(--text-muted);box-shadow:none;margin-top:8px" onclick="renderDistributeSetup()">← Назад</button>
      `:`
        <button class="next-btn" ${!allPlaced?'disabled style="opacity:0.4;cursor:not-allowed;box-shadow:none"':''} onclick="checkDistribute()">Проверить</button>
        <button class="next-btn" style="background:transparent;color:var(--text-muted);box-shadow:none;margin-top:8px" onclick="renderDistributeSetup()">← Назад</button>
      `}
    </div>`;
}
function selectDrug(i){const d=state.distribute;if(d.checked)return;d.selected=(d.selected===i)?null:i;renderDistributeRound();}
function startDrag(i,e){state.distribute.selected=i;e.dataTransfer.setData('text/plain',String(i));}
function dropDrug(gi){const d=state.distribute;if(d.checked)return;if(d.selected===null)return;d.placement[d.selected]=d.groups[gi];d.selected=null;renderDistributeRound();}
function checkDistribute(){state.distribute.checked=true;renderDistributeRound();}
function renderCasePicker(){
  const cases=Object.values(CASES);
  screenEl.innerHTML=`
    <div class="case-picker">
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">Выбери кейс</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px">Интерактивные истории с ветвлением. Каждый выбор ведёт к последствиям.</div>
      ${cases.map(c=>`<div class="case-pick-item" onclick="startCase('${c.id}')"><div class="case-pick-icon">▶</div><div class="case-pick-info"><div class="case-pick-title">${c.title}</div><div class="case-pick-sub">${c.section}</div></div></div>`).join('')}
    </div>`;
}
function startCase(id){state.caseState={caseId:id,nodeId:CASES[id].start};renderCaseNode()}
function renderCaseNode(){
  const cs=state.caseState;
  const C=CASES[cs.caseId];
  const node=C.nodes[cs.nodeId];
  if(node.isEnd){
    screenEl.innerHTML=`
      <div class="case-card">
        <div class="case-header"><span class="case-badge">КЕЙС ЗАВЕРШЁН</span><span class="case-title">${C.title}</span></div>
        <div class="case-intro">${C.intro}</div>
        <div style="padding:20px;background:var(--success-soft);border-radius:16px;margin-bottom:16px">
          <div style="font-size:13px;font-weight:700;color:#2f8b5c;margin-bottom:8px">Итог кейса</div>
          <div style="font-size:13px;line-height:1.6">${node.summary}</div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${node.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div style="font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:20px">Источник: ${node.source}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="next-btn" style="flex:1;min-width:180px" onclick="startCase('${C.id}')">Пройти заново</button>
          <button class="next-btn" style="flex:1;min-width:180px;background:var(--lavender-deco)" onclick="setScreen('case')">К списку кейсов</button>
        </div>
        <button class="next-btn" style="background:transparent;color:var(--text-muted);margin-top:8px;box-shadow:none" onclick="setScreen('dashboard')">На главную</button>
      </div>`;
    return;
  }
  screenEl.innerHTML=`
    <div class="case-card">
      <div class="case-header"><span class="case-badge">КЛИНИЧЕСКИЙ КЕЙС</span><span class="case-title">${C.title}</span></div>
      <div class="case-intro">${C.intro}</div>
      <div class="case-question">${node.question}</div>
      <div class="q-options" id="caseOptions">${node.options.map((opt,i)=>`<button class="q-option" onclick="answerCase(${i})"><span class="q-option-letter">${i+1}</span><span>${opt.text}</span></button>`).join('')}</div>
      <div id="caseFeedback"></div>
    </div>`;
}
function answerCase(i){
  const cs=state.caseState;
  const node=CASES[cs.caseId].nodes[cs.nodeId];
  const opt=node.options[i];
  document.querySelectorAll('#caseOptions .q-option').forEach(b=>b.disabled=true);
  const fbClass=opt.type==='good'?'good':opt.type==='bad'?'bad':'neutral';
  document.getElementById('caseFeedback').innerHTML=`<div class="case-feedback ${fbClass}">${opt.feedback}</div><button class="next-btn" onclick="advanceCase('${opt.next}')">Далее →</button>`;
}
function advanceCase(nextId){state.caseState.nodeId=nextId;renderCaseNode()}

function renderReference(){
  const sections=[...new Set(REFERENCE.map(r=>r.section))];
  return `
    <div class="theory-section">
      <div class="ref-section-title">📚 Основы холинергической передачи</div>
      ${THEORY.map((t,i)=>`
        <div class="theory-card" onclick="toggleTheory(${i})">
          <div class="theory-card-head">
            <div class="theory-card-icon" style="background:${t.bg};color:${t.color}">${t.icon}</div>
            <div style="flex:1">
              <div class="theory-card-title">${t.title}</div>
              <div class="theory-card-sub">${t.sub}</div>
            </div>
          </div>
          <div class="theory-card-body" id="theoryBody${i}">${t.body}</div>
        </div>`).join('')}
    </div>
    ${sections.map(sec=>`
    <div class="ref-section">
      <div class="ref-section-title">${sec}</div>
      <div class="ref-grid">
        ${REFERENCE.filter(r=>r.section===sec).map(r=>{const globalIdx=REFERENCE.indexOf(r);return `<div class="ref-card" onclick="toggleRef(${globalIdx})">
            <div class="ref-card-head"><div class="ref-icon" style="background:${r.bg};color:${r.color}">${r.icon}</div><h3>${r.title}</h3></div>
            <p>${r.desc}</p>
            <div class="ref-drugs">${r.drugs.map(d=>`<span class="ref-drug">${d}</span>`).join('')}</div>
            <div id="refDetails${globalIdx}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;line-height:1.6;color:var(--text-muted)">${r.details}</div>
          </div>`;}).join('')}
      </div>
    </div>`).join('')}`;
}
function toggleTheory(i){const el=document.getElementById('theoryBody'+i);el.classList.toggle('show');}
function toggleRef(i){const el=document.getElementById('refDetails'+i);el.style.display=el.style.display==='none'?'block':'none'}

function renderSettings(){
  const s=getStats();
  const palettes=[
    {id:'warm',name:'Тёплая',sub:'Крем и персик',grad:'linear-gradient(135deg,#ffb8a0,#c5b5e8)'},
    {id:'mint',name:'Мятная',sub:'Свежая и чистая',grad:'linear-gradient(135deg,#8dd4c4,#a8c8e0)'},
    {id:'lavender',name:'Лавандовая',sub:'Мягкая и нежная',grad:'linear-gradient(135deg,#c8aae0,#f0b5d0)'}
  ];
  return `
    <div style="max-width:700px">
      <div class="panel" style="margin-bottom:16px">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Палитра</h3>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
          ${palettes.map(p=>`<div class="palette-card ${getPalette()===p.id?'active':''}" onclick="setPalette('${p.id}')"><div class="palette-swatch" style="background:${p.grad}"></div><div class="palette-name">${p.name}</div><div class="palette-sub">${p.sub}</div></div>`).join('')}
        </div>
      </div>
      <div class="panel" style="margin-bottom:16px">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Режим</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${[{v:'light',l:'Светлая'},{v:'dark',l:'Тёмная'},{v:'system',l:'Как в системе'}].map(o=>`<button class="theme-toggle" onclick="setMode('${o.v}')" style="${getMode()===o.v?'border-color:var(--accent);color:var(--accent-deep)':''}">${o.l}</button>`).join('')}
        </div>
      </div>
      <div class="panel" style="margin-bottom:16px">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Прогресс</h3>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">
          Пройдено вопросов: <strong style="color:var(--text)">${s.answered}</strong><br>
          Пройдено тестов: <strong style="color:var(--text)">${s.tests}</strong><br>
          Точность: <strong style="color:var(--text)">${s.accuracy}%</strong>
        </div>
        <button class="next-btn" style="background:var(--error);max-width:240px" onclick="resetProgress()">Сбросить прогресс</button>
      </div>
      <div class="panel">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">О приложении</h3>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.7">
          <strong style="color:var(--text)">PharmStudy</strong> — бета-версия.<br>
          Разделы: Холиномиметики, Холиноблокаторы, Миорелаксанты, Адреномиметики, Адреноблокаторы.<br>
          Источник: Харкевич Д.А., «Фармакология».<br>
          Работает офлайн. Данные хранятся на устройстве.
        </div>
      </div>
    </div>`;
}
function resetProgress(){if(confirm('Сбросить весь прогресс?')){state.progress={};saveProgress();setScreen('dashboard')}}

function getPalette(){return localStorage.getItem('pharm_palette')||'warm'}
function getMode(){return localStorage.getItem('pharm_mode')||'light'}
function applyTheme(){
  const palette=getPalette();
  let mode=getMode();
  if(mode==='system')mode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',palette+'-'+mode);
  let meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);}
  const colors={warm:{light:'#faf4ec',dark:'#2a2520'},mint:{light:'#f2f8f6',dark:'#1a2422'},lavender:{light:'#f7f2fa',dark:'#1f1a2a'}};
  meta.content=colors[palette][mode];
  const icon=document.getElementById('themeIcon');
  const label=document.getElementById('themeLabel');
  if(mode==='dark'){icon.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';label.textContent='Тёмная'}
  else{icon.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';label.textContent='Светлая'}
}
function setMode(v){localStorage.setItem('pharm_mode',v);applyTheme();if(state.screen==='settings')setScreen('settings')}
function setPalette(v){localStorage.setItem('pharm_palette',v);applyTheme();if(state.screen==='settings')setScreen('settings')}
document.getElementById('themeToggle').addEventListener('click',()=>{setMode(getMode()==='dark'?'light':'dark')});
document.getElementById('nav').addEventListener('click',e=>{const btn=e.target.closest('.nav-btn');if(btn)setScreen(btn.dataset.screen)});
applyTheme();setScreen('dashboard');
</script>
</body>
</html>
