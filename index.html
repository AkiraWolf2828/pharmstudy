{section:'Холиноблокаторы',icon:'У',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Урологические М-холиноблокаторы',desc:'Уменьшают непроизвольные сокращения детрузора.',drugs:['Солифенацин','Оксибутинин','Троспия хлорид'],details:'Применяются при гиперактивности детрузора с ургентными позывами, учащённым мочеиспусканием и ургентным недержанием. Возможны сухость во рту, запор, нарушение зрения и задержка мочи.'},
{section:'Холиноблокаторы',icon:'И',color:'var(--accent)',bg:'var(--accent-soft)',title:'Ингаляционные М-холиноблокаторы',desc:'Блокируют М-рецепторы дыхательных путей.',drugs:['Ипратропия бромид','Тиотропия бромид','Гликопиррония бромид'],details:'Ипратропий — короткого действия; тиотропий и гликопирроний — длительного действия. Возможны сухость во рту и кашель; редко — парадоксальный бронхоспазм. Осторожность при закрытоугольной глаукоме и нарушении оттока мочи.'},
{section:'Холиноблокаторы',icon:'О',color:'var(--warm)',bg:'var(--warm-soft)',title:'Офтальмологические М-холиноблокаторы',desc:'Вызывают мидриаз и циклоплегию.',drugs:['Тропикамид','Циклопентолат'],details:'Применяются для офтальмологического осмотра и диагностических процедур. Возможны светобоязнь и нарушение аккомодации; важный риск — повышение внутриглазного давления у предрасположенных пациентов.'},
{section:'Холиноблокаторы',icon:'С',color:'var(--success)',bg:'var(--success-soft)',title:'Периферические М-холиноблокаторы со спазмолитическим действием',desc:'Ослабляют холинергическое сокращение гладкой мускулатуры.',drugs:['Гиосцина бутилбромид','Метоциния йодид'],details:'Отнесены методичкой к периферическим спазмолитическим М-холиноблокаторам. Возможны сухость во рту, тахикардия, запор и задержка мочи.'},
{section:'Холиноблокаторы',icon:'Ц',color:'var(--error)',bg:'var(--error-soft)',title:'Центральные М-холиноблокаторы',desc:'Антипаркинсонические средства.',drugs:['Тригексифенидил','Бипериден'],details:'Классификация относит их к центральным М-холиноблокаторам. Возможны сухость во рту, запор, задержка мочи, спутанность сознания и галлюцинации.'},
{section:'Холиноблокаторы',icon:'Г',color:'var(--mint)',bg:'var(--mint-soft)',title:'Ганглиоблокаторы',desc:'Блокируют Нн-рецепторы вегетативных ганглиев.',drugs:['Азаметония бромид'],details:'Блокада нарушает симпатическую и парасимпатическую передачу. Возможны ортостатическая гипотензия, тахикардия, сухость во рту, запор и задержка мочи.'},
  {section:'Миорелаксанты',icon:'Д',color:'var(--warm)',bg:'var(--warm-soft)',title:'Деполяризующие миорелаксанты',desc:'Стойкая деполяризация → блокада нервно-мышечной передачи.',drugs:['Суксаметония йодид','Суксаметония хлорид'],details:'Риски по методичке: апноэ, гиперкалиемия/аритмии, брадикардия, послеоперационная мышечная боль, аллергия, злокачественная гипертермия. При сниженной активности плазменной холинэстеразы блок может удлиняться.'},
  {section:'Миорелаксанты',icon:'Н',color:'var(--accent)',bg:'var(--accent-soft)',title:'Недеполяризующие миорелаксанты',desc:'Блокируют Нм-рецепторы и прекращают нервно-мышечную передачу.',drugs:['Пипекурония бромид','Рокурония бромид','Атракурия безилат','Цисатракурия безилат'],details:'Применяются для облегчения интубации и расслабления скелетных мышц при операции или по отдельным показаниям интенсивной терапии. Неостигмин может применяться для устранения блока; в методичке также рассматривается сочетание с атропином.'},
  {section:'Миорелаксанты',icon:'Б',color:'var(--error)',bg:'var(--error-soft)',title:'Средства, нарушающие высвобождение АХ',desc:'Нарушают высвобождение ацетилхолина.',drugs:['Ботулинический токсин типа А'],details:'Препарат нарушает высвобождение ацетилхолина из нервного окончания.'},

  {section:'Миорелаксанты',icon:'П',color:'var(--success)',bg:'var(--success-soft)',title:'Миорелаксанты прямого действия',desc:'Уменьшает выход Ca²⁺ через RyR1 из саркоплазматического ретикулума скелетной мышцы.',drugs:['Дантролен'],details:'Внутривенная форма применяется для экстренного специфического лечения злокачественной гипертермии. Возможны мышечная, в том числе дыхательная, слабость и реакции со стороны ЖКТ; при внутривенном введении — флебит и повреждение тканей при выходе раствора за пределы сосуда.'},

{section:'Холиномиметики',group:'М,Н-холиномиметики',drugs:['Карбахол'],mechanism:'Стимуляция М- и Н-холинорецепторов. Устойчив к действию холинэстеразы.',sideEffects:['Воспалительные реакции глаза, отёк роговицы, ухудшение зрения','Редко — тяжёлые офтальмологические осложнения','При системном действии — тошнота, слюнотечение, потливость, брадикардия']},
{section:'Холиномиметики',group:'оиХЭ центрального действия',drugs:['Донепезил','Ривастигмин','Галантамин'],mechanism:'Проникают через ГЭБ и усиливают действие ацетилхолина в ЦНС. При болезни Альцгеймера могут уменьшать выраженность симптомов и поддерживать повседневную активность, но не восстанавливают погибшие нейроны.',sideEffects:['Тошнота, рвота, диарея, снижение аппетита','Брадикардия, нарушения сердечной проводимости, головокружение или обмороки','Бессонница и болезненные мышечные спазмы (донепезил)','Снижение массы тела и возможное усиление тремора (ривастигмин); при пластыре — покраснение, зуд или контактный дерматит']},
{section:'Холиномиметики',group:'оиХЭ центрально-периферического действия',drugs:['Ипидакрин'],mechanism:'Сочетает подавление холинэстеразы и блокаду калиевых каналов, за счёт чего электрическое возбуждение нервного окончания длится дольше и улучшается передача сигнала.',sideEffects:['Слюнотечение, потливость','Тошнота, диарея, брадикардия','Усиление бронхиальной секреции','Возможны головокружение и сонливость']},
{section:'Холиномиметики',group:'оиХЭ периферического действия',drugs:['Пиридостигмин','Неостигмин'],mechanism:'Обратимое ингибирование холинэстеразы на периферии → накопление АХ → усиление холинергической передачи.',sideEffects:['Тошнота, спазмы в животе, диарея','Слюнотечение, потливость, усиление бронхиальной секреции','Брадикардия, бронхоспазм','Мышечные подёргивания и слабость при передозировке']},
{section:'Средства при отравлении ФОС',group:'Реактиваторы холинэстеразы',drugs:['Карбоксим'],mechanism:'Оксимный реактиватор, который помогает восстановить активность холинэстеразы, ингибированной ФОС. Возможность реактивации уменьшается после старения комплекса; скорость старения зависит от конкретного соединения.',sideEffects:['При больших дозах — мышечная слабость, головокружение, головная боль, тошнота и тахикардия','Возможны преходящие парестезии и изменения внутрисердечной проводимости']},
{section:'Холиноблокаторы',group:'М-холиноблокатор, рассматриваемый в методичке',drugs:['Атропин'],mechanism:'Неселективно блокирует М-рецепторы; ослабляет вагусное влияние на сердце, секрецию желёз и тонус ряда гладких мышц. Проникает в ЦНС. В глазу вызывает мидриаз и длительную циклоплегию. При симптомной брадикардии увеличивает ЧСС; при холинергическом отравлении уменьшает бронхорею, бронхоспазм и брадикардию. Не восстанавливает холинэстеразу и не устраняет непосредственно Нм-блокаду.',sideEffects:['Сухость во рту, тахикардия, запор, задержка мочи','Нечёткость зрения вблизи и светобоязнь','Снижение потоотделения с риском гипертермии','При высоком воздействии — возбуждение, делирий, галлюцинации','Особая осторожность/ограничения: закрытоугольная глаукома, тахиаритмии, ИБС/тяжёлая сердечная недостаточность, миастения, обструктивные заболевания ЖКТ; перечень зависит от инструкции']},
{section:'Миорелаксанты',group:'Деполяризующие миорелаксанты',drugs:['Суксаметония йодид','Суксаметония хлорид'],mechanism:'Агонист Нм-рецепторов: сначала вызывает деполяризацию и фасцикуляции, затем сохраняющаяся деполяризация и инактивация натриевых каналов не позволяют возникать новым мышечным импульсам — развивается вялый паралич (типичный блок I фазы). Используется для быстрого кратковременного расслабления при интубации и коротких процедурах под анестезией. Не обеспечивает сон, амнезию или обезболивание: необходимы анестезия/седация, поддержка дыхания и мониторинг.',sideEffects:['Апноэ; при длительном блоке может отсутствовать самостоятельное дыхание','Гиперкалиемия и аритмии','Брадикардия','Послеоперационная мышечная боль','Аллергия','Злокачественная гипертермия','Сниженная активность плазменной холинэстеразы замедляет разрушение препарата и удлиняет блок']},
{section:'Миорелаксанты',group:'Недеполяризующие миорелаксанты',drugs:['Пипекурония бромид','Рокурония бромид','Атракурия безилат','Цисатракурия безилат'],mechanism:'Конкурентно блокируют Нм-рецепторы: ацетилхолин не вызывает достаточной деполяризации концевой пластинки, поэтому сокращение не запускается; начальные фасцикуляции обычно отсутствуют. Применяются для интубации и расслабления мышц при общей анестезии; в интенсивной терапии — для отдельных препаратов. Не обеспечивают сон, амнезию или обезболивание. После блока необходимы поддержка дыхания и мониторинг нервно-мышечного восстановления.',sideEffects:['Паралич дыхательных мышц при действии препарата','Остаточная слабость/остаточный блок после операции','Возможна анафилаксия','Осторожность при миастении и других нарушениях нервно-мышечной передачи, электролитных сдвигах, гипотермии и сочетании с лекарствами, усиливающими блок, например аминогликозидами','Неостигмин применим только при достаточном спонтанном восстановлении; не устраняет надёжно любой глубокий блок']},
{section:'Миорелаксанты',group:'Средства, нарушающие высвобождение ацетилхолина',drugs:['Ботулинический токсин типа А'],mechanism:'Действует в пресинаптическом нервном окончании: расщепляет SNAP-25 — белок, необходимый для слияния пузырьков с мембраной. Высвобождение ацетилхолина уменьшается, поэтому локально снижается мышечная активность; в железах уменьшается секреция. Эффект нарастает постепенно и сохраняется недели–месяцы. Показания зависят от конкретного препарата и места инъекции.',sideEffects:['Боль и избыточная местная слабость','Птоз (опущение века), дисфагия (нарушение глотания)','При распространении действия — общая слабость и дыхательные нарушения','После инъекций в детрузор возможны задержка мочи и инфекции','Общие ограничения: гиперчувствительность и воспаление/инфекция в месте введения; остальные определяет инструкция конкретного препарата']},
{section:'Миорелаксанты',group:'Миорелаксанты центрального действия',drugs:['Толперизон','Тизанидин','Баклофен','Циклобензаприн'],mechanism:'Используются для уменьшения патологической мышечной активности, чтобы облегчить движения, уход и реабилитацию. Спастичность при поражении центрального двигательного пути отличается от болезненного защитного спазма при заболеваниях опорно-двигательного аппарата; препараты действуют на разные мишени и не взаимозаменяемы. Толперизон: механизм изучен не полностью, описано мембраностабилизирующее действие и влияние на Na⁺/Ca²⁺-каналы в двигательных рефлекторных путях. Тизанидин: центральный агонист α2-рецепторов, уменьшает выделение возбуждающих медиаторов в спинальных цепях. Баклофен: агонист ГАМК-B-рецепторов, усиливает тормозные влияния в спинном мозге. Циклобензаприн действует преимущественно на уровне ствола мозга, механизм полностью не выяснен; курс кратковременный при остром болезненном спазме.',sideEffects:['Возможны слабость и головокружение; чрезмерное снижение тонуса может ухудшать опору и ходьбу','Для тизанидина, баклофена и циклобензаприна особенно характерна сонливость; толперизон обычно менее седативен','Тизанидин: гипотензия/брадикардия, сухость во рту, повреждение печени; резкая отмена после длительного лечения может вызвать тахикардию и повышение АД','Баклофен: тошнота, гипотензия, спутанность, угнетение дыхания; при почечной недостаточности возможны накопление и токсические нарушения функций мозга','Циклобензаприн: сухость во рту, запор, аритмии; риск серотонинового синдрома с серотонинергическими средствами','Толперизон: возможны ЖКТ-дискомфорт, снижение давления и аллергические реакции вплоть до анафилаксии; противопоказания зависят от формы']},
{section:'Миорелаксанты',group:'Миорелаксанты прямого миотропного действия',drugs:['Дантролен'],mechanism:'Уменьшает выход Ca²⁺ через RyR1 (рианодиновые рецепторы) из саркоплазматического ретикулума — внутриклеточного хранилища кальция скелетной мышцы. Сократительные белки получают меньше кальциевого сигнала, поэтому уменьшается сокращение и патологический мышечный обмен. М- и Н-рецепторы не являются мишенью. Внутривенная форма — экстренное специфическое лечение злокачественной гипертермии, связанной с неконтролируемым выходом кальция после некоторых анестетиков и суксаметония; одновременно прекращают действие триггеров и проводят поддерживающие мероприятия.',sideEffects:['Мышечная, в том числе дыхательная, слабость','Возможны реакции со стороны ЖКТ','При внутривенном введении — флебит и повреждение тканей при попадании раствора за пределы сосуда','Гепатотоксичность особенно важна при длительном пероральном лечении; не следует автоматически переносить её в противопоказания экстренной внутривенной формы']},

const state={screen:'dashboard',progress:loadProgress(),session:null,caseState:null,selectedTopics:{},classifySession:null,selectedClassifySections:{},classifyMode:'input',distribute:null,selectedSkills:{}};
function loadProgress(){try{return JSON.parse(localStorage.getItem('pharm_progress')||'{}')}catch{return{}}}
function saveProgress(){localStorage.setItem('pharm_progress',JSON.stringify(state.progress))}
function getStats(){let answered=0,correct=0;Object.entries(state.progress).forEach(([id,p])=>{if(id.startsWith('_'))return;answered+=p.correct+p.wrong;correct+=p.correct});const accuracy=answered?Math.round(correct/answered*100):0;return{answered,correct,accuracy,tests:state.progress._sessions||0,streak:state.progress._streak||1}}

const screenEl=document.getElementById('screen');
const titleEl=document.getElementById('screen-title');

function setScreen(name){
  state.screen=name;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));
  const titles={dashboard:'Дашборд',session:'Тестирование',classify:'Классификация',synapse:'Визуализация',case:'Кейсы',reference:'Справочник',settings:'Настройки'};
  document.title='PharmStudy — '+(titles[name]||'');
  if(name==='dashboard'){titleEl.textContent='Дашборд';screenEl.innerHTML=renderDashboard()}
  else if(name==='session'){titleEl.textContent='Тестирование';renderSessionSetup()}
  else if(name==='classify'){titleEl.textContent='Классификация';if(state.classifyMode==='distribute')renderDistributeSetup();else if(state.classifyMode==='conspect')renderClassifyConspects();else renderClassifySetup()}
  else if(name==='synapse'){titleEl.textContent='Визуализация';renderSynapse()}
  else if(name==='case'){titleEl.textContent='Кейсы';renderCasePicker()}
  else if(name==='reference'){titleEl.textContent='Справочник';screenEl.innerHTML=renderReference()}
  else if(name==='settings'){titleEl.textContent='Настройки';screenEl.innerHTML=renderSettings()}
}

function openTopicMenu(topic){
  const old=document.getElementById('topicMenuOverlay');

  const overlay=document.createElement('div');
  overlay.id='topicMenuOverlay';
  overlay.className='topic-menu-overlay';
  overlay.setAttribute('role','presentation');
  const hasCholinergicVisualization=/холиномиметик|холиноблокатор/i.test(topic);
  const options=[
    '<button class="topic-menu-option" type="button" onclick="setScreen(\'reference\')"><span class="topic-menu-option-icon">📚</span><span><span class="topic-menu-option-title">Справочник</span><span class="topic-menu-option-desc">Материалы и препараты</span></span></button>',
    '<button class="topic-menu-option" type="button" onclick="setScreen(\'session\')"><span class="topic-menu-option-icon">✍️</span><span><span class="topic-menu-option-title">Тесты</span><span class="topic-menu-option-desc">Проверить знания</span></span></button>',
    '<button class="topic-menu-option" type="button" onclick="setScreen(\'classify\')"><span class="topic-menu-option-icon">🧩</span><span><span class="topic-menu-option-title">Классификация</span><span class="topic-menu-option-desc">Повторить группы препаратов</span></span></button>',
    '<button class="topic-menu-option" type="button" onclick="setScreen(\'case\')"><span class="topic-menu-option-icon">🩺</span><span><span class="topic-menu-option-title">Клинические кейсы</span><span class="topic-menu-option-desc">Применить знания на практике</span></span></button>'
  ];
  if(hasCholinergicVisualization){
    options.push('<button class="topic-menu-option" type="button" onclick="setScreen(\'synapse\')"><span class="topic-menu-option-icon">⚛️</span><span><span class="topic-menu-option-title">Визуализация</span><span class="topic-menu-option-desc">Холинергический синапс</span></span></button>');
  }
  overlay.innerHTML=`
    <section class="topic-menu-dialog" role="dialog" aria-modal="true" aria-labelledby="topicMenuHeading">
      <div class="topic-menu-head"><h2 class="topic-menu-heading" id="topicMenuHeading">${topic}</h2><button type="button" class="topic-menu-close" aria-label="Закрыть" onclick="document.getElementById('topicMenuOverlay')?.remove()">×</button></div>
      <p class="topic-menu-subtitle">Выбери, в каком разделе продолжить изучение этой темы.</p>
      <div class="topic-menu-options">${options.join('')}</div>
    </section>`;

  const closeOnEscape=e=>{if(e.key==='Escape'){overlay.remove();document.removeEventListener('keydown',closeOnEscape);}};
  document.addEventListener('keydown',closeOnEscape);
  screenEl.appendChild(overlay);
  overlay.querySelector('.topic-menu-close').focus();
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function editDist(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);}return dp[m][n];}
function normalize(s){return s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,'').replace(/[^а-яa-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim();}
function isDrugMatch(input,drug){const a=normalize(input),b=normalize(drug);if(!a||a.length<4)return false;if(a===b)return true;if(b.startsWith(a)||a.startsWith(b))return true;const threshold=Math.max(1,Math.floor(Math.max(a.length,b.length)/6));return editDist(a,b)<=threshold;}
function classifyCheck(input,drugs){
  const parts=input.split(/[,;]+/).map(s=>s.trim()).filter(s=>s);
  const usedDrugs=new Set();const usedInputs=new Set();const matched=[];
  parts.forEach((p,pi)=>{drugs.forEach((d,di)=>{if(usedDrugs.has(di))return;if(isDrugMatch(p,d)){usedDrugs.add(di);usedInputs.add(pi);matched.push(d);}});});
  const missed=drugs.filter((d,i)=>!usedDrugs.has(i));
  const extra=parts.filter((p,i)=>!usedInputs.has(i));
  return {matched,missed,extra,correct:matched.length,total:drugs.length};
}

}function toggleSkill(s){
  state.selectedSkills[s]=!state.selectedSkills[s];
  renderSessionSetup();
}
function toggleTopic(sec){state.selectedTopics[sec]=!state.selectedTopics[sec];renderSessionSetup();}
function selectAllTopics(v){const sections=[...new Set(QUESTIONS.map(q=>q.section))];sections.forEach(s=>state.selectedTopics[s]=v);state.selectedTopics._init=true;renderSessionSetup();}
function startSession(){
  const sections=[...new Set(QUESTIONS.map(q=>q.section))];
  const selected=sections.filter(s=>state.selectedTopics[s]);
  const activeSkills=SKILL_LIST.filter(s=>state.selectedSkills[s]);
  let pool=QUESTIONS.filter(q=>selected.includes(q.section) && activeSkills.includes(SKILLS[q.id]));
  if(pool.length===0){alert('Нет вопросов под выбранные фильтры');return;}
  pool=shuffle(pool);
  state.session={questions:pool,index:0,answers:[]};
  titleEl.textContent='Тестирование';
  renderQuestion();
}
function renderQuestion(){
  const s=state.session;
  if(s.index>=s.questions.length){renderReport();return}
  const q=s.questions[s.index];
  const progress=(s.index/s.questions.length)*100;
  screenEl.innerHTML=`
    <div class="question-card">
      <div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${progress}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.questions.length}</span></div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px">${q.section}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options" id="qOptions">${q.options.map((opt,i)=>`<button class="q-option" onclick="answerQuestion(${i})"><span class="q-option-letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></button>`).join('')}</div>
      <div id="feedbackArea"></div>
    </div>`;
}
function answerQuestion(i){
  const s=state.session;const q=s.questions[s.index];
  const buttons=document.querySelectorAll('#qOptions .q-option');
  buttons.forEach(b=>b.disabled=true);
  const isCorrect=i===q.correct;
  buttons[i].classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect)buttons[q.correct].classList.add('correct');
  s.answers.push({id:q.id,correct:isCorrect,section:q.section});
  if(!state.progress[q.id])state.progress[q.id]={correct:0,wrong:0};
  if(isCorrect)state.progress[q.id].correct++;else state.progress[q.id].wrong++;
  saveProgress();
  document.getElementById('feedbackArea').innerHTML=`
    <div class="explanation">
      <h4>${isCorrect?'✓ Верно':'✗ Правильный ответ: '+String.fromCharCode(65+q.correct)}</h4>

function startClassify(){
  const sections=[...new Set(GROUPS.map(g=>g.section))];
  const selected=sections.filter(s=>state.selectedClassifySections[s]);
  let pool=GROUPS.filter(g=>selected.includes(g.section));
  if(pool.length===0){alert('Выбери хотя бы один раздел');return;}
  pool=shuffle(pool);
  state.classifySession={groups:pool,index:0,results:[]};

  const s=state.classifySession;

function checkClassifyAnswer(){
  const s=state.classifySession;
  const g=s.groups[s.index];
  const input=document.getElementById('classifyInput').value;
  const res=classifyCheck(input,g.drugs);
  s.results.push({group:g.group,section:g.section,...res});
  if(!state.progress._topicClassify)state.progress._topicClassify={};
  if(!state.progress._topicClassify[g.section])state.progress._topicClassify[g.section]={correct:0,total:0};
  state.progress._topicClassify[g.section].correct+=res.correct;
  state.progress._topicClassify[g.section].total+=res.total;
  saveProgress();
  const status=res.correct===res.total?'good':res.correct===0?'bad':'partial';
  const headerText=status==='good'?'✓ Всё верно':status==='partial'?`~ Частично: ${res.correct} из ${res.total}`:'✗ Ничего не угадано';
  const headerClass=status==='good'?'good':status==='bad'?'bad':'neutral';
  screenEl.innerHTML=`

      <div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${((s.index+1)/s.groups.length)*100}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.groups.length}</span></div>

  const svg=document.getElementById('synapseSvg');

  const stage=svg.parentElement;
  svg.querySelectorAll('.synapse-el').forEach(el=>{

      const r=stage.getBoundingClientRect();
      tooltip.innerHTML='<strong style="display:block;font-size:13px;margin-bottom:4px;color:#bfe9ff">'+el.dataset.name+'</strong><span>'+el.dataset.desc+'</span>';
      tooltip.style.left=(e.clientX-r.left+14)+'px';
      tooltip.style.top=(e.clientY-r.top+14)+'px';
      tooltip.classList.add('show');
    });
    el.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));;
    el.setAttribute('tabindex','0');;
    el.setAttribute('role','button');;
    el.setAttribute('aria-label',el.dataset.name||'Элемент синапса');;
    el.addEventListener('focus',()=>{tooltip.innerHTML='<strong style="display:block;font-size:13px;margin-bottom:4px;color:#bfe9ff">'+el.dataset.name+'</strong><span>'+el.dataset.desc+'</span>';tooltip.style.left='12px';tooltip.style.top='12px';tooltip.classList.add('show');});;
    el.addEventListener('blur',()=>tooltip.classList.remove('show'));
    el.addEventListener('click',()=>{
      document.getElementById('synapseInfo').innerHTML='<div class="synapse-info-title">'+el.dataset.name+'</div><div class="synapse-info-desc">'+el.dataset.desc+'</div>';
    });
  });
  const stepButtons=[...document.querySelectorAll('.synapse-step')];
  function activateSynapseStep(button){
    document.querySelectorAll('.scen-btn').forEach(x=>x.classList.toggle('active',x.dataset.scen==='normal'));
    svg.setAttribute('data-scenario','normal');
    stepButtons.forEach(x=>x.classList.toggle('active',x===button));
    const targets=(button.dataset.target||'').split(',');
    svg.querySelectorAll('.synapse-el').forEach(el=>{
      const match=targets.includes(el.dataset.el);
      el.classList.toggle('step-focus',match);
      el.classList.toggle('step-dim',!match);
    });
    const phaseOrder=['synthesis','impulse','fusion','release','receptors','breakdown','recycle'];
    const nextPhase=button.dataset.phase||'impulse';
    const nextStep=Math.max(0,phaseOrder.indexOf(nextPhase));
    /* Переключаем фазу сразу по нажатию: CSS-переходы смягчают смену, без ожидания следующего цикла. */
    phaseOrder.forEach(phase=>svg.classList.remove('phase-'+phase));
    svg.classList.add('phase-'+nextPhase);
    svg.setAttribute('data-active-step',String(nextStep));
    document.getElementById('synapseInfo').innerHTML='<div class="synapse-info-title">'+button.dataset.title+'</div><div class="synapse-info-desc">'+button.dataset.desc+'</div>';
    document.getElementById('synapseChainText').innerHTML='<strong>Этап передачи.</strong> '+button.dataset.desc+' <span style="opacity:.8">Режим действия препарата сброшен; выбери сценарий отдельно, чтобы рассмотреть его эффект.</span>';
  }
  stepButtons.forEach(button=>button.addEventListener('click',()=>activateSynapseStep(button)));
  if(stepButtons.length) activateSynapseStep(stepButtons[0]);
  document.querySelectorAll('.synapse-hotspot').forEach(button=>{
    button.addEventListener('click',()=>{
      document.getElementById('synapseInfo').innerHTML='<div class="synapse-info-title">'+button.dataset.title+'</div><div class="synapse-info-desc">'+button.dataset.desc+'</div>';
    });
  });
  document.querySelectorAll('.scen-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const key=b.dataset.scen;
      document.querySelectorAll('.scen-btn').forEach(x=>x.classList.toggle('active',x===b));
      stepButtons.forEach(x=>x.classList.remove('active'));
      svg.querySelectorAll('.synapse-el').forEach(el=>el.classList.remove('step-focus','step-dim'));
      ['phase-synthesis','phase-impulse','phase-fusion','phase-release','phase-receptors','phase-breakdown','phase-recycle'].forEach(c=>svg.classList.remove(c));
      svg.removeAttribute('data-active-step');
      svg.setAttribute('data-scenario',key);
      document.getElementById('synapseInfo').innerHTML='<div class="synapse-info-title">'+SCENARIOS[key].name+'</div><div class="synapse-info-desc">Режим препарата показан отдельно от пошаговой физиологической передачи. Выбери этап ниже, чтобы вернуться к обычной последовательности.</div>';
      document.getElementById('synapseChainText').innerHTML=SCENARIOS[key].chain;
    });
  });
  document.querySelectorAll('[data-scen-target]').forEach(hit=>{
    hit.addEventListener('click',()=>{
      const target=document.querySelector('.scen-btn[data-scen="'+hit.dataset.scenTarget+'"]');
      if(target) target.click();
    });
  });
  document.querySelectorAll('[data-step-target]').forEach(hit=>{
    hit.addEventListener('click',()=>{
      const target=document.querySelector('.synapse-step[data-step="'+hit.dataset.stepTarget+'"]');
      if(target) target.click();
    });
  });
}

function startDistribute(){
  const sections=[...new Set(GROUPS.map(g=>g.section))];
  const selected=sections.filter(s=>state.selectedClassifySections[s]);
  let pool=GROUPS.filter(g=>selected.includes(g.section));
  if(pool.length===0){alert('Выбери хотя бы один раздел');return;}
  const allDrugs=[];
  pool.forEach(g=>{g.drugs.forEach(d=>allDrugs.push({drug:d,group:g.group,section:g.section}));});
  const shuffled=shuffle(allDrugs);
  const count=Math.min(8,shuffled.length);
  const round=shuffled.slice(0,count);
  const groups=shuffle([...new Set(round.map(r=>r.group))]);
  state.distribute={round,groups,placement:{},selected:null,checked:false};
  titleEl.textContent='Распределение';
  renderDistributeRound();
}

function renderDistributeRound(){
  const d=state.distribute;
  const placedCount=Object.keys(d.placement).length;
  const allPlaced=placedCount===d.round.length;
  const correctCount=d.round.filter((r,i)=>d.placement[i]===r.group).length;
  screenEl.innerHTML=`
    <div class="dist-wrap">
      <div class="dist-header">
        <div class="dist-title">Распредели препараты по группам</div>
        <div class="dist-sub">${d.checked?`Результат: ${correctCount} из ${d.round.length} правильно`:'Перетащи карточку в группу или тапни препарат, потом группу'}</div>
      </div>
      <div class="dist-zones">
        ${d.groups.map((g,gi)=>`
          <div class="dist-zone ${d.checked?'checked':''}" data-gi="${gi}" onclick="dropDrug(${gi})" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');dropDrug(${gi})">
            <div class="dist-zone-title">${g}</div>
            <div class="dist-zone-items">
              ${d.round.map((r,i)=>{
                if(d.placement[i]!==g)return '';
                let cls='';
                if(d.checked)cls=r.group===g?'correct':'wrong';
                return `<div class="dist-drug-chip ${cls}">${r.drug}</div>`;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      ${!allPlaced?`
        <div class="dist-pool-wrap">
          <div class="dist-pool-title">Осталось распределить: <strong>${d.round.length-placedCount}</strong></div>
          <div class="dist-pool">
            ${d.round.map((r,i)=>{
              if(d.placement[i]!==undefined)return '';
              const sel=d.selected===i?'selected':'';
              return `<div class="dist-drug-pool ${sel}" draggable="true" ondragstart="startDrag(${i},event)" onclick="selectDrug(${i})">${r.drug}</div>`;
            }).join('')}
          </div>
        </div>
      `:''}
      ${d.checked?`
        <div class="dist-result">
          <div class="dist-result-score">${correctCount} / ${d.round.length}</div>
          <div class="dist-result-label">правильно</div>
        </div>
        <button class="next-btn" onclick="startDistribute()">Новый раунд</button>
        <button class="next-btn" style="background:transparent;color:var(--text-muted);box-shadow:none;margin-top:8px" onclick="renderDistributeSetup()">← Назад</button>
      `:`
        <button class="next-btn" ${!allPlaced?'disabled style="opacity:0.4;cursor:not-allowed;box-shadow:none"':''} onclick="checkDistribute()">Проверить</button>
        <button class="next-btn" style="background:transparent;color:var(--text-muted);box-shadow:none;margin-top:8px" onclick="renderDistributeSetup()">← Назад</button>
      `}
    </div>`;
}
function selectDrug(i){const d=state.distribute;if(d.checked)return;d.selected=(d.selected===i)?null:i;renderDistributeRound();}

function dropDrug(gi){const d=state.distribute;if(d.checked)return;if(d.selected===null)return;d.placement[d.selected]=d.groups[gi];d.selected=null;renderDistributeRound();}
function checkDistribute(){state.distribute.checked=true;renderDistributeRound();}

        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Палитра</h3>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
          ${palettes.map(p=>`<div class="palette-card ${getPalette()===p.id?'active':''}" onclick="setPalette('${p.id}')"><div class="palette-swatch" style="background:${p.grad}"></div><div class="palette-name">${p.name}</div><div class="palette-sub">${p.sub}</div></div>`).join('')}
        </div>
      </div>
      <div class="panel" style="margin-bottom:16px">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Режим</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${[{v:'light',l:'Светлая'},{v:'dark',l:'Тёмная'},{v:'system',l:'Как в системе'}].map(o=>`<button class="theme-toggle" onclick="setMode('${o.v}')" style="${getMode()===o.v?'border-color:var(--accent);color:var(--accent-deep)':''}">${o.l}</button>`).join('')}
        </div>
      </div>
      <div class="panel" style="margin-bottom:16px">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Прогресс</h3>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">
          Пройдено вопросов: <strong style="color:var(--text)">${s.answered}</strong><br>
          Пройдено тестов: <strong style="color:var(--text)">${s.tests}</strong><br>
          Точность: <strong style="color:var(--text)">${s.accuracy}%</strong>
        </div>
        <button class="next-btn" style="background:var(--error);max-width:240px" onclick="resetProgress()">Сбросить прогресс</button>
      </div>
      <div class="panel">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">О приложении</h3>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.7">
          <strong style="color:var(--text)">PharmStudy</strong> — бета-версия.<br>
          Разделы: Холиномиметики, Холиноблокаторы, Миорелаксанты, Адреномиметики, Адреноблокаторы.<br>
          Для раздела «Холиномиметики» источник — предоставленная методичка «Холиномиметики — материал для студентов». Другие разделы сайта не сверены с этой методичкой и требуют проверки по отдельным утверждённым источникам.<br>
          Работает офлайн. Данные хранятся на устройстве.
        </div>
      </div>
    </div>`;
}
function resetProgress(){if(confirm('Сбросить весь прогресс?')){state.progress={};saveProgress();setScreen('dashboard')}}

function getPalette(){return localStorage.getItem('pharm_palette')||'warm'}
function getMode(){return localStorage.getItem('pharm_mode')||'light'}
function applyTheme(){
  const palette=getPalette();
  let mode=getMode();
  if(mode==='system')mode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',palette+'-'+mode);
  let meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);}
  const colors={warm:{light:'#faf4ec',dark:'#2a2520'},mint:{light:'#f2f8f6',dark:'#1a2422'},lavender:{light:'#f7f2fa',dark:'#1f1a2a'}};
  meta.content=colors[palette][mode];
  const icon=document.getElementById('themeIcon');
  const label=document.getElementById('themeLabel');
  if(mode==='dark'){icon.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';label.textContent='Тёмная'}
  else{icon.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';label.textContent='Светлая'}
}
function setMode(v){localStorage.setItem('pharm_mode',v);applyTheme();if(state.screen==='settings')setScreen('settings')}
function setPalette(v){localStorage.setItem('pharm_palette',v);applyTheme();if(state.screen==='settings')setScreen('settings')}
document.getElementById('themeToggle').addEventListener('click',()=>{setMode(getMode()==='dark'?'light':'dark')});
document.getElementById('nav').addEventListener('click',e=>{const btn=e.target.closest('.nav-btn');if(btn)setScreen(btn.dataset.screen)});
applyTheme();setScreen('dashboard');
</script>
</body>
</html>
