function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function arrangeSessionOptions(pool,previousPosition=-1){
  const positionUses=[];
  const seenOrders=new Set();
  return pool.map(q=>{
    const indexed=q.options.map((text,index)=>({text,isCorrect:index===q.correct}));
    const count=indexed.length;
    const candidates=Array.from({length:count},(_,index)=>index)
      .filter(index=>count===1||index!==previousPosition);
    // Keep every eligible position possible while gently balancing their frequency.
    const weights=candidates.map(index=>1/(1+(positionUses[index]||0)));
    let draw=Math.random()*weights.reduce((total,weight)=>total+weight,0);
    const choice=weights.findIndex(weight=>(draw-=weight)<0);
    const correctPosition=candidates[choice<0?candidates.length-1:choice];
    positionUses[correctPosition]=(positionUses[correctPosition]||0)+1;
    previousPosition=correctPosition;
    const distractors=indexed.filter(o=>!o.isCorrect);
    let chosen=null;
    let differentOrder=null;
    const originalOrder=JSON.stringify(q.options.map(String));
    for(let attempt=0;attempt<80;attempt++){
      const arranged=shuffle(distractors);
      arranged.splice(correctPosition,0,indexed[q.correct]);
      const signature=JSON.stringify(arranged.map(o=>String(o.text)));
      if(signature!==originalOrder)differentOrder={arranged,signature};
      if(signature!==originalOrder&&!seenOrders.has(signature)){
        chosen={arranged,signature};
        break;
      }
    }
    chosen=chosen||differentOrder;
    if(!chosen){
      const arranged=shuffle(distractors);
      arranged.splice(correctPosition,0,indexed[q.correct]);
      chosen={arranged,signature:JSON.stringify(arranged.map(o=>String(o.text)))};
    }
    seenOrders.add(chosen.signature);
    return {...q,options:chosen.arranged.map(o=>o.text),correct:correctPosition};
  });
}
function editDist(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);}return dp[m][n];}
function normalize(s){return s.toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,'').replace(/[^а-яa-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim();}
function isDrugMatch(input,drug){const a=normalize(input),b=normalize(drug);if(!a||a.length<4)return false;if(a===b)return true;if(b.startsWith(a)||a.startsWith(b))return true;const threshold=Math.max(1,Math.floor(Math.max(a.length,b.length)/6));return editDist(a,b)<=threshold;}
function classifyCheck(input,drugs){
  const parts=input.split(/[,;]+/).map(s=>s.trim()).filter(s=>s);
  const usedDrugs=new Set();const usedInputs=new Set();const matched=[];
  parts.forEach((p,pi)=>{drugs.forEach((d,di)=>{if(usedDrugs.has(di))return;if(isDrugMatch(p,d)){usedDrugs.add(di);usedInputs.add(pi);matched.push(d);}});});
  const missed=drugs.filter((d,i)=>!usedDrugs.has(i));
  const extra=parts.filter((p,i)=>!usedInputs.has(i));
  return {matched,missed,extra,correct:matched.length,total:drugs.length};
}

function backToSessionTopics(){state.sessionStage='topics';renderSessionSetup();screenEl.scrollTop=0;}

function setSessionQuestionCount(value){state.sessionQuestionCount=value;renderSessionSettings();}
function setSessionTimeLimit(value){state.sessionTimeLimit=Math.max(1,Number(value)||20);}
function rerenderPickerKeepingScroll(renderFn){

function setSessionOrder(order){if(order!=='ordered'&&order!=='random')return;state.sessionOrder=order;renderSessionSettings();}
function toggleSkill(s){state.selectedSkills[s]=!state.selectedSkills[s];renderSessionSettings();}
function toggleTopic(sec){state.selectedTopics[sec]=!state.selectedTopics[sec];renderSessionTopics();}

function spreadQuestionVariants(pool){
  const first=[],second=[],families=new Set();
  for(const question of shuffle(pool)){
    const family=question.id.replace(/_alt$/,'');
    (families.has(family)?second:first).push(question);
    families.add(family);
  }
  if(second.length>1 && first.at(-1).id.replace(/_alt$/,'')===second[0].id.replace(/_alt$/,'')){
    [second[0],second[1]]=[second[1],second[0]];
  }
  return first.length===1 ? first : first.concat(second);
}
function getSessionQuestionPool(selected,activeSkills){
  const pool=QUESTIONS.filter(q=>selected.includes(q.section)&&activeSkills.includes(SKILLS[q.id]));
  if(state.sessionOrder==='ordered')return pool.filter(q=>!q.id.endsWith('_alt'));
  return spreadQuestionVariants(pool);
}
function startSession(){
  const sections=[...new Set(QUESTIONS.map(q=>q.section))];
  const selected=sections.filter(sec=>state.selectedTopics[sec]);
  const activeSkills=SKILL_LIST.filter(skill=>state.selectedSkills[skill]);
  let pool=getSessionQuestionPool(selected,activeSkills);
  if(!pool.length){alert('Нет вопросов под выбранными фильтрами');return;}
  const requested=state.sessionQuestionCount==='all'?pool.length:Number(state.sessionQuestionCount)||pool.length;
  if(pool.length>requested)pool=pool.slice(0,requested);
  pool=arrangeSessionOptions(pool);
  if(window._pharmExamTimer){clearInterval(window._pharmExamTimer);window._pharmExamTimer=null;}
  state.session={questions:pool,index:0,answers:[],mode:state.sessionMode,startedAt:Date.now(),timeLimit:state.sessionMode==='exam'?state.sessionTimeLimit*60:0,remaining:state.sessionMode==='exam'?state.sessionTimeLimit*60:0,finished:false};
  titleEl.textContent=state.sessionMode==='exam'?'Экзамен':'Изучение';
  renderQuestion();
  if(state.session.mode==='exam')startExamTimer();
}
function startExamTimer(){
  if(window._pharmExamTimer)clearInterval(window._pharmExamTimer);
  window._pharmExamTimer=setInterval(()=>{
    const session=state.session;if(!session||session.mode!=='exam'||session.finished){clearInterval(window._pharmExamTimer);window._pharmExamTimer=null;return;}
    session.remaining=Math.max(0,Math.ceil((session.startedAt+session.timeLimit*1000-Date.now())/1000));
    const el=document.getElementById('examTimer');
    if(el)el.textContent=formatExamTime(session.remaining);
    if(session.remaining<=0)finishExam();
  },250);
}
function formatExamTime(seconds){const m=Math.floor(seconds/60),sec=seconds%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function finishExam(){const session=state.session;if(!session||session.finished)return;session.finished=true;if(window._pharmExamTimer){clearInterval(window._pharmExamTimer);window._pharmExamTimer=null;}renderReport();}

      <div class="test-question-controls">

      </div>
      ${exam?'<div class="test-question-footnote">Неотвеченные вопросы будут учтены как ошибки в итоговом результате.</div>':`<div class="test-question-footnote">Осталось ответить: ${s.questions.length-answeredCount}. Нажми на номер вопроса, чтобы перейти к нему.</div>`}
    </div>`;
  const questionGrid=screenEl.querySelector('.test-question-grid');

  }

function confirmFinishExam(){if(confirm('Завершить экзамен сейчас? Неотвеченные вопросы будут засчитаны как ошибки.'))finishExam();}
function goToQuestion(index){
  const s=state.session;if(!s||index<0||index>=s.questions.length)return;

function goToNextUnanswered(){
  const s=state.session;if(!s)return;
  const answeredIds=new Set(s.answers.map(a=>a.id));
  for(let offset=1;offset<=s.questions.length;offset++){
    const i=(s.index+offset)%s.questions.length;
    if(!answeredIds.has(s.questions[i].id)){s.index=i;renderQuestion();return;}
  }
  renderReport();

function answerQuestion(i){
  const s=state.session;
  if(!s||s.index>=s.questions.length||s.answers.some(a=>a.id===s.questions[s.index].id))return;

  document.querySelectorAll('#qOptions .q-option').forEach((b,index)=>{

    b.setAttribute('aria-pressed',index===i?'true':'false');
  });

function confirmAnswerQuestion(){
  const s=state.session;if(!s||s.pendingAnswer===null||s.pendingAnswer===undefined)return;
  const i=s.pendingAnswer,q=s.questions[s.index];if(s.answers.some(a=>a.id===q.id))return;

  s.answers.push({id:q.id,correct:isCorrect,section:q.section,choice:i});

function startClassify(){
  const sections=[...new Set(GROUPS.map(g=>g.section))];
  const selected=sections.filter(s=>state.selectedClassifySections[s]);

function renderClassifyQuestion(){
  const s=state.classifySession;

function checkClassifyAnswer(){
  const s=state.classifySession;

  const res=classifyCheck(input,g.drugs);
  s.results.push({group:g.group,section:g.section,...res});
  if(!state.progress._topicClassify)state.progress._topicClassify={};
  if(!state.progress._topicClassify[g.section])state.progress._topicClassify[g.section]={correct:0,total:0};
  state.progress._topicClassify[g.section].correct+=res.correct;
  state.progress._topicClassify[g.section].total+=res.total;
  saveProgress();
  const status=res.correct===res.total?'good':res.correct===0?'bad':'partial';
  const headerText=status==='good'?'✓ Всё верно':status==='partial'?`~ Частично: ${res.correct} из ${res.total}`:'✗ Ничего не угадано';

    </div>`;
}

function renderClassifyReport(){
  const s=state.classifySession;
  const totalGroups=s.results.length;
  const fullCorrect=s.results.filter(r=>r.correct===r.total).length;
  const partial=s.results.filter(r=>r.correct>0&&r.correct<r.total).length;
  const totalMatched=s.results.reduce((sum,r)=>sum+r.correct,0);
  const totalDrugs=s.results.reduce((sum,r)=>sum+r.total,0);
  const pct=totalDrugs?Math.round(totalMatched/totalDrugs*100):0;
  const weakGroups=s.results.filter(r=>r.correct<r.total);
  state.progress._classifyTests=(state.progress._classifyTests||0)+1;

function startDistribute(){
  const sections=[...new Set(GROUPS.map(g=>g.section))];
  const selected=sections.filter(s=>state.selectedClassifySections[s]);
  let pool=GROUPS.filter(g=>selected.includes(g.section));
  if(pool.length===0){alert('Выбери хотя бы один раздел');return;}
  const allDrugs=[];
  pool.forEach(g=>{g.drugs.forEach(d=>allDrugs.push({drug:d,group:g.group,section:g.section}));});
  const shuffled=shuffle(allDrugs);
  const count=Math.min(8,shuffled.length);
  const round=shuffled.slice(0,count);
  const groups=shuffle([...new Set(round.map(r=>r.group))]);
  state.distribute={round,groups,placement:{},selected:null,checked:false};
  titleEl.textContent='Распределение';
  renderDistributeRound();
}

            <div class="dist-zone-title">${g}</div>

                return `<div class="dist-drug-chip ${cls}">${r.drug}${!d.checked?` <button type="button" class="dist-remove-drug" aria-label="Убрать ${r.drug} из группы" title="Убрать из группы" onclick="event.stopPropagation();removePlacedDrug(${i})">×</button>`:''}</div>`;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      ${!allPlaced?`
        <div class="dist-pool-wrap">
          <div class="dist-pool-title">Осталось распределить: <strong>${d.round.length-placedCount}</strong></div>

            }).join('')}
          </div>
        </div>
      `:''}
      ${d.checked?`
        <div class="dist-result">

      `: `
        <button class="next-btn" ${!allPlaced?'disabled style="opacity:0.4;cursor:not-allowed;box-shadow:none"':''} onclick="checkDistribute()">Проверить</button>

      `}
    </div>`;
}

function removePlacedDrug(i){const d=state.distribute;if(d.checked||d.placement[i]===undefined)return;delete d.placement[i];d.selected=null;renderDistributeRound();}

function answerCase(i){
  const cs=state.caseState;
  cs.pendingAnswer=i;
  document.querySelectorAll('#caseOptions .q-option').forEach((b,index)=>{
    b.classList.toggle('selected',index===i);
    b.setAttribute('aria-pressed',index===i?'true':'false');
  });
  document.getElementById('caseFeedback').innerHTML=`
    <div class="answer-confirm-hint">Проверь выбранное решение. Переход к следующему этапу пока не выполнен.</div>
    <div class="answer-confirm-actions">
      <button type="button" class="next-btn" onclick="confirmCaseAnswer()">Подтвердить выбор</button>
      <button type="button" class="answer-cancel-btn" onclick="cancelCaseAnswer()">Изменить выбор</button>
    </div>`;
}
function cancelCaseAnswer(){
  const cs=state.caseState;if(!cs)return;
  cs.pendingAnswer=null;
  document.querySelectorAll('#caseOptions .q-option').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false');});
  document.getElementById('caseFeedback').innerHTML='<div class="answer-confirm-hint">Выбери вариант, затем подтверди решение.</div>';
}
function confirmCaseAnswer(){
  const cs=state.caseState;if(!cs||cs.pendingAnswer===null||cs.pendingAnswer===undefined)return;
  const opt=cs.options[cs.pendingAnswer];cs.pendingAnswer=null;
  if(controlCaseActive&&controlFinalAttempt&&!controlFinalAttempt.caseResult){controlFinalAttempt.caseTotal++;if(opt.type==='good')controlFinalAttempt.caseCorrect++;}
  document.querySelectorAll('#caseOptions .q-option').forEach(b=>b.disabled=true);
  const breakdown=cs.options.map(option=>`<li style="margin:0 0 12px"><strong>${option.type==='good'?'Верный вариант':'Не подходит'}${option===opt?' · твой выбор':''}</strong><br>${option.text}<br>${option.feedback.replace(/^(?:✅|❌)\s*/, '')}</li>`).join('');
  document.getElementById('caseFeedback').innerHTML=`<div class="case-feedback ${opt.type==='good'?'good':'bad'}"><strong>Разбор вариантов</strong><ol>${breakdown}</ol>${SOURCE_FOOTNOTE}</div><button class="next-btn" onclick="advanceCase('${opt.next}')">Далее →</button>`;
}
function advanceCase(nextId){state.caseState.nodeId=nextId;renderCaseNode();addControlCaseBackButton()}

function renderReferenceClassification(cards,depth=0){
  const labels=[...new Set(cards.map(r=>r.classificationPath[depth]).filter(Boolean))];
  return labels.map(label=>{
    const subset=cards.filter(r=>r.classificationPath[depth]===label);
    const leaf=subset.every(r=>r.classificationPath.length===depth+1);
    if(leaf){
      const drugLinks=subset.flatMap(card=>{
        const cardIndex=REFERENCE_CARDS.indexOf(card);
        return card.drugs.map((drug,drugIndex)=>`<button type="button" class="classification-drug-link" onclick="openClassificationDrugCard(${cardIndex},${drugIndex})">${drug}</button>`);
      });
      return `<section class="classification-document-group">
        <h${Math.min(depth+2,5)} class="classification-document-heading">${label}</h${Math.min(depth+2,5)}>
        <div class="classification-document-drugs">${drugLinks.join(' ')}</div>
      </section>`;
    }
    const headingLevel=Math.min(depth+1,4);
    return `<section class="classification-document-section classification-depth-${depth}">
      <h${headingLevel} class="classification-document-heading">${label}</h${headingLevel}>
      ${renderReferenceClassification(subset,depth+1)}
    </section>`;
  }).join('');
}

function openClassificationDrugCard(cardIndex,drugIndex){
  const card=REFERENCE_CARDS[cardIndex];
  const drug=card&&card.drugs?card.drugs[drugIndex]:null;
  if(!card||!drug)return;
  document.getElementById('classificationDrugOverlay')?.remove();
  const overlay=document.createElement('div');
  overlay.id='classificationDrugOverlay';
  overlay.className='classification-drug-overlay';
  const returnFocus=document.activeElement;
  let closeOnEscape;
  const closeCard=()=>{
    if(!overlay.isConnected)return;
    overlay.remove();
    document.removeEventListener('keydown',closeOnEscape);
    if(returnFocus&&typeof returnFocus.focus==='function')returnFocus.focus({preventScroll:true});
  };
  overlay.innerHTML=`<article class="classification-drug-dialog" role="dialog" aria-modal="true" aria-label="Карточка препарата: ${drug}">
    <button type="button" class="classification-drug-close" aria-label="Закрыть карточку" title="Закрыть">×</button>
    <div class="classification-drug-kicker">${card.section||'Классификация лекарственных средств'}</div>
    <h2>${drug}</h2>
    <div class="classification-drug-group">${card.title||''}</div>
    ${card.desc?`<p class="classification-drug-summary">${card.desc}</p>`:''}
    <div class="classification-drug-details">${card.details||'Подробное описание для этой позиции пока не добавлено.'}</div>
    ${card.section==='Средства для анестезии'?renderAnesthesiaRecipe(drug):''}
  </article>`;
  overlay.addEventListener('click',event=>{if(event.target===overlay)closeCard()});
  overlay.querySelector('.classification-drug-close')?.addEventListener('click',closeCard);
  document.body.appendChild(overlay);
  closeOnEscape=event=>{if(event.key==='Escape')closeCard()};
  document.addEventListener('keydown',closeOnEscape);
  overlay.querySelector('.classification-drug-close')?.focus();
}

function renderClassificationNotes(cards,depth=0){
  const groups=new Map();
  const entries=[];
  for(const card of cards){
    const heading=card.classificationPath[depth];
    if(heading){
      if(!groups.has(heading))groups.set(heading,[]);
      groups.get(heading).push(card);
    }else if(card.drugs.length){
      entries.push(`<div class="conspect-card"><div class="conspect-card-drugs">${card.drugs.map(escapeHtml).join(' · ')}</div><p class="conspect-text">${escapeHtml(card.details||card.desc||'Состав группы по кафедральной классификации.')}</p></div>`);
    }
  }
  return entries.join('')+[...groups].map(([heading,subset])=>
    `${depth===0
      ? `<details class="classification-note"><summary><span>${escapeHtml(heading)}</span><span class="classification-note-icon" aria-hidden="true">⌄</span></summary><div class="classification-note-body">${renderClassificationNotes(subset,depth+1)}${SOURCE_FOOTNOTE}</div></details>`
      : `<section><h${Math.min(depth+2,6)} class="conspect-card-title">${escapeHtml(heading)}</h${Math.min(depth+2,6)}>${renderClassificationNotes(subset,depth+1)}</section>`}`
  ).join('');
}

function normalizeControlAnswer(v){

function controlEditDistance(a,b){
 const p=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
  let d=p[0];p[0]=i;
  for(let j=1;j<=b.length;j++){
   const old=p[j];
   p[j]=Math.min(p[j]+1,p[j-1]+1,d+(a[i-1]===b[j-1]?0:1));
   d=old;
  }
 }
 return p[b.length];
}
function controlCanonicalAnswer(value,kind){
 const valueNormalized=normalizeControlAnswer(value);
 const aliases={
  section:{
   'хм':'холиномиметики',
   'холиномиметик':'холиномиметики',
   'фос':'средства при отравлении фос',
   'средства при отравлении фос':'средства при отравлении фос'
  }
 };
 return aliases[kind]&&aliases[kind][valueNormalized]||valueNormalized;
}
function controlTextMatches(input,expected,kind){
 const actual=controlCanonicalAnswer(input,kind),target=controlCanonicalAnswer(expected,kind);
 if(!actual||!target)return false;
 if(actual===target)return true;
 // Допускаем только небольшое число опечаток; перестановка слов и пропуск части названия не считаются совпадением.
 const limit=target.length>=16?2:(target.length>=6?1:0);
 return limit>0&&Math.abs(actual.length-target.length)<=limit&&controlEditDistance(actual,target)<=limit;

function evaluateControlDictationAnswer(answer,paths){
 const s=String(answer.section||'').trim(),g=String(answer.group||'').trim();
 if(!s&&!g)return{status:'empty',label:'Не заполнено'};
 if(!s||!g)return{status:'partial',label:'Заполнены не все уровни'};
 const match=paths.find(p=>controlTextMatches(s,p.section,'section')&&controlTextMatches(g,p.group,'group'));
 if(match){
  const exact=normalizeControlAnswer(s)===normalizeControlAnswer(match.section)&&normalizeControlAnswer(g)===normalizeControlAnswer(match.group);
  const shortAlias=normalizeControlAnswer(s)==='хм'&&normalizeControlAnswer(match.section)==='холиномиметики';
  return{status:exact||shortAlias?'correct':'typo',label:exact||shortAlias?'Верно':'Верно, с опечаткой'};
 }
 if(paths.some(p=>controlTextMatches(s,p.group,'group')&&controlTextMatches(g,p.section,'section')))return{status:'order',label:'Перепутаны местами раздел и группа/подгруппа'};
 const sm=paths.some(p=>controlTextMatches(s,p.section,'section'));
 const gm=paths.some(p=>controlTextMatches(g,p.group,'group'));
 if(sm&&!gm)return{status:'group',label:'Раздел верный, группа/подгруппа — нет'};
 if(gm&&!sm)return{status:'section',label:'Группа/подгруппа верная, раздел — нет'};
 return{status:'wrong',label:'Неверная классификация'};
}

let offlineStatus='Подготавливаем офлайн-доступ…';
function setOfflineStatus(text){
  offlineStatus=text;
  const label=document.getElementById('offlineStatus');
  if(label)label.textContent=text;
}
async function prepareOffline(){
  if(!('serviceWorker' in navigator)||!window.isSecureContext){
    setOfflineStatus('В этом браузере офлайн-доступ недоступен.');
    return;
  }
  try{
    await navigator.serviceWorker.register('./sw.js');
    const registration=await Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('Офлайн-кэш не готов')),15000))
    ]);
    const filenames=['index.html','adrenergic-synapse.html'];
    const cacheNames=(await caches.keys()).filter(name=>name.startsWith('pharmstudy-offline-'));
    for(const name of cacheNames){
      const cache=await caches.open(name);
      const saved=await Promise.all(filenames.map(file=>cache.match(new URL(file,registration.scope).href)));
      if(saved.every(response=>response?.ok)){
        setOfflineStatus('Сайт сохранён для офлайн-работы на этом устройстве.');
        return;
      }
    }
    throw new Error('Не все страницы сохранены');
  }catch{
    setOfflineStatus('Офлайн-копия ещё не готова. Открой сайт с интернетом и обнови страницу.');
  }
}

function resetProgress(){if(confirm('Сбросить весь прогресс?')){state.progress={};saveProgress();setScreen('dashboard')}}

function getPalette(){
  try{
    const value=localStorage.getItem('pharm_palette');
    return ['warm','mint','lavender'].includes(value)?value:'warm';
  }catch{return 'warm'}
}
function getMode(){
  try{
    const value=localStorage.getItem('pharm_mode');
    return ['light','dark','system'].includes(value)?value:'light';
  }catch{return 'light'}
}
function applyTheme(){
  const palette=getPalette();
  let mode=getMode();
  if(mode==='system'){
    try{mode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
    catch{mode='light';}
  }
  const colors={warm:{light:'#faf4ec',dark:'#2a2520'},mint:{light:'#f2f8f6',dark:'#1a2422'},lavender:{light:'#f7f2fa',dark:'#1f1a2a'}};
  document.documentElement.setAttribute('data-theme',palette+'-'+mode);
  let meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);}
  meta.content=colors[palette][mode];
  const icon=document.getElementById('themeIcon');
  const label=document.getElementById('themeLabel');
  if(icon&&label){
    if(mode==='dark'){icon.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';label.textContent='Тёмная';}
    else{icon.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l-1.41 1.41M17.66 6.34l1.41-1.41"/>';label.textContent='Светлая';}
  }
}
function setMode(v){localStorage.setItem('pharm_mode',v);applyTheme();if(state.screen==='settings')setScreen('settings')}
function setPalette(v){localStorage.setItem('pharm_palette',v);applyTheme();if(state.screen==='settings')setScreen('settings')}

document.getElementById('nav').addEventListener('click',e=>{const btn=e.target.closest('.nav-btn');if(btn)setScreen(btn.dataset.screen)});
try{applyTheme()}catch(err){console.error('PharmStudy: не удалось применить тему оформления',err)}
function bootPharmStudy(){
  if(accountsEnabled)accountRequest('account').then(account=>{applyAccount(account);if(state.screen==='settings')setScreen('settings');}).catch(()=>{});
  try{
    setScreen('dashboard');
    if(!screenEl.children.length)throw new Error('Главная страница не отрисовала содержимое');
  }catch(err){
    console.error('PharmStudy: ошибка начальной отрисовки',err);
    if(screenEl&&!screenEl.children.length){
      screenEl.innerHTML='<div class="panel" style="margin-top:20px"><h3>Не удалось загрузить главную страницу</h3><p style="color:var(--text-muted)">Обнови страницу. Если ошибка повторится, сообщи об этом.</p><button class="next-btn" id="retryDashboard">Повторить загрузку</button></div>';
      document.getElementById('retryDashboard')?.addEventListener('click',()=>setScreen('dashboard'));
    }
  }
}

/* Обработчики контроля на корневом контейнере в capture-фазе.
   Так клик перехватывается до возможных обработчиков вложенных компонентов. */
screenEl.addEventListener('click',function(event){
 const button=event.target.closest('[data-control-action]');
 if(!button||!screenEl.contains(button))return;
 const action=button.dataset.controlAction;
 try{
  if(action==='start-final-attempt')startControlFinalAttempt();
  else if(action==='finish-final-attempt')finishControlFinalAttempt();
  else if(action==='restart-final-attempt')restartControlFinalAttempt();
  else if(action==='open-final')openControlFinal(Number(button.dataset.controlNumber||1));
  else if(action==='back-list')backToControlList();
  else if(action==='generate-dictation')generateControlDictation();
  else if(action==='start-dictation')startControlDictation(Number(button.dataset.controlIndex||0));
  else if(action==='restart-dictation'){if(!controlFinalAttempt)startControlDictation(Number(controlDictationAttempt?.variant||0));}
  else if(action==='dictation-to-variants'){if(!controlFinalAttempt){controlDictationAttempt=null;renderControlDictationVariants();}}
  else if(action==='submit-dictation')submitControlDictation();
  else if(action==='start-classification')startControlClassification();
  else if(action==='check-classification')checkControlClassification();
  else if(action==='next-classification')nextControlClassification();
  else if(action==='cancel-classification')cancelControlClassification();
  else return;
  event.preventDefault();
  event.stopPropagation();
 }catch(error){
  console.error('Ошибка задания Итога 1:',error);
  const root=document.getElementById('controlDictationResults')||document.getElementById('controlClassificationResults');
  if(root)root.innerHTML='<div class="control-dictation-empty" role="alert">Ошибка задания: '+escapeHtml(error&&error.message?error.message:String(error))+'</div>';
 }
},true);
screenEl.addEventListener('input',function(event){
 const field=event.target.closest('[data-control-input]');
 if(!field||!screenEl.contains(field))return;
 updateControlDictationAnswer(Number(field.dataset.controlIndex),field.dataset.controlField,field.value);
},true);

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',bootPharmStudy,{once:true});
}else{
  bootPharmStudy();
}
</script>
