<!DOCTYPE html>
<html lang="ru" data-theme="warm-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b8d6ce">
<title>PharmStudy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --mint:#7cc5b8;--mint-soft:#e0f2ef;
  --lavender-deco:#b8a8e0;--lavender-soft:#ede7f7;
  --warm:#f5be7c;--warm-soft:#fdf0dd;
  --success:#7fc99a;--success-soft:#e0f4e7;
  --error:#f09098;--error-soft:#fde6e8;
}
[data-theme="warm-light"]{--sidebar-bg:#b8d6ce;--sidebar-text:#5d7268;--sidebar-text-active:#2d3f38;--sidebar-active-bg:rgba(255,255,255,0.7);--bg:#faf4ec;--card:#ffffff;--card-2:#f7f0e6;--text:#3d3535;--text-muted:#8a7d78;--border:rgba(180,160,140,0.12);--shadow:0 4px 20px rgba(180,160,140,0.12);--shadow-sm:0 2px 10px rgba(180,160,140,0.08);--accent:#ff9e85;--accent-soft:#ffe6df;--accent-deep:#e8836a;--hero-from:#ffb8a0;--hero-to:#c5b5e8;--avatar-from:#ffc4b0;--avatar-to:#c5b5e8}
[data-theme="warm-dark"]{--sidebar-bg:#232a28;--sidebar-text:#a8b8b0;--sidebar-text-active:#f0f5f0;--sidebar-active-bg:rgba(124,197,184,0.18);--bg:#2a2520;--card:#38322c;--card-2:#443d36;--text:#f5ede2;--text-muted:#a89c90;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.25);--shadow-sm:0 2px 10px rgba(0,0,0,0.18);--accent:#ffa88e;--accent-soft:rgba(255,168,142,0.15);--accent-deep:#ff9578;--hero-from:#7a5a48;--hero-to:#5a4d70;--avatar-from:#c58a78;--avatar-to:#8a7ab0}
[data-theme="mint-light"]{--sidebar-bg:#c8dfd8;--sidebar-text:#4a6862;--sidebar-text-active:#1f3330;--sidebar-active-bg:rgba(255,255,255,0.75);--bg:#f2f8f6;--card:#ffffff;--card-2:#e8f3ef;--text:#2a3a37;--text-muted:#758a85;--border:rgba(100,140,130,0.1);--shadow:0 4px 20px rgba(120,170,155,0.12);--shadow-sm:0 2px 10px rgba(120,170,155,0.08);--accent:#5fb8a8;--accent-soft:#dcf2ed;--accent-deep:#44948a;--hero-from:#8dd4c4;--hero-to:#a8c8e0;--avatar-from:#8dd4c4;--avatar-to:#a8c8e0}
[data-theme="mint-dark"]{--sidebar-bg:#1d2b28;--sidebar-text:#90aca4;--sidebar-text-active:#e8f5f1;--sidebar-active-bg:rgba(95,184,168,0.2);--bg:#1a2422;--card:#243330;--card-2:#2d3e3a;--text:#e5f2ee;--text-muted:#8aa39c;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-sm:0 2px 10px rgba(0,0,0,0.2);--accent:#7cd0be;--accent-soft:rgba(124,208,190,0.15);--accent-deep:#5fb8a8;--hero-from:#3a6a5f;--hero-to:#3a5a70;--avatar-from:#6db8a8;--avatar-to:#7aa8c0}
[data-theme="lavender-light"]{--sidebar-bg:#d8cce8;--sidebar-text:#63557a;--sidebar-text-active:#2d2140;--sidebar-active-bg:rgba(255,255,255,0.75);--bg:#f7f2fa;--card:#ffffff;--card-2:#f0e8f5;--text:#322a3d;--text-muted:#857a92;--border:rgba(140,120,160,0.1);--shadow:0 4px 20px rgba(170,140,190,0.14);--shadow-sm:0 2px 10px rgba(170,140,190,0.08);--accent:#b89dd6;--accent-soft:#ede2f5;--accent-deep:#9575b8;--hero-from:#c8aae0;--hero-to:#f0b5d0;--avatar-from:#c8aae0;--avatar-to:#f0b5d0}
[data-theme="lavender-dark"]{--sidebar-bg:#252030;--sidebar-text:#a094b5;--sidebar-text-active:#efe8f8;--sidebar-active-bg:rgba(184,157,214,0.2);--bg:#1f1a2a;--card:#2a2438;--card-2:#352d45;--text:#efe8f8;--text-muted:#9d90ad;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-sm:0 2px 10px rgba(0,0,0,0.2);--accent:#c8aae0;--accent-soft:rgba(200,170,224,0.15);--accent-deep:#b89dd6;--hero-from:#5a4870;--hero-to:#7a4868;--avatar-from:#9a7ab8;--avatar-to:#c88aa0}
[data-theme$="-dark"]{
  --mint-soft:rgba(124,197,184,0.15);
  --lavender-soft:rgba(197,181,232,0.15);
  --warm-soft:rgba(245,190,124,0.15);
  --success-soft:rgba(127,201,154,0.15);
  --error-soft:rgba(240,144,152,0.15);
  --accent-soft:rgba(255,168,142,0.15);
}
[data-theme$="-dark"]{color-scheme:dark}
[data-theme$="-light"]{color-scheme:light}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--card-2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:5px;border:2px solid var(--card-2)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);padding:24px 14px;display:flex;flex-direction:column;gap:20px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:10;border-radius:0 28px 28px 0;transition:background .3s}
.profile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 4px 20px;border-bottom:1px solid rgba(255,255,255,0.3)}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;box-shadow:0 4px 14px rgba(150,120,140,0.25)}
.profile-name{color:var(--sidebar-text-active);font-weight:700;font-size:16px}
.profile-sub{color:var(--sidebar-text);font-size:12px;text-align:center;opacity:0.85}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:transparent;color:var(--sidebar-text);font-size:14px;font-family:inherit;font-weight:600;border-radius:16px;cursor:pointer;text-align:left;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,0.4);color:var(--sidebar-text-active)}
.nav-btn.active{background:var(--sidebar-active-bg);color:var(--sidebar-text-active);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
.premium-block{background:linear-gradient(150deg,rgba(255,255,255,0.5),rgba(255,255,255,0.25));border-radius:20px;padding:18px 12px;text-align:center;border:1px solid rgba(255,255,255,0.4)}
.premium-block .crown{font-size:26px;margin-bottom:6px}
.premium-block h4{color:var(--sidebar-text-active);font-size:13px;margin-bottom:4px;font-weight:700}
.premium-block p{color:var(--sidebar-text);font-size:11px;margin-bottom:12px}
.premium-block button{width:100%;padding:10px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.content{flex:1;margin-left:240px;padding:28px 36px 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}
.topbar h1{font-size:26px;font-weight:700}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm)}
.theme-toggle svg{width:16px;height:16px}
.hero{background:linear-gradient(135deg,var(--hero-from) 0%,var(--hero-to) 100%);border-radius:28px;padding:32px;margin-bottom:24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(150,120,140,0.22)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,0.15)}
.hero h2{font-size:24px;font-weight:700;margin-bottom:6px;position:relative}
.hero p{font-size:14px;opacity:.95;margin-bottom:20px;position:relative}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:16px;border:none;background:#fff;color:var(--accent-deep);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;position:relative;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
.hero-btn svg{width:16px;height:16px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stat-card:nth-child(1){background:linear-gradient(160deg,var(--mint-soft),var(--card))}
.stat-card:nth-child(2){background:linear-gradient(160deg,var(--accent-soft),var(--card))}
.stat-card:nth-child(3){background:linear-gradient(160deg,var(--lavender-soft),var(--card))}
.stat-card:nth-child(4){background:linear-gradient(160deg,var(--warm-soft),var(--card))}
.stat-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:var(--card)}
.stat-icon svg{width:20px;height:20px}
.stat-icon.mint{color:var(--mint)}.stat-icon.lavender{color:var(--lavender-deco)}.stat-icon.accent{color:var(--accent)}.stat-icon.warm{color:var(--warm)}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.stat-value{font-size:28px;font-weight:700;line-height:1.1}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.row-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px}
/* Keep dashboard panels independent: expanding one must not stretch the other into an empty box. */
.row-2{align-items:start}
.panel{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel-head h3{font-size:16px;font-weight:700}
.panel-head .badge{font-size:11px;color:var(--text-muted);background:var(--card-2);padding:5px 12px;border-radius:10px;font-weight:600}
.topic-list{display:flex;flex-direction:column;gap:16px}
.topic-row{display:flex;flex-direction:column;gap:8px}
.topic-top{display:flex;justify-content:space-between;font-size:12px}
.topic-name{font-weight:600}
.topic-pct{color:var(--text-muted);font-weight:600}
.topic-bar{height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.topic-fill{height:100%;border-radius:4px;transition:width .4s}
.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:var(--card-2);cursor:pointer;transition:all .2s}
.recent-item:hover{background:var(--accent-soft);transform:translateX(3px)}
.recent-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.recent-info{flex:1;min-width:0}
.recent-title{font-size:13px;font-weight:700}
.recent-sub{font-size:11px;color:var(--text-muted)}
.dashboard-fold{margin-top:2px}
.dashboard-fold summary{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;cursor:pointer;padding:14px 16px;border-radius:16px;background:var(--card-2);color:var(--text);font-size:13px;font-weight:700;transition:background .2s}
.dashboard-fold summary::-webkit-details-marker{display:none}
.dashboard-fold summary::after{content:'＋';font-size:18px;line-height:1;color:var(--text-muted);flex-shrink:0}
.dashboard-fold[open] summary::after{content:'−'}
.dashboard-fold summary:hover{background:var(--accent-soft)}
.dashboard-fold-count{margin-left:auto;color:var(--text-muted);font-size:11px;font-weight:600;white-space:nowrap}
.dashboard-fold .recent-list,.dashboard-fold .topic-list{margin-top:12px}
.question-card,.case-card,.report-card,.case-picker{background:var(--card);border-radius:28px;padding:36px;box-shadow:var(--shadow);max-width:820px;margin:0 auto}
.q-progress{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.q-progress-bar{flex:1;height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.q-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--lavender-deco));border-radius:4px;transition:width .3s}
.q-progress-text{font-size:12px;color:var(--text-muted);font-weight:600}
.q-text{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:28px}
.q-options{display:flex;flex-direction:column;gap:12px}
.q-option{padding:18px 20px;border-radius:18px;background:var(--card-2);border:2px solid transparent;color:var(--text);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:14px}
.q-option:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.q-option:disabled{cursor:default}
.q-option-letter{width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.q-option.correct{background:var(--success-soft);border-color:var(--success)}
.q-option.correct .q-option-letter{background:var(--success);color:#fff}
.q-option.wrong{background:var(--error-soft);border-color:var(--error)}
.q-option.wrong .q-option-letter{background:var(--error);color:#fff}
.explanation{margin-top:24px;padding:22px;background:var(--accent-soft);border-radius:20px;border-left:4px solid var(--accent)}
.explanation h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.3px}
.explanation p{font-size:14px;line-height:1.65;color:var(--text)}
.explanation .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:10px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--card);color:var(--text-muted);letter-spacing:0.2px}
.explanation .source{font-size:11px;color:var(--text-muted);margin-top:12px;font-style:italic}
.next-btn{margin-top:22px;width:100%;padding:16px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,0.15)}
.case-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.case-badge{padding:5px 12px;border-radius:10px;background:var(--warm-soft);color:#b8801f;font-size:11px;font-weight:700;letter-spacing:0.3px}
.case-title{font-size:17px;font-weight:700}
.case-intro{padding:22px;background:var(--lavender-soft);border-radius:20px;font-size:14px;line-height:1.65;margin-bottom:24px;border-left:4px solid var(--lavender-deco)}
.case-question{font-size:17px;font-weight:600;margin-bottom:18px}
.case-feedback{padding:18px;border-radius:18px;margin-top:18px;font-size:13px;line-height:1.65}
.case-feedback.good{background:var(--success-soft);border-left:4px solid var(--success)}
.case-feedback.bad{background:var(--error-soft);border-left:4px solid var(--error)}
.case-feedback.neutral{background:var(--warm-soft);border-left:4px solid var(--warm)}
.case-pick-item{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--card-2);cursor:pointer;margin-bottom:12px;transition:all .2s}
.case-pick-item:hover{background:var(--accent-soft);transform:translateX(4px)}
.case-pick-icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--lavender-deco));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.case-pick-info{flex:1}
.case-pick-title{font-size:15px;font-weight:700;margin-bottom:2px}
.case-pick-sub{font-size:12px;color:var(--text-muted)}
.report-card{text-align:center}
.report-emoji{font-size:56px;margin-bottom:16px}
.report-title{font-size:24px;font-weight:700;margin-bottom:8px}
.report-sub{font-size:14px;color:var(--text-muted);margin-bottom:28px}
.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.report-stat{background:var(--card-2);border-radius:20px;padding:18px}
.report-stat-val{font-size:26px;font-weight:700}
.report-stat-lbl{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.report-weak{text-align:left;margin-bottom:22px}
.report-weak h4{font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.3px}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{padding:12px 14px;border-radius:14px;background:var(--error-soft);border-left:3px solid var(--error);font-size:13px;font-weight:500}
.theory-section{margin-bottom:32px}
.theory-card{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:12px;cursor:pointer;transition:all .2s}
.theory-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.theory-card-head{display:flex;align-items:center;gap:12px}
.theory-card-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.theory-card-title{font-size:16px;font-weight:700}
.theory-card-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.theory-card-body{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;line-height:1.7;color:var(--text)}
.theory-card-body.show{display:block}
.theory-card-body h4{font-size:12px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:6px;margin-top:14px}
.theory-card-body h4:first-child{margin-top:0}
.theory-card-body ul{margin:0 0 8px 0;padding-left:20px}
.theory-card-body li{margin-bottom:3px}
.theory-card-body strong{color:var(--text)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ref-section{margin-bottom:32px}
.ref-section-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text)}
.ref-card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s}
.ref-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ref-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ref-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.ref-card h3{font-size:14px;font-weight:700;line-height:1.3}
.ref-card p{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5}
.ref-drugs{display:flex;flex-wrap:wrap;gap:6px}
.ref-drug{font-size:11px;padding:4px 10px;border-radius:8px;background:var(--card-2);color:var(--text-muted);font-weight:600}
.palette-card{padding:16px;border-radius:18px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;text-align:center}
.palette-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.palette-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.palette-swatch{width:100%;height:50px;border-radius:12px;margin-bottom:10px}
.palette-name{font-size:13px;font-weight:700;margin-bottom:4px}
.palette-sub{font-size:11px;color:var(--text-muted)}
.topic-pick{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card-2);cursor:pointer;transition:all .2s;border:2px solid transparent;margin-bottom:10px}
.topic-pick:hover{background:var(--accent-soft)}
.topic-pick.selected{border-color:var(--accent);background:var(--accent-soft)}

.classify-setup{display:flex;flex-direction:column;max-height:calc(100dvh - 112px);min-height:0;overflow:hidden;padding:24px 28px}
.classify-setup .classify-tabs{flex-shrink:0;margin-bottom:14px}
.classify-setup-heading{flex-shrink:0}
.classify-setup .topic-actions{flex-shrink:0;margin-bottom:10px}
.classify-topic-list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 4px 0;margin:0 0 12px}
.classify-topic-list .topic-pick:last-child{margin-bottom:0}
.classify-setup-footer{flex-shrink:0;padding-top:2px;background:var(--card)}
.classify-setup-footer .summary-box{margin-bottom:10px;padding:10px 14px}
.classify-setup-footer .summary-box .val{font-size:22px}
.classify-setup-footer .next-btn{margin-top:0;padding:13px}
.classify-setup-footer .classify-home-btn{background:transparent;color:var(--text-muted);box-shadow:none;margin-top:6px}
@media(max-width:768px){.classify-setup{max-height:calc(100dvh - 158px);padding:18px 16px;border-radius:22px}.classify-setup .ctab{padding:9px 11px;font-size:12px}.classify-setup-heading>div:first-child{font-size:18px!important}.classify-setup-footer .summary-box{padding:8px 10px}.classify-setup-footer .summary-box .val{font-size:19px}.classify-setup-footer .next-btn{padding:12px}}

.topic-check{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;font-weight:700;transition:all .2s}
.topic-pick-info{flex:1}
.topic-pick-title{font-size:14px;font-weight:700;margin-bottom:2px}
.topic-pick-sub{font-size:12px;color:var(--text-muted)}
.topic-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.topic-actions button{padding:8px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.topic-actions button:hover{border-color:var(--accent);color:var(--accent-deep)}
.summary-box{padding:18px;background:var(--card-2);border-radius:18px;margin-bottom:18px;text-align:center}
.summary-box .lbl{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.summary-box .val{font-size:26px;font-weight:700}
.summary-box .sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.classify-hint{font-size:12px;color:var(--text-muted);margin-bottom:10px;font-weight:500}
.classify-input{width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--border);background:var(--card-2);color:var(--text);font-family:inherit;font-size:15px;font-weight:500;transition:border-color .2s;outline:none}
.classify-input:focus{border-color:var(--accent);background:var(--card)}
.classify-input::placeholder{color:var(--text-muted);opacity:0.7}
.classify-result{margin-top:18px;padding:18px;background:var(--card-2);border-radius:16px;display:flex;flex-direction:column;gap:8px}
.classify-line{font-size:14px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.classify-mark{font-weight:700;flex-shrink:0;width:20px;text-align:center}
.classify-mark.ok{color:var(--success)}
.classify-mark.miss{color:var(--error)}
.classify-mark.extra{color:var(--warm)}
.conspect{margin-top:20px;padding:20px;background:var(--card-2);border-radius:18px;display:flex;flex-direction:column;gap:16px}
.conspect-block{display:flex;flex-direction:column;gap:6px}
.conspect-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--accent-deep)}
.conspect-text{font-size:13px;line-height:1.6;color:var(--text)}
.conspect-list{margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:var(--text)}
.conspect-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.conspect-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.conspect-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.conspect-card-title{font-size:15px;font-weight:700}
.conspect-card-drugs{font-size:12px;color:var(--text-muted);margin-bottom:14px;font-weight:500}

.synapse-wrap{max-width:1500px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 270px;grid-template-areas:"stage scenarios" "steps scenarios" "info scenarios" "chain scenarios";gap:16px;align-items:start}
.synapse-scenarios{grid-area:scenarios;display:flex;flex-direction:column;gap:8px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-sm)}
.scen-btn{width:100%;text-align:left;padding:11px 12px;border-radius:13px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;line-height:1.35;cursor:pointer;transition:all .2s}
.scen-btn:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateX(-2px)}
.scen-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scen-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 10px rgba(232,131,106,0.25)}
.synapse-stage{grid-area:stage;position:relative;background:#1a2138;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:0}
.synapse-hotspot{position:absolute;z-index:2;transform:translate(-50%,-50%);border:1px solid rgba(127,224,255,.8);border-radius:999px;padding:6px 10px;background:rgba(5,20,48,.88);color:#e8fbff;font:700 11px/1.2 inherit;box-shadow:0 0 14px rgba(58,190,255,.28);cursor:pointer;backdrop-filter:blur(5px);transition:transform .18s,background .18s}
.synapse-hotspot:hover,.synapse-hotspot:focus-visible{background:#12618a;transform:translate(-50%,-50%) scale(1.06);outline:2px solid #a8f0ff;outline-offset:2px}
.hotspot-ca{left:23%;top:30%}.hotspot-ach{left:49%;top:49%}.hotspot-m{left:74%;top:66%}.hotspot-n{left:83%;top:56%}.hotspot-ache{left:60%;top:59%}
@media(max-width:600px){.synapse-hotspot{font-size:9px;padding:5px 7px}.hotspot-ca{left:22%;top:30%}.hotspot-ach{left:48%;top:48%}.hotspot-m{left:72%;top:67%}.hotspot-n{left:82%;top:56%}.hotspot-ache{left:58%;top:59%}}
.synapse-svg{display:block;width:100%;height:auto;min-height:clamp(360px,58vw,620px);max-height:76vh;object-fit:contain}
.synapse-svg .synapse-el{cursor:pointer;transition:filter .2s}
.synapse-svg .synapse-el:hover{filter:brightness(1.35) drop-shadow(0 0 10px rgba(255,180,120,0.8))}
.synapse-tooltip{position:absolute;padding:10px 13px;background:rgba(14,20,38,0.97);color:#fff;font-size:12px;font-weight:500;line-height:1.5;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;white-space:normal;width:min(280px,calc(100% - 24px));box-sizing:border-box;border:1px solid rgba(160,190,255,0.35);box-shadow:0 10px 28px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.synapse-tooltip.show{opacity:1}
.synapse-steps{grid-area:steps;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-sm)}
.synapse-steps-heading{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.synapse-steps-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.synapse-step{display:flex;align-items:center;gap:9px;text-align:left;min-height:54px;padding:9px 10px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.synapse-step span{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:10px;background:var(--accent-soft);color:var(--accent-deep);font-size:11px;font-weight:800}
.synapse-step b{font-size:11px;line-height:1.35}
.synapse-step:hover{transform:translateY(-2px);border-color:var(--accent)}
.synapse-step.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.synapse-svg .step-dim{opacity:.42;transition:opacity .25s,filter .25s}
.synapse-svg .step-focus{opacity:1;filter:drop-shadow(0 0 5px rgba(255,211,138,.55));transition:opacity .25s,filter .25s}
/* ACh release animation runs when step 3 is selected. */
.synapse-svg .ach-release-particles,.synapse-svg .synthesis-visual,.synapse-svg .recycle-visual,.synapse-svg .impulse-visual,.synapse-svg .breakdown-visual{opacity:0;pointer-events:none;transition:opacity .25s}
.synapse-svg.phase-synthesis .synthesis-transfer-visual{opacity:1}.synapse-svg.phase-recycle .choline-uptake-visual{opacity:1}.synapse-svg .choline-uptake-visual{opacity:0;transition:opacity .25s}.synapse-svg .synthesis-transfer-visual{opacity:0;transition:opacity .25s;pointer-events:none}.synapse-svg.phase-synthesis .synthesis-transfer-particle{transform-box:fill-box;transform-origin:center;animation:synthesisTransfer 1.8s ease-in-out infinite}
/* Повторяющиеся стадии должны оставаться живыми до переключения, а не проигрываться один раз. */
.synapse-svg.phase-fusion .fusion-vesicle{animation:vesicleDock 1.1s cubic-bezier(.2,.7,.3,1) infinite}
.synapse-svg.phase-receptors .ach-molecule .ach-float{animation-iteration-count:infinite}
.synapse-svg.phase-breakdown .breakdown-substrate{animation:substratePulse .9s ease-in-out infinite}
.synapse-svg.phase-breakdown .breakdown-product.choline{animation:achSplitCholine .9s ease-out infinite}
.synapse-svg.phase-breakdown .breakdown-product.acetate{animation:achSplitAcetate .9s ease-out infinite}.synapse-svg.phase-synthesis .synthesis-visual,.synapse-svg.phase-impulse .impulse-visual,.synapse-svg.phase-release .ach-release-particles,.synapse-svg.phase-breakdown .breakdown-visual,.synapse-svg.phase-recycle .recycle-visual{opacity:1}
.synapse-svg.phase-impulse .impulse-dot{animation:impulseTravel 1.15s ease-in-out infinite}
.synapse-svg .ca-ion-flow{opacity:0;animation:none}
.synapse-svg.phase-impulse .ca-ion-flow,.synapse-svg.phase-fusion .ca-ion-flow{opacity:1;animation:caFlow 1.8s linear infinite}
.synapse-svg.phase-impulse .ca-ion-flow.d1,.synapse-svg.phase-fusion .ca-ion-flow.d1{animation-delay:-.9s}
.synapse-svg .na-ion-flow{opacity:0;animation:none}
.synapse-svg.phase-receptors .na-ion-flow,.synapse-svg[data-scenario="n-agonist"] .na-ion-flow,.synapse-svg[data-scenario="ache-block"] .na-ion-flow,.synapse-svg[data-scenario="fos"] .na-ion-flow{opacity:1;animation:naFlow 1.8s linear infinite}
.synapse-svg .ach-molecule .ach-float{opacity:0;animation-play-state:paused;transition:opacity .25s}
/* В обычной последовательности показываем только молекулы с понятной траекторией. */
.synapse-svg.phase-release .ach-molecule .ach-float,.synapse-svg.phase-breakdown .ach-molecule .ach-float{opacity:0;animation-play-state:paused}
/* На этапе рецепторов те же молекулы АХ подходят к ближайшим рецепторам, а не исчезают без объяснения. */
.synapse-svg.phase-receptors .ach-molecule .ach-float{opacity:1;animation:achBindLoop 1.8s cubic-bezier(.2,.65,.25,1) infinite}
.synapse-svg.phase-receptors .ach-molecule .ach-float:nth-of-type(1){--bind-x:28px;--bind-y:103px;animation-delay:0s}
.synapse-svg.phase-receptors .ach-molecule .ach-float:nth-of-type(2){--bind-x:38px;--bind-y:118px;animation-delay:.08s}
.synapse-svg.phase-receptors .ach-molecule .ach-float:nth-of-type(3){--bind-x:-10px;--bind-y:116px;animation-delay:.16s}
.synapse-svg.phase-receptors .ach-molecule .ach-float:nth-of-type(4){--bind-x:90px;--bind-y:141px;animation-delay:.24s}
.synapse-svg.phase-receptors .ach-molecule .ach-float:nth-of-type(5){--bind-x:-32px;--bind-y:88px;animation-delay:.32s}
.synapse-svg.phase-recycle .ach-molecule .ach-float{opacity:.15;animation-play-state:paused}
.synapse-svg[data-scenario="normal"]:not([data-active-step]) .ach-molecule .ach-float,
.synapse-svg[data-scenario="ache-block"] .ach-molecule .ach-float,
.synapse-svg[data-scenario="fos"] .ach-molecule .ach-float,
.synapse-svg[data-scenario="m-blocker"] .ach-molecule .ach-float,
.synapse-svg[data-scenario="n-blocker"] .ach-molecule .ach-float,
.synapse-svg[data-scenario="reactivator"] .ach-molecule .ach-float{opacity:1;animation-play-state:running}
.synapse-svg .breakdown-product{opacity:0;transform-box:fill-box;transform-origin:center}
.synapse-svg.phase-breakdown .breakdown-substrate{transform-box:fill-box;transform-origin:center;animation:substrateFade .55s ease-in .05s both}
.synapse-svg.phase-breakdown .breakdown-product.choline{animation:achSplitCholine .85s ease-out .05s both}
.synapse-svg.phase-breakdown .breakdown-product.acetate{animation:achSplitAcetate .85s ease-out .05s both}
.synapse-svg .ach-release-particles{opacity:0;pointer-events:none;}
.synapse-svg.phase-release .ach-release-particles{opacity:1;}
.synapse-svg .ach-release-particle{opacity:0;transform-box:fill-box;transform-origin:center}
.synapse-svg.phase-release .ach-release-particle{animation:achReleaseTravel 2.45s cubic-bezier(.2,.65,.25,1) infinite}
.synapse-svg.phase-release .ach-release-particle.p1{--ach-x:-217px}
.synapse-svg.phase-release .ach-release-particle.p2{--ach-x:-98px;animation-delay:1.18s}
.synapse-svg.phase-release .ach-release-particle.p3{--ach-x:6px;animation-delay:1.26s}
.synapse-svg.phase-release .ach-release-particle.p4{--ach-x:85px;animation-delay:1.34s}
.synapse-svg.phase-release .ach-release-particle.p5{--ach-x:213px;animation-delay:1.42s}
.synapse-svg.phase-fusion .fusion-vesicle,.synapse-svg.phase-release .fusion-vesicle{animation:vesicleDock 1.1s cubic-bezier(.2,.7,.3,1) both}
.synapse-svg.phase-recycle .choline-return-particle{animation:cholineReturn 1.5s ease-in-out infinite}
.synapse-svg.phase-receptors .na-ion-flow{animation:naFlow 1.8s linear infinite}
.synapse-svg.phase-receptors .n-recept .block-x{opacity:0;transition:opacity .2s}
.synapse-svg.phase-receptors .n-recept rect:nth-of-type(2){fill:#65e6c2;filter:url(#softGlow)}
.synapse-svg .ache-block-mark{display:none}
.synapse-svg[data-scenario="ache-block"] .ache-block-mark,.synapse-svg[data-scenario="fos"] .ache-block-mark{display:block}
.synapse-svg[data-scenario="ache-block"] .ache-block-irreversible,.synapse-svg[data-scenario="fos"] .ache-block-reversible{display:none}
.synapse-svg[data-scenario="ache-block"] .ache{filter:drop-shadow(0 0 8px #ffcf70) brightness(.86);animation:achePulse 2.4s ease-in-out infinite}
.synapse-svg[data-scenario="fos"] .ache{filter:drop-shadow(0 0 12px #ff315b) brightness(.62);animation:none}
.synapse-svg[data-scenario="ache-block"] .ach-float{animation-duration:2.8s;filter:drop-shadow(0 0 6px #ffcf70)}
.synapse-svg[data-scenario="fos"] .ach-float{animation-duration:1.15s;filter:drop-shadow(0 0 12px #ff315b)}
.synapse-svg[data-scenario="ache-block"] .m-recept,.synapse-svg[data-scenario="ache-block"] .n-recept{animation:receptorPulse 2s ease-in-out infinite;filter:drop-shadow(0 0 8px #7ce8c8) brightness(1.18)}
.synapse-svg[data-scenario="fos"] .m-recept,.synapse-svg[data-scenario="fos"] .n-recept{animation:receptorPulse .7s ease-in-out infinite;filter:drop-shadow(0 0 14px #ff315b) brightness(1.45)}
.synapse-svg[data-scenario="ache-block"] .ache,.synapse-svg[data-scenario="fos"] .ache{filter:drop-shadow(0 0 8px #ff4060) brightness(.68);animation:none}
.synapse-svg.phase-recycle .ach-molecule{opacity:.22;transition:opacity .3s}
/* Везикула и содержимое движутся вместе к пресинаптической мембране. */
@keyframes synthesisTransfer{0%{transform:translate(0,0);opacity:.45}20%{opacity:1}100%{transform:translate(-65px,-65px);opacity:.95}}
@keyframes achReleaseTravel{0%{transform:translate(0,0) scale(.72);opacity:0}8%{opacity:1}35%{transform:translate(calc(var(--ach-x,0px) * .12),55px) scale(.9);opacity:1}75%{transform:translate(calc(var(--ach-x,0px) * .72),135px) scale(1);opacity:1}100%{transform:translate(var(--ach-x,0px),175px) scale(.55);opacity:0}}
@keyframes vesicleDock{0%{transform:translateY(0)}75%{transform:translateY(132px)}100%{transform:translateY(125px)}}
@keyframes achSplitCholine{0%{transform:translate(0,0) scale(.35);opacity:0}30%{transform:translate(0,0) scale(.35);opacity:0}52%{transform:translate(24px,-18px) scale(.82);opacity:1}100%{transform:translate(82px,-48px) scale(1);opacity:1}}
@keyframes achSplitAcetate{0%{transform:translate(0,0) scale(.35);opacity:0}30%{transform:translate(0,0) scale(.35);opacity:0}52%{transform:translate(28px,16px) scale(.82);opacity:1}100%{transform:translate(112px,52px) scale(1);opacity:1}}
@keyframes cholineReturn{0%{transform:translate(0,0);opacity:0}10%{opacity:1}38%{transform:translate(56px,-1px);opacity:1}68%{transform:translate(106px,-40px);opacity:1}100%{transform:translate(151px,-61px);opacity:1}}
@keyframes substrateFade{0%,35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.35)}}
@keyframes substratePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.92)}}
@keyframes impulseTravel{0%{cx:180;opacity:.45}50%{opacity:1}100%{cx:420;opacity:.8}}

@keyframes naActivate{0%{opacity:.25;transform:translateY(-12px)}100%{opacity:1;transform:translateY(0)}}

.synapse-info{grid-area:info;padding:20px;background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm);margin-bottom:16px;min-height:90px}
.synapse-info-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text)}
.synapse-info-desc{font-size:13px;line-height:1.6;color:var(--text-muted)}
.synapse-chain{grid-area:chain;padding:20px;background:var(--accent-soft);border-radius:20px;border-left:4px solid var(--accent)}
.synapse-chain-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--accent-deep);margin-bottom:8px}
.synapse-chain-text{font-size:14px;line-height:1.6;color:var(--text)}
.ach-float{animation:achFloat 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vesicle-bob{animation:vesicleBob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vesicle-bob.d1{animation-delay:-0.7s}
.vesicle-bob.d2{animation-delay:-1.5s}
.vesicle-bob.d3{animation-delay:-2.3s}
.ache-pulse{animation:achePulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ca-ion-flow{animation:none;opacity:0;transform-box:fill-box;transform-origin:center}
.ca-ion-flow.d1{animation-delay:0s}
.na-ion-flow{animation:none;opacity:0;transform-box:fill-box;transform-origin:center}
.na-ion-flow.d1,.na-ion-flow.d2{animation-delay:0s}
.m-recept,.n-recept{transform-box:fill-box;transform-origin:center;transition:filter .3s;filter:brightness(1.45) saturate(1.2)}
.ca-channel-anim{transform-box:fill-box;transform-origin:center;animation:none;filter:brightness(.72);transition:filter .25s}
.block-x{display:none}
@keyframes achFloat{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(5px,-7px) rotate(8deg)}50%{transform:translate(-3px,-12px) rotate(-5deg)}75%{transform:translate(-7px,-5px) rotate(6deg)}}
@keyframes achBind{0%{transform:translate(0,0) scale(1);filter:drop-shadow(0 0 4px #7fcfff)}72%{transform:translate(calc(var(--bind-x,0px) * .9),calc(var(--bind-y,0px) * .9)) scale(.9);filter:drop-shadow(0 0 9px #7fcfff)}100%{transform:translate(var(--bind-x,0px),var(--bind-y,0px)) scale(.82);filter:drop-shadow(0 0 7px #7fcfff)}}
@keyframes vesicleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes achePulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.2)}}
@keyframes caFlow{0%{transform:translate(0,40px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,-40px);opacity:0}}
@keyframes naFlow{0%{transform:translate(0,25px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,-55px);opacity:0}}
@keyframes channelGlow{0%,100%{filter:brightness(.62) drop-shadow(0 0 2px #8d72bd)}50%{filter:brightness(.72) drop-shadow(0 0 5px #b49ae8)}}
@keyframes receptorPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes receptorFade{0%,100%{opacity:1}50%{opacity:0.5}}
.synapse-svg[data-scenario="m-agonist"] .m-recept{animation:receptorPulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #c8aaff) brightness(1.3)}
.synapse-svg[data-scenario="n-agonist"] .n-recept{animation:receptorPulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #7ce8c8) brightness(1.3)}
.synapse-svg[data-scenario="m-blocker"] .m-recept{animation:receptorFade 2.5s ease-in-out infinite;filter:drop-shadow(0 0 10px #ff6080) brightness(0.7)}
.synapse-svg[data-scenario="m-blocker"] .m-recept .block-x{display:block}
.synapse-svg[data-scenario="n-blocker"] .n-recept{animation:receptorFade 2.5s ease-in-out infinite;filter:drop-shadow(0 0 10px #ff6080) brightness(0.7)}
.synapse-svg[data-scenario="n-blocker"] .n-recept .block-x{display:block}
.synapse-svg[data-scenario="ache-block"] .ach-float,.synapse-svg[data-scenario="fos"] .ach-float{animation-duration:1.4s;filter:drop-shadow(0 0 10px #ff80a0)}
.synapse-svg[data-scenario="ache-block"] .n-recept,.synapse-svg[data-scenario="fos"] .n-recept{animation:receptorPulse 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #7ce8c8) brightness(1.3)}
.synapse-svg[data-scenario="ache-block"] .m-recept,.synapse-svg[data-scenario="fos"] .m-recept{animation:receptorPulse 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #c8aaff) brightness(1.3)}
.synapse-svg[data-scenario="reactivator"] .ache{filter:drop-shadow(0 0 10px #7fc99a) brightness(1.08);animation:none}
.synapse-svg[data-scenario="botox"] .vesicle-bob{opacity:0.35;filter:grayscale(1);animation-play-state:paused}
.synapse-svg[data-scenario="botox"] .ach-float{opacity:0.15;animation-play-state:paused}
.synapse-svg[data-scenario="botox"] .ach-release-particles{opacity:0!important}
.synapse-svg[data-scenario="botox"] .fusion-vesicle{animation:none!important;opacity:.45}
.synapse-svg[data-scenario="normal"] .ca-channel-anim{animation:none;filter:brightness(.48);transition:filter .25s}
.synapse-svg[data-scenario="normal"].phase-impulse .ca-channel-anim,.synapse-svg[data-scenario="normal"].phase-fusion .ca-channel-anim{animation:channelGlow 2.5s ease-in-out infinite;filter:brightness(.9) drop-shadow(0 0 5px #b49ae8)}
.classify-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}

/* Smooth loops: animated elements fade/reset before a new cycle instead of snapping. */
.synapse-svg.phase-fusion .fusion-vesicle{animation:vesicleDockSmooth 2.8s cubic-bezier(.22,.61,.36,1) forwards}
.synapse-svg.phase-receptors .ach-molecule .ach-float{animation:achBindLoop 1.8s cubic-bezier(.2,.65,.25,1) infinite}
.synapse-svg.phase-breakdown .breakdown-product.choline{animation:achSplitCholineLoop .9s ease-out infinite}
.synapse-svg.phase-breakdown .breakdown-product.acetate{animation:achSplitAcetateLoop .9s ease-out infinite}
.synapse-svg.phase-recycle .choline-return-particle{animation:cholineReturnLoop 1.5s ease-in-out infinite}
@keyframes vesicleDockSmooth{0%{transform:translateY(0)}100%{transform:translateY(125px)}}
@keyframes achBindLoop{0%{transform:translate(0,0) scale(1);opacity:1;filter:drop-shadow(0 0 4px #7fcfff)}58%{transform:translate(calc(var(--bind-x,0px)),calc(var(--bind-y,0px))) scale(.82);opacity:1;filter:drop-shadow(0 0 7px #7fcfff)}78%,100%{transform:translate(calc(var(--bind-x,0px)),calc(var(--bind-y,0px))) scale(.82);opacity:0;filter:drop-shadow(0 0 0 transparent)}}
@keyframes achSplitCholineLoop{0%,30%{transform:translate(0,0) scale(.35);opacity:0}52%{transform:translate(24px,-18px) scale(.82);opacity:1}76%{transform:translate(82px,-48px) scale(1);opacity:1}100%{transform:translate(82px,-48px) scale(1);opacity:0}}
@keyframes achSplitAcetateLoop{0%,30%{transform:translate(0,0) scale(.35);opacity:0}52%{transform:translate(28px,16px) scale(.82);opacity:1}76%{transform:translate(112px,52px) scale(1);opacity:1}100%{transform:translate(112px,52px) scale(1);opacity:0}}
@keyframes cholineReturnLoop{0%,100%{transform:translate(0,0);opacity:0}10%{opacity:1}38%{transform:translate(56px,-1px);opacity:1}68%{transform:translate(106px,-40px);opacity:1}86%{transform:translate(151px,-61px);opacity:1}96%{transform:translate(151px,-61px);opacity:0}}

/* Переход везикулы между этапами: отскок и опускание, удержание при выбросе, плавный возврат на следующем этапе. */
.synapse-svg.phase-fusion .fusion-vesicle{animation:vesicleBounceDock 2.8s cubic-bezier(.22,.61,.36,1) forwards!important}
.synapse-svg.phase-release .fusion-vesicle{animation:none!important;transform:translateY(125px)!important}
.synapse-svg.phase-receptors .fusion-vesicle{animation:vesicleLift 0.85s cubic-bezier(.22,.61,.36,1) both!important}
@keyframes vesicleBounceDock{
  0%{transform:translateY(0)}
  18%{transform:translateY(-18px)}
  34%{transform:translateY(5px)}
  100%{transform:translateY(125px)}
}
@keyframes vesicleLift{
  0%{transform:translateY(125px)}
  100%{transform:translateY(0)}
}

/* Ещё более спокойный темп расщепления: движение продуктов теперь длится заметно дольше. */
.synapse-svg.phase-breakdown .breakdown-substrate{animation-duration:1.8s}
.synapse-svg.phase-breakdown .breakdown-product.choline{animation-duration:1.8s}
.synapse-svg.phase-breakdown .breakdown-product.acetate{animation-duration:1.8s}
/* Немного замедляем движение, но оставляем мгновенное переключение по кнопке. */
.synapse-svg.phase-synthesis .synthesis-transfer-particle{animation-duration:2.1s}
.synapse-svg.phase-impulse .impulse-dot{animation-duration:1.35s}
.synapse-svg.phase-impulse .ca-ion-flow,.synapse-svg.phase-fusion .ca-ion-flow{animation-duration:2.1s}
.synapse-svg.phase-receptors .na-ion-flow{animation-duration:2.1s}
.synapse-svg.phase-release .ach-release-particle{animation-duration:2.85s}
.synapse-svg.phase-fusion .fusion-vesicle{animation-duration:2.1s}
.synapse-svg.phase-receptors .ach-molecule .ach-float{animation-duration:2.1s}
.synapse-svg.phase-breakdown .breakdown-substrate{animation-duration:1.05s}
.synapse-svg.phase-breakdown .breakdown-product.choline{animation-duration:1.05s}
.synapse-svg.phase-breakdown .breakdown-product.acetate{animation-duration:1.05s}
.synapse-svg.phase-recycle .choline-return-particle{animation-duration:1.8s}

/* Исправление скорости расщепления: более позднее правило раньше возвращало 1.05s. */
.synapse-svg.phase-breakdown .breakdown-substrate{animation-duration:2.52s!important}
.synapse-svg.phase-breakdown .breakdown-product.choline{animation-duration:2.52s!important}
.synapse-svg.phase-breakdown .breakdown-product.acetate{animation-duration:2.52s!important}

/* При расщеплении сохраняем исходную молекулу АХ видимой на месте; продукты появляются и движутся от неё. */
.synapse-svg.phase-breakdown .breakdown-substrate{animation:substratePulse 2.52s ease-in-out infinite!important;opacity:1!important;transform:scale(1)!important}

.topic-open-chevron{font-size:20px;line-height:1;color:var(--text-muted);padding-left:3px}.dashboard-base-topic{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;border:1px solid transparent;transition:background .16s ease,border-color .16s ease,transform .16s ease}.dashboard-base-topic:hover,.dashboard-base-topic:focus-visible{border-color:var(--mint);background:var(--card-2);transform:translateY(-1px);outline:none}.dashboard-base-topic:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 25%,transparent)}

const QUESTIONS=[
{id:'q_001',section:'Холиномиметики',text:'Какой препарат относится к прямым М-холиномиметикам?',options:['Пилокарпин','Неостигмин','Цитизин','Карбоксим'],correct:0,explanation:'Пилокарпин — прямой М-холиномиметик, действует непосредственно на М-холинорецепторы. Неостигмин — непрямой (оиХЭ периферического действия), цитизин — частичный агонист Н-ХР, карбоксим — реактиватор холинэстеразы.',tags:['Прямые холиномиметики','Механизм','Пилокарпин','Сложность 1'],source:'Холиномиметики — материал для студентов'},
{id:'q_002',section:'Холиномиметики',text:'Пациенту с болезнью Альцгеймера назначен Галантамин. К какой группе он относится?',options:['М-холиномиметик','оиХЭ центрального действия','оиХЭ периферического действия','Реактиватор холинэстеразы'],correct:1,explanation:'Галантамин (Нивалин) — обратимый ингибитор холинэстеразы центрального действия. Проникает через ГЭБ, повышает концентрацию ацетилхолина в ЦНС.',tags:['оиХЭ центрального действия','Показания','Галантамин','Сложность 2'],source:'Холиномиметики — материал для студентов'},
{id:'q_003',section:'Холиномиметики',text:'Какой препарат является частичным агонистом Н-ХР и применяется для отказа от курения?',options:['Никотин','Варениклин','Карбахол','Ипидакрин'],correct:1,explanation:'Варениклин — частичный агонист α4β2-никотиновых рецепторов: умеренно активирует их, уменьшая тягу и симптомы отмены, и ослабляет подкрепляющий эффект никотина при курении.',tags:['Н-холиномиметики','Показания','Варениклин','Сложность 2'],source:'Холиномиметики — материал для студентов'},
{id:'q_004',section:'Холиномиметики',text:'Через 30 минут после введения Неостигмина появились брадикардия, слюнотечение и спазм аккомодации. Что произошло?',options:['Аллергическая реакция','Передозировка с развитием мускариновых эффектов','Анафилактический шок','Никотиновые эффекты'],correct:1,explanation:'Неостигмин ингибирует холинэстеразу и усиливает действие ацетилхолина. Избыток АХ может вызвать брадикардию, повышенную секрецию и бронхоспазм; при выраженном ухудшении требуется срочная оценка дыхания.',tags:['оиХЭ периферического действия','Побочки','Неостигмин','Сложность 3'],source:'Холиномиметики — материал для студентов'},
{id:'q_005',section:'Средства при отравлении ФОС',text:'Какой препарат применяется как реактиватор холинэстеразы при отравлении ФОС?',options:['Пилокарпин','Карбоксим','Донепезил','Цитизин'],correct:1,explanation:'Карбоксим — оксимный реактиватор: помогает восстановить активность холинэстеразы, ингибированной ФОС. Методичка подчёркивает, что он применяется в составе комплексной антидотной терапии.',tags:['Реактиваторы холинэстеразы','Антидот','Карбоксим','Сложность 2'],source:'Холиномиметики — материал для студентов'},
{id:'q_006',section:'Холиноблокаторы',text:'Какой механизм действия у атропина?',options:['Блокада М-холинорецепторов','Блокада Н-холинорецепторов','Ингибирование холинэстеразы','Стимуляция М-холинорецепторов'],correct:0,explanation:'Методичка указывает, что атропин блокирует М-рецепторы и уменьшает опасные М-эффекты избытка АХ, особенно бронхорею и бронхоспазм. Он не восстанавливает активность холинэстеразы.',tags:['М-холиноблокаторы','Механизм','Атропин','Сложность 1'],source:'Холиномиметики — материал для студентов'},
{id:'q_007',section:'Холиноблокаторы',text:'Какой эффект атропина особенно важен при отравлении ФОС согласно методичке?',options:['Уменьшение бронхиальной секреции и бронхоспазма','Восстановление активности ацетилхолинэстеразы','Непосредственное устранение Нм-блокады','Ускорение расщепления ацетилхолина'],correct:0,explanation:'Атропин блокирует М-рецепторы и уменьшает опасные М-эффекты избытка ацетилхолина, прежде всего бронхорею и бронхоспазм. Он не реактивирует фермент и не устраняет непосредственно Нм-блокаду.',tags:['Холиноблокаторы','Атропин','Отравление ФОС','Сложность 2'],source:'Холиномиметики — материал для студентов'},
{id:'q_008',section:'Средства при отравлении ФОС',text:'Какой препарат помогает восстановить активность холинэстеразы, ингибированной ФОС?',options:['Атропин','Пилокарпин','Карбоксим','Неостигмин'],correct:2,explanation:'Карбоксим — оксимный реактиватор холинэстеразы. Атропин уменьшает М-эффекты избытка АХ, но не восстанавливает активность фермента.',tags:['Средства при отравлении ФОС','Атропин и реактиваторы','Классификация','Сложность 2'],source:'Холиномиметики — материал для студентов'},
{id:'q_009',section:'Холиноблокаторы',text:'По какому клиническому эффекту методичка рекомендует прежде всего оценивать достаточность действия атропина при отравлении ФОС?',options:['По уменьшению бронхиальной секреции и улучшению дыхания','Только по расширению зрачков','По появлению мышечных фасцикуляций','По усилению кишечной моторики'],correct:0,explanation:'Методичка подчёркивает, что эффект атропина оценивают прежде всего по уменьшению бронхиальной секреции и улучшению дыхания, а не только по расширению зрачков.',tags:['Холиноблокаторы','Атропин','Отравление ФОС','Сложность 2'],source:'Холиномиметики — материал для студентов'},
{id:'q_010',section:'Холиноблокаторы',text:'Какое утверждение об атропине при отравлении ФОС соответствует методичке?',options:['Атропин одновременно восстанавливает фермент и устраняет все никотиновые эффекты','Атропин блокирует М-рецепторы, но не восстанавливает холинэстеразу','Атропин усиливает накопление ацетилхолина за счёт ингибирования фермента','Атропин заменяет поддержку дыхания и вентиляцию'],correct:1,explanation:'Атропин блокирует М-рецепторы, но не реактивирует ацетилхолинэстеразу. Методичка подчёркивает, что медикаментозная терапия не заменяет обеспечение дыхательных путей и вентиляцию при необходимости.',tags:['Холиноблокаторы','Атропин','Механизм','Сложность 3'],source:'Холиномиметики — материал для студентов'},
{id:'q_011',section:'Миорелаксанты',text:'Какой препарат относится к деполяризующим миорелаксантам?',options:['Пипекурония бромид','Рокурония бромид','Суксаметония йодид','Атракурия безилат'],correct:2,explanation:'Суксаметоний — деполяризующий миорелаксант и агонист Нм-рецепторов: первоначальная деполяризация вызывает фасцикуляции, затем стойкая деполяризация блокирует появление новых мышечных импульсов и приводит к вялому параличу. По методичке применяется для быстрого кратковременного расслабления при интубации и коротких процедурах под анестезией. Риски включают апноэ, гиперкалиемию/аритмии, брадикардию, мышечную боль и злокачественную гипертермию; при сниженной активности плазменной холинэстеразы блок может удлиняться.',tags:['Миорелаксанты','Механизм','Суксаметоний','Сложность 2'],source:'Холиноблокирующие средства и миорелаксанты — предоставленная методичка'},
{id:'q_012',section:'Миорелаксанты',text:'Каким препаратом устранить действие недеполяризующего миорелаксанта после операции?',options:['Атропин','Неостигмин','Суксаметоний','Карбоксим'],correct:1,explanation:'Неостигмин ингибирует ацетилхолинэстеразу и повышает количество ацетилхолина, который конкурирует с недеполяризующим блокатором за Нм-рецепторы. По методичке его применяют вместе с М-холиноблокатором, чтобы уменьшить брадикардию и секрецию. Неостигмин требует достаточного спонтанного восстановления и не устраняет надёжно любой глубокий блок; при блоке I фазы суксаметония он может ухудшить состояние.',tags:['Миорелаксанты','Восстановление передачи','Неостигмин','Сложность 3'],source:'Холиноблокирующие средства и миорелаксанты — предоставленная методичка'},
{id:'q_013',section:'Миорелаксанты',text:'Какой эффект оказывает ботулинический токсин типа А?',options:['Блокирует Н-холинорецепторы','Нарушает высвобождение ацетилхолина','Ингибирует холинэстеразу','Блокирует М-холинорецепторы'],correct:1,explanation:'Ботулинический токсин типа А действует в пресинаптическом окончании и расщепляет SNAP-25 — белок, необходимый для слияния везикул с мембраной. В результате уменьшается высвобождение ацетилхолина и локальная мышечная активность; эффект нарастает постепенно и сохраняется недели–месяцы. Показания и риски зависят от препарата и места инъекции.',tags:['Средства, нарушающие высвобождение АХ','Механизм','Ботулинический токсин типа А','Сложность 2'],source:'Холиноблокирующие средства и миорелаксанты — предоставленная методичка'},
{id:'q_014',section:'Миорелаксанты',text:'Какой из перечисленных препаратов в методичке отнесён к миорелаксантам центрального действия?',options:['Суксаметоний','Пипекурония бромид','Толперизон','Дантролен'],correct:2,explanation:'В классификации предоставленной методички толперизон указан среди миорелаксантов центрального действия.',tags:['Миорелаксанты центрального действия','Классификация','Толперизон','Сложность 2'],source:'Холиноблокирующие средства и миорелаксанты — предоставленная методичка'},
{id:'q_015',section:'Миорелаксанты',text:'Какой препарат указан в методичке для экстренного специфического лечения злокачественной гипертермии?',options:['Атропин','Неостигмин','Дантролен','Пропранолол'],correct:2,explanation:'Методичка указывает внутривенный дантролен для экстренного специфического лечения злокачественной гипертермии. Он уменьшает выход Ca²⁺ через RyR1 из саркоплазматического ретикулума скелетной мышцы.',tags:['Миорелаксанты','Показания','Дантролен','Сложность 3'],source:'Холиноблокирующие средства и миорелаксанты — предоставленная методичка'},
{id:'q_016',section:'Адреномиметики',text:'Какой рецепторный профиль у эпинефрина (адреналина)?',options:['Только α1','Только β1','α1, α2, β1, β2','Только β2'],correct:2,explanation:'Эпинефрин — неселективный α-,β-адреномиметик. Действует на все типы адренорецепторов. Препарат выбора при анафилактическом шоке.',tags:['Неселективные α-,β-АМ','Механизм','Эпинефрин','Сложность 1'],source:'Харкевич Д.А., «Фармакология» — не сверено с предоставленной методичкой'},
{id:'q_017',section:'Адреномиметики',text:'Чем отличается норэпинефрин от эпинефрина по действию на рецепторы?',options:['Действует только на β2','Действует на α1, α2, β1, но не на β2','Действует только на α1','Действует только на β1'],correct:1,explanation:'Норэпинефрин действует на α1, α2 и β1, но не на β2. Сильнее сужает сосуды, но не расширяет бронхи.',tags:['Неселективные α-,β-АМ','Механизм','Норэпинефрин','Сложность 2'],source:'Харкевич Д.А., «Фармакология» — не сверено с предоставленной методичкой'},
{id:'q_018',section:'Адреномиметики',text:'Пациенту с кардиогенным шоком назначен допамин в низких дозах. Какой эффект ожидается?',options:['Сужение сосудов почек','Расширение почечных сосудов и усиление диуреза','Бронхоспазм','Брадикардия'],correct:1,explanation:'В низких дозах допамин действует на D1-рецепторы почек → расширение почечных сосудов, усиление диуреза.',tags:['Дофаминергические средства','Показания','Допамин','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации — не сверено с предоставленной методичкой'},
{id:'q_019',section:'Адреномиметики',text:'Какой препарат применяется как топический деконгестант при насморке?',options:['Фенилэфрин системно','Ксилометазолин','Бримонидин','Добутамин'],correct:1,explanation:'Ксилометазолин (Отривин) — α1,2-АМ местного действия. Сужает сосуды слизистой носа, уменьшает отёк. Курс не более 5–7 дней.',tags:['Топические деконгестанты','Показания','Ксилометазолин','Сложность 2'],source:'Харкевич Д.А., «Фармакология» — не сверено с предоставленной методичкой'},
{id:'q_020',section:'Адреномиметики',text:'Какой препарат применяется для лечения открытоугольной глаукомы как α2-адреномиметик?',options:['Тетризолин','Бримонидин','Фенилэфрин','Сальбутамол'],correct:1,explanation:'Бримонидин (Альфаган) — α2-АМ для офтальмологии. Снижает продукцию внутриглазной жидкости и увеличивает отток.',tags:['Офтальмологические α2-АМ','Показания','Бримонидин','Сложность 2'],source:'Харкевич Д.А., «Фармакология» — не сверено с предоставленной методичкой'},
{id:'q_021',section:'Адреномиметики',text:'Механизм действия клонидина (Клофелина)?',options:['Блокада α1-рецепторов','Стимуляция α2-рецепторов ЦНС','Блокада β1-рецепторов','Стимуляция β2-рецепторов'],correct:1,explanation:'Клонидин — α2-АМ центрального действия. Стимулирует α2-рецепторы в продолговатом мозге → брадикардия, снижение АД.',tags:['α2-АМ центрального действия','Механизм','Клонидин','Сложность 2'],source:'Харкевич Д.А., «Фармакология» — не сверено с предоставленной методичкой'},
{id:'q_022',section:'Адреномиметики',text:'Какой препарат является β1-адреномиметиком и применяется при острой сердечной недостаточности?',options:['Сальбутамол','Добутамин','Мирабегрон','Фенотерол'],correct:1,explanation:'Добутамин — селективный β1-АМ. Усиливает сократимость миокарда, увеличивает сердечный выброс. При острой декомпенсации ХСН.',tags:['β1-АМ','Показания','Добутамин','Сложность 2'],source:'Харкевич Д.А., «Фармакология» — не сверено с предоставленной методичкой'},
{id:'q_023',section:'Адреномиметики',text:'Какой β2-адреномиметик короткого действия применяется для купирования приступа бронхиальной астмы?',options:['Салметерол','Формотерол','Сальбутамол','Индакатерол'],correct:2,explanation:'Сальбутамол (Вентолин) — β2-АМ короткого действия (4–6 ч). Для купирования приступа. Салметерол и формотерол — длительного действия.',tags:['β2-АМ короткого действия','Показания','Сальбутамол','Сложность 2'],source:'Харкевич Д.А. + клин. рекомендации по астме — не сверено с предоставленной методичкой'},

{id:'q_025',section:'Адреномиметики',text:'Какой препарат является β3-адреномиметиком и применяется при гиперактивном мочевом пузыре?',options:['Солифенацин','Мирабегрон','Фенилэфрин','Добутамин'],correct:1,explanation:'Мирабегрон (Бетмига) — β3-АМ. Расслабляет детрузор. Не даёт сухости во рту, хорошая альтернатива у пожилых.',tags:['β3-АМ','Показания','Мирабегрон','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации по СНМП — не сверено с предоставленной методичкой'},
{id:'q_026',section:'Адреноблокаторы',text:'Какой препарат является α,β-адреноблокатором?',options:['Метопролол','Карведилол','Доксазозин','Пропранолол'],correct:1,explanation:'Карведилол — единственный α1-,β1-,β2-АБ. Блокирует β1,β2 и α1. Применяется при ХСН, ИБС, АГ.',tags:['α,β-АБ','Механизм','Карведилол','Сложность 2'],source:'Харкевич Д.А., «Фармакология» — не сверено с предоставленной методичкой'},

{id:'q_032',section:'Адреноблокаторы',text:'Какой α1-АБ применяется для неотложной антигипертензивной терапии?',options:['Тамсулозин','Урапидил','Доксазозин','Йохимбин'],correct:1,explanation:'Урапидил (Эбрантил) — α1-АБ с центральным компонентом. Блокирует α1-рецепторы сосудов и стимулирует 5-HT1A-рецепторы ЦНС. В/в при гипертоническом кризе.',tags:['α1-АБ для неотложной терапии','Показания','Урапидил','Сложность 3'],source:'Харкевич Д.А. + клин. рекомендации — не сверено с предоставленной методичкой'},

        {text:'Донепезил',next:'node_end',type:'bad',feedback:'❌ Грубая ошибка. Донепезил — оиХЭ центрального действия. Он усугубит отравление.'}
      ]},
      node_end:{isEnd:true,summary:'Атропин уменьшает М-эффекты избытка ацетилхолина, особенно бронхорею и бронхоспазм; карбоксим помогает восстановить активность холинэстеразы, ингибированной ФОС. Помощь также включает безопасность персонала, прекращение контакта и удаление загрязнения, поддержку дыхания, а при необходимости — вентиляцию и лечение судорог. Атропин не восстанавливает фермент и не устраняет непосредственно Нм-блокаду.',tags:['ФОС','Антидот','Клинический выбор','Сложность 3'],source:'Холиномиметики — материал для студентов (сверены принципы помощи; детали сценария требуют отдельной клинической проверки)'}
    }
  },
  case_mushroom:{id:'case_mushroom',title:'Отравление мухомором',section:'Холиноблокаторы',
    intro:'Семья из 3 человек собрала в лесу грибы и пожарила их. Через 40 минут у всех появились тошнота, рвота, обильное слюнотечение, потливость, диарея, зрачки сужены, ЧСС 45–50, дыхание затруднено, бронхоспазм. Признаки мускаринового отравления.',

        {text:'Ввести неостигмин',next:'node_2',type:'bad',feedback:'❌ Грубая ошибка. Неостигмин — ингибитор холинэстеразы. Он усилит отравление.'},
        {text:'Промыть желудок и наблюдать',next:'node_2',type:'neutral',feedback:'Вы промыли желудок, но состояние ухудшается: нарастает бронхоспазм.'},
        {text:'Ввести адреналин',next:'node_2',type:'bad',feedback:'Адреналин временно поднял ЧСС, но слюнотечение и бронхоспазм нарастают.'}
      ]},

        {text:'Ввести неостигмин для восстановления тонуса',next:'node_end',type:'bad',feedback:'❌ Грубая ошибка. Неостигмин усугубит отравление.'},

      ]},

    }

  case_extubation:{id:'case_extubation',title:'Экстубация после операции',section:'Миорелаксанты',
    intro:'Пациент 45 лет после операции на брюшной полости под общей анестезией с использованием рокурония бромида (недеполяризующий миорелаксант). Операция завершена. Врач пытается экстубировать пациента, но самостоятельное дыхание не восстанавливается, мышечный тонус сохранён.',
    start:'node_1',
    nodes:{
      node_1:{question:'Твои действия?',options:[

        {text:'Ввести суксаметоний',next:'node_2',type:'bad',feedback:'❌ Ошибка. Суксаметоний — деполяризующий миорелаксант. Он усилит блокаду.'},

        {text:'Подождать 30 минут',next:'node_2',type:'neutral',feedback:'Ожидание может затянуться. Нужна активная декураризация.'}

      node_2:{question:'После введения неостигмина+атропина дыхание восстановилось. Что дальше?',options:[

        {text:'Ввести ещё неостигмин',next:'node_end',type:'bad',feedback:'Передозировка неостигмина вызовет мускариновые эффекты и холинергический криз.'},
        {text:'Ввести суксаметоний',next:'node_end',type:'bad',feedback:'Это снова парализует пациента.'},

      ]},
      node_end:{isEnd:true,summary:'Остаточная кураризация → неостигмин + атропин. Неостигмин повышает АХ и вытесняет миорелаксант. Атропин — профилактика брадикардии. Нельзя: суксаметоний.',tags:['Миорелаксанты','Декураризация','Неостигмин','Клинический выбор','Сложность 3'],source:'Не сверено с предоставленной методичкой «Холиномиметики — материал для студентов»; требуется отдельный источник'}
    }
  },
  case_anaphylaxis:{id:'case_anaphylaxis',title:'Анафилактический шок',section:'Адреномиметики',
    intro:'Пациентка 28 лет после укуса осы почувствовала резкую слабость, зуд, крапивницу, отёк лица и шеи, затруднение дыхания. АД 70/40, ЧСС 130, дыхание свистящее. Диагноз: анафилактический шок.',
    start:'node_1',
    nodes:{
      node_1:{question:'Препарат выбора?',options:[
        {text:'Эпинефрин',next:'node_2',type:'good',feedback:'✅ Правильно. Эпинефрин — препарат выбора при анафилаксии. Действует на α1 (снимает отёк, поднимает АД), β1 (поддерживает сердце), β2 (купирует бронхоспазм). В/м в бедро.'},
        {text:'Норэпинефрин',next:'node_2',type:'neutral',feedback:'Норэпинефрин поднимет АД, но не купирует бронхоспазм (нет β2). Неполное лечение.'},
        {text:'Фенилэфрин',next:'node_2',type:'neutral',feedback:'Фенилэфрин (α1) сузит сосуды, но не устранит бронхоспазм.'},
        {text:'Сальбутамол',next:'node_2',type:'neutral',feedback:'Сальбутамол расширит бронхи, но не поднимет АД. Монотерапия недостаточна.'}
      ]},
      node_2:{question:'Пациентка стабильна, но сохраняется крапивница. Что добавите?',options:[
        {text:'Глюкокортикоид (преднизолон) + антигистаминный',next:'node_end',type:'good',feedback:'✅ Правильно. ГКС предотвращают отсроченную фазу, антигистаминные купируют кожные проявления.'},
        {text:'Ещё эпинефрин',next:'node_end',type:'neutral',feedback:'Повторная доза эпинефрина — только если симптомы возвращаются.'},
        {text:'Атропин',next:'node_end',type:'bad',feedback:'Атропин не применяется при анафилаксии.'},
        {text:'Допамин',next:'node_end',type:'bad',feedback:'Допамин — при кардиогенном шоке, не при анафилаксии.'}

    }
  },
  case_timolol:{id:'case_timolol',title:'Тимолол и астма',section:'Адреноблокаторы',
    intro:'Пациент 60 лет с открытоугольной глаукомой обратился к офтальмологу. Ему назначен тимолол в виде глазных капель. Через 3 дня он вызывает скорую: сильный приступ удушья, свистящее дыхание, тяжесть в груди. В анамнезе — бронхиальная астма в ремиссии 5 лет.',
    start:'node_1',
    nodes:{
      node_1:{question:'Что произошло?',options:[
        {text:'Аллергическая реакция на тимолол',next:'node_2',type:'neutral',feedback:'Аллергия возможна, но клиника характерна для бронхоспазма, а не для аллергии.'},
        {text:'Системная абсорбция тимолола → блокада β2-рецепторов бронхов → бронхоспазм',next:'node_2',type:'good',feedback:'✅ Правильно. Тимолол — неселективный β1,β2-АБ. Даже в виде капель всасывается системно. У пациента с астмой β2-блокада вызывает бронхоспазм.'},
        {text:'Передозировка тимолола',next:'node_2',type:'neutral',feedback:'Передозировка маловероятна при стандартных каплях.'},
        {text:'Совпадение с приступом астмы',next:'node_2',type:'neutral',feedback:'Симптомы совпадают по времени с началом применения тимолола — это причинно-следственная связь.'}
      ]},
      node_2:{question:'Что делать?',options:[
        {text:'Отменить тимолол, назначить не-β-блокаторный препарат (латанопрост, дорзоламид)',next:'node_end',type:'good',feedback:'✅ Правильно. Тимолол отменяется. При глаукоме у пациента с астмой используют аналоги простагландинов (латанопрост), ингибиторы карбоангидразы (дорзоламид), α2-агонисты (бримонидин).'},
        {text:'Продолжить тимолол + сальбутамол',next:'node_end',type:'bad',feedback:'Продолжение тимолола будет постоянно провоцировать бронхоспазм.'},
        {text:'Заменить тимолол на пропранолол',next:'node_end',type:'bad',feedback:'Пропранолол — тоже неселективный β-АБ, только усугубит ситуацию.'},

      ]},
      node_end:{isEnd:true,summary:'Тимолол — неселективный β-АБ, даже в глазных каплях даёт системные эффекты. Противопоказан при БА и ХОБЛ. Альтернативы при глаукоме: латанопрост, дорзоламид, бримонидин.',tags:['Неселективные β-АБ','Побочки','Тимолол','Клинический выбор','Сложность 3'],source:'Не сверено с предоставленной методичкой «Холиномиметики — материал для студентов»; требуется отдельный источник'}
    }
  },
  case_oxybutynin:{id:'case_oxybutynin',title:'Задержка мочи на фоне М-холиноблокатора',section:'Холиноблокаторы',
    intro:'Пациент 68 лет начал принимать оксибутинин из-за внезапных позывов и учащённого мочеиспускания. Через несколько дней появились сухость во рту, запор и затруднение опорожнения мочевого пузыря; ощущается переполнение внизу живота.',
    start:'node_1',nodes:{
      node_1:{question:'Какой эффект может объяснить затруднение мочеиспускания?',options:[
        {text:'Блокада М-рецепторов уменьшила сокращение детрузора',next:'node_2',type:'good',feedback:'Верно. М-холиноблокаторы уменьшают непроизвольные сокращения детрузора, но могут вызвать задержку мочи. Сухость во рту и запор также соответствуют их периферическим эффектам.'},
        {text:'Стимуляция М-рецепторов усилила сокращение детрузора',next:'node_2',type:'bad',feedback:'Оксибутинин блокирует М-рецепторы, а не стимулирует их.'},
        {text:'Это ожидаемое улучшение, дозу нужно увеличить',next:'node_2',type:'bad',feedback:'Затруднение опорожнения и чувство переполнения могут указывать на задержку мочи; увеличивать дозу без оценки состояния небезопасно.'}]},
      node_2:{question:'Какой следующий шаг наиболее обоснован?',options:[
        {text:'Оценить задержку мочи и пересмотреть лечение',next:'node_end',type:'good',feedback:'Верно. Задержка мочи — важный риск для этой группы. Оценивают опорожнение мочевого пузыря и суммарное антихолинергическое действие.'},
        {text:'Добавить ещё один М-холиноблокатор',next:'node_end',type:'bad',feedback:'Суммирование антихолинергического действия может усилить задержку мочи и другие нежелательные эффекты.'},
        {text:'Игнорировать симптом, если позывы стали реже',next:'node_end',type:'bad',feedback:'Меньшее число позывов не исключает чрезмерного подавления сокращений детрузора.'}]},
      node_end:{isEnd:true,summary:'Оксибутинин блокирует М-рецепторы и уменьшает непроизвольные сокращения детрузора, но может вызвать сухость во рту, запор и задержку мочи. При таких симптомах оценивают опорожнение мочевого пузыря и пересматривают лечение.',tags:['М-холиноблокаторы','Нежелательные эффекты','Мочевой пузырь','Сложность 2'],source:'«Холиноблокирующие средства и миорелаксанты», раздел «Урологические М-холиноблокаторы», стр. 5–6'}
    }
  },
  case_tiotropium:{id:'case_tiotropium',title:'Поддерживающая терапия при ХОБЛ',section:'Холиноблокаторы',
    intro:'У взрослого пациента с ХОБЛ назначен тиотропий для регулярной ингаляционной терапии. Во время внезапного ухудшения одышки пациент решает использовать дополнительную дозу тиотропия как средство немедленного купирования приступа.',

        {text:'Это короткодействующее средство для немедленного облегчения',next:'node_2',type:'bad',feedback:'В методичке тиотропий отнесён к длительно действующим поддерживающим средствам.'},
        {text:'Ингаляционные М-холиноблокаторы не влияют на тонус бронхов',next:'node_2',type:'bad',feedback:'Блокада М-рецепторов дыхательных путей уменьшает холинергическое сокращение бронхов.'}]},
      node_2:{question:'Какой препарат из этой группы указан как короткодействующий при обострении ХОБЛ?',options:[

        {text:'Тиотропий',next:'node_end',type:'bad',feedback:'Тиотропий предназначен для поддерживающего лечения, а не для купирования острого приступа.'},
        {text:'Солифенацин',next:'node_end',type:'bad',feedback:'Солифенацин относится к урологическим М-холиноблокаторам.'}]},
      node_end:{isEnd:true,summary:'Ипратропий — короткодействующий ингаляционный М-холиноблокатор; тиотропий — длительно действующее поддерживающее средство. При внезапном ухудшении нужен согласованный с лечащим специалистом план действий.',tags:['Ингаляционные М-холиноблокаторы','ХОБЛ','Длительность действия','Сложность 2'],source:'«Холиноблокирующие средства и миорелаксанты», раздел «Ингаляционные М-холиноблокаторы», стр. 6–7'}
    }

    intro:'После введения суксаметония для анестезии ожидаемое кратковременное расслабление мышц затягивается. Самостоятельное дыхание не восстановилось в ожидаемый срок; пациенту продолжают обеспечивать поддержку дыхания и наблюдение.',
    start:'node_1',nodes:{

        {text:'Ввести неостигмин без уточнения типа блока',next:'node_end',type:'good',feedback:'Верно. В методичке указано, что при фазе I блока суксаметония неостигмин может ухудшить состояние. Нужны поддержка дыхания и контроль восстановления специалистами.'},

{icon:'М−',color:'var(--mint)',bg:'var(--mint-soft)',title:'М-холиноблокаторы: эффекты и риски',sub:'Сопоставь орган, желаемый эффект и осложнение',body:`
<h4>Общий механизм</h4>
<p>М-холиноблокаторы обычно конкурентно препятствуют действию ацетилхолина на М-рецепторы и ослабляют парасимпатические влияния. Препараты, проходящие через гематоэнцефалический барьер, могут вызывать центральные эффекты.</p>

<h4>Нормальная нервно-мышечная передача</h4>
<p>Ацетилхолин → Нм-рецептор → деполяризация → мышечный импульс → высвобождение кальция внутри мышцы → сокращение.</p>
<h4>Суксаметоний: деполяризующий блок</h4>
<p>Агонист Нм-рецепторов сначала вызывает деполяризацию и фасцикуляции. Затем сохраняющаяся деполяризация и инактивация натриевых каналов препятствуют новым импульсам, развивается вялый паралич. Он быстро действует и обычно используется для кратковременного расслабления при интубации и коротких процедурах. Низкая активность плазменной холинэстеразы может вызвать длительный блок и апноэ.</p>
<h4>Недеполяризующие средства</h4>
<p>Пипекуроний, рокуроний, атракурий и цисатракурий конкурентно блокируют Нм-рецепторы; начальные фасцикуляции обычно отсутствуют. Между ними различаются скорость начала, длительность и пути выведения. Например, пипекуроний действует длительно и значимо выводится почками; рокуроний имеет быстрое начало и среднюю длительность; атракурий и цисатракурий в значительной степени распадаются путём элиминации Хофмана.</p>
<h4>Важная безопасность</h4>
<p>Хирургические миорелаксанты могут парализовать дыхательные мышцы, но сами по себе не обеспечивают сон, амнезию или обезболивание. Нужны соответствующая анестезия/седация, поддержка дыхания и мониторинг. После недеполяризующего блока неостигмин применяют только при достаточном спонтанном восстановлении. Возвращение дыхательных движений само по себе не гарантирует восстановления глотания и защиты дыхательных путей; методичка описывает количественный мониторинг TOF и ориентир TOF ≥ 0,9 перед экстубацией.</p>
`},
{icon:'Ca²⁺',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Ботулинический токсин и дантролен',sub:'Две разные точки вмешательства',body:`

  {section:'Холиномиметики',icon:'MN',color:'var(--accent)',bg:'var(--accent-soft)',title:'М,Н-холиномиметики',desc:'Действуют на оба типа рецепторов.',drugs:['Карбахол'],details:'Карбахол непосредственно активирует М- и Н-холинорецепторы и устойчив к быстрому расщеплению холинэстеразой. Раствор Мио-Хол применяют для получения миоза при офтальмологических операциях, в частности при хирургии катаракты; введение — внутриглазное. Возможны местные офтальмологические реакции и при системном действии — тошнота, слюнотечение, потливость и брадикардия.'},
  {section:'Холиномиметики',icon:'Ц',color:'var(--warm)',bg:'var(--warm-soft)',title:'оиХЭ центрального действия',desc:'Проникают через ГЭБ.',drugs:['Донепезил','Ривастигмин','Галантамин'],details:'Пероральные формы применяются для симптоматического лечения деменции при болезни Альцгеймера. Ривастигмин также применяется при деменции, связанной с болезнью Паркинсона. Показания галантамина зависят от формы: пероральные формы предназначены для болезни Альцгеймера, а инъекционные по инструкции могут применяться при отдельных заболеваниях периферической нервной системы и нарушениях нервно-мышечной передачи.'},
  {section:'Холиномиметики',icon:'ЦП',color:'var(--accent)',bg:'var(--accent-soft)',title:'оиХЭ центрально-периферического',desc:'ЦНС + периферия.',drugs:['Ипидакрин'],details:'Ипидакрин (Нейромидин): неврология, миастения.'},
  {section:'Холиномиметики',icon:'П',color:'var(--success)',bg:'var(--success-soft)',title:'оиХЭ периферического действия',desc:'Действуют преимущественно на периферии; центральное действие ограничено.',drugs:['Пиридостигмин','Неостигмин'],details:'Применение зависит от препарата и клинической ситуации, в том числе миастения и отдельные случаи атонии. Атропин уменьшает М-холинергические проявления избытка ацетилхолина, но не следует считать его средством, устраняющим все никотиновые эффекты или заменяющим поддержку дыхания при тяжёлом состоянии.'},
  {section:'Средства при отравлении ФОС',icon:'R',color:'var(--error)',bg:'var(--error-soft)',title:'Реактиваторы холинэстеразы',desc:'Восстанавливают фермент, ингибированный ФОС.',drugs:['Карбоксим'],details:'Оксимный реактиватор, который помогает восстановить активность холинэстеразы, ингибированной ФОС. Возможность реактивации уменьшается после «старения» комплекса фермент–ФОС; скорость старения зависит от конкретного соединения. Применяется в составе комплексной антидотной терапии, не заменяет атропин и поддержку дыхания.'},
  {section:'Холиномиметики',icon:'ХА',color:'var(--warm)',bg:'var(--warm-soft)',title:'Холина альфосцерат (центральное действие)',desc:'Источник холина для синтеза АХ. Не прямой агонист.',drugs:['Холина альфосцерат'],details:'Проникает через ГЭБ, расщепляется на холин + глицерофосфат. Холин → синтез АХ; глицерофосфат → фосфатидилхолин мембран нейронов. Показания: ишемические нарушения мозгового кровообращения, восстановительный период после инсульта и ЧМТ, когнитивные нарушения, психоорганический синдром. Побочки: тошнота. Характерный периферический мускариновый синдром НЕ развивается — потому что препарат не является прямым агонистом М-рецепторов.'},
  {section:'Холиноблокаторы',icon:'А',color:'var(--mint)',bg:'var(--mint-soft)',title:'Атропин — роль при отравлении ФОС',desc:'Блокирует М-холинорецепторы и уменьшает опасные М-эффекты избытка АХ.',drugs:['Атропин'],details:'Механизм: неселективная блокада М-рецепторов; препарат проникает через гематоэнцефалический барьер. Эффекты: увеличение ЧСС за счёт ослабления вагусного влияния на сердце, уменьшение секреции желёз и тонуса ряда гладких мышц; в глазу — мидриаз и длительная циклоплегия. По методичке показания инъекционной формы включают симптомную брадикардию, холинергическое отравление и отдельные задачи анестезиологии; глазной формы — определение рефракции, осмотр глазного дна и передний увеит в составе комплексного лечения. Нежелательные эффекты: сухость во рту, тахикардия, запор, задержка мочи, нечёткость зрения вблизи, светобоязнь; уменьшение потоотделения может вызвать гипертермию, при высоком воздействии возможны возбуждение, делирий и галлюцинации. Важные ограничения: закрытоугольная глаукома, тахиаритмии, ИБС/тяжёлая сердечная недостаточность, миастения и обструктивные заболевания ЖКТ; полный перечень зависит от инструкции. При отравлении ФОС атропин уменьшает бронхорею, бронхоспазм и брадикардию, но не реактивирует фермент и не устраняет непосредственно Нм-паралич. Оценивать эффект нужно прежде всего по уменьшению бронхиальной секреции и улучшению дыхания, а не только по зрачкам; препарат не заменяет поддержку дыхательных путей и вентиляцию.'},

{section:'Холиноблокаторы',icon:'П',color:'var(--warm)',bg:'var(--warm-soft)',title:'Платифиллин',desc:'Неселективный М-холиноблокатор с дополнительным спазмолитическим действием.',drugs:['Платифиллин'],details:'По методичке уменьшает спастический компонент боли при кишечной, желчной и почечной колике, а также при пилороспазме. Типичные риски М-холиноблокаторов сохраняются.'},
