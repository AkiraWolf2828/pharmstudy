  {section:'Холиномиметики',icon:'M',color:'var(--mint)',bg:'var(--mint-soft)',title:'Прямые М-холиномиметики',desc:'Действуют на М-холинорецепторы.',drugs:['Пилокарпин'],details:"Пилокарпин непосредственно активирует М-холинорецепторы. В глазу сокращает сфинктер радужки и цилиарную мышцу: вызывает миоз, облегчает отток водянистой влаги через трабекулярную систему и снижает внутриглазное давление. По методичке применяется при определённых формах глаукомы, в том числе в составе лечения острого приступа первичной закрытоугольной глаукомы, и для сужения зрачка после мидриатиков. Глаукома не сводится только к повышенному внутриглазному давлению. Возможны боль в глазу или надбровной области, жжение, затуманивание зрения, спазм аккомодации, ухудшение зрения в темноте; редко — отслойка сетчатки. При системном всасывании возможны потливость, слюнотечение, брадикардия и бронхоспазм. Противопоказания по методичке: гиперчувствительность, ирит, циклит, иридоциклит и другие состояния, при которых миоз нежелателен; осторожность необходима при высокой миопии и отслойке сетчатки в анамнезе."},
  {section:'Холиномиметики',icon:'N',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Н-холиномиметики',desc:'Агонисты никотиновых рецепторов.',drugs:['Никотин','Цитизин','Варениклин'],details:"Никотин активирует нейрональные Н-холинорецепторы, в том числе в системе подкрепления головного мозга; его эффекты зависят от дозы и длительности воздействия. Никотинзаместительная терапия обеспечивает контролируемое поступление никотина без продуктов горения табака и уменьшает тягу и симптомы отмены. Пластырь обеспечивает более равномерное поступление; жевательная резинка и спрей используются для более быстрого контроля тяги. Цитизин и варениклин — частичные агонисты α4β2-никотиновых рецепторов: помогают уменьшить симптомы отмены и ослабляют подкрепляющий эффект никотина при курении. Нежелательные реакции и ограничения зависят от конкретного препарата и лекарственной формы; в методичке отдельно рассматриваются тошнота, головная боль, головокружение, сердцебиение и местное раздражение."},
  {section:'Холиномиметики',icon:'MN',color:'var(--accent)',bg:'var(--accent-soft)',title:'М,Н-холиномиметики',desc:'Действуют на оба типа рецепторов.',drugs:['Карбахол'],details:"Карбахол непосредственно активирует М- и Н-холинорецепторы и устойчивее ацетилхолина к быстрому расщеплению холинэстеразой. В методичке описан офтальмологический раствор для получения миоза во время операций, в том числе при хирургии катаракты; путь введения — внутриглазной. Не следует переносить на карбахол показания других холиномиметиков. Возможны воспалительные реакции глаза, отёк роговицы и ухудшение зрения; редко — тяжёлые офтальмологические осложнения. При системном действии возможны тошнота, слюнотечение, потливость и брадикардия. Противопоказания для рассмотренной формы: гиперчувствительность и возраст до 18 лет; осторожность необходима при бронхиальной астме, сердечной недостаточности, язвенной болезни и обструкции мочевых путей."},
  {section:'Холиномиметики',icon:'Ц',color:'var(--warm)',bg:'var(--warm-soft)',title:'оиХЭ центрального действия',desc:'Проникают через ГЭБ.',drugs:['Донепезил','Ривастигмин','Галантамин'],details:"Донепезил, ривастигмин и галантамин — обратимые ингибиторы холинэстеразы с клинически значимым центральным действием; усиление холинергической передачи используется для симптоматического лечения деменции при болезни Альцгеймера. Ривастигмин также применяется при деменции, связанной с болезнью Паркинсона. Показания галантамина зависят от формы: пероральные формы предназначены для болезни Альцгеймера, а инъекционные формы по рассмотренной инструкции могут применяться при отдельных заболеваниях периферической нервной системы и нарушениях нервно-мышечной передачи. Донепезил преимущественно подавляет ацетилхолинэстеразу. Возможны тошнота, рвота, диарея, снижение аппетита, бессонница, головокружение, болезненные мышечные спазмы, брадикардия, нарушения проводимости и обмороки; в методичке указаны гиперчувствительность, возраст до 18 лет, осторожность при беременности и отказ от грудного вскармливания. Ривастигмин подавляет ацетилхолинэстеразу и бутирилхолинэстеразу; возможны тошнота, рвота, диарея, снижение аппетита и массы тела, брадикардия, головокружение, обмороки и усиление тремора; пластырь может вызывать местное раздражение и контактный дерматит. Галантамин обратимо подавляет ацетилхолинэстеразу; возможны тошнота, рвота, диарея, снижение аппетита и массы тела, головокружение, брадикардия и обмороки. Противопоказания галантамина существенно различаются между пероральными и инъекционными формами; для инъекционного Нивалина в методичке отдельно перечислены бронхиальная астма, брадикардия/AV-блокада, стенокардия, эпилепсия и механическая непроходимость кишечника или мочевых путей. Для каждого препарата учитывают конкретную лекарственную форму и её инструкцию."},
  {section:'Холиномиметики',icon:'ЦП',color:'var(--accent)',bg:'var(--accent-soft)',title:'оиХЭ центрально-периферического',desc:'ЦНС + периферия.',drugs:['Ипидакрин'],details:"Ипидакрин действует двумя путями: подавляет холинэстеразу, замедляя разрушение ацетилхолина, и блокирует калиевые каналы, продлевая электрическое возбуждение нервного окончания и способствуя выделению медиатора. В методичке он отнесён к средствам с центральным и периферическим действием. Применение включает отдельные заболевания периферической нервной системы и миастению/миастенические синдромы; улучшение передачи не устраняет причину повреждения нерва. Возможны слюнотечение, потливость, тошнота, диарея, брадикардия и усиление бронхиальной секреции; также описаны головокружение и сонливость. В методичке среди основных противопоказаний названы гиперчувствительность, эпилепсия, гиперкинезы, выраженная брадикардия, стенокардия, бронхиальная астма, механическая непроходимость кишечника или мочевых путей, обострение язвенной болезни, беременность, грудное вскармливание и детский возраст. Для таблеток отдельно указано применение при атонии кишечника."},
  {section:'Холиномиметики',icon:'П',color:'var(--success)',bg:'var(--success-soft)',title:'оиХЭ периферического действия',desc:'Действуют преимущественно на периферии; центральное действие ограничено.',drugs:['Пиридостигмин','Неостигмин'],details:"Пиридостигмин и неостигмин подавляют холинэстеразу и усиливают действие ацетилхолина преимущественно в периферических синапсах, поскольку практически не проходят через гематоэнцефалический барьер. Пиридостигмин применяется при миастении; неостигмин — при миастении, для устранения остаточного действия недеполяризующих миорелаксантов и в отдельных случаях атонии кишечника или мочевого пузыря после исключения механического препятствия. Неостигмин не является универсальным антидотом к суксаметонию и может усилить или продлить деполяризующий блок. При отравлении ФОС он не подходит, поскольку холинэстераза уже ингибирована. Пиридостигмин применяется для симптоматической терапии миастении; возможны тошнота, спазмы в животе, диарея, слюнотечение, потливость, брадикардия, бронхоспазм, усиление бронхиальной секреции и мышечные подёргивания; при передозировке слабость может нарастать. Неостигмин также применяется для устранения остаточного действия недеполяризующих миорелаксантов и в отдельных случаях послеоперационной атонии кишечника или задержки мочи. Для него описаны слюнотечение, потливость, тошнота, диарея, брадикардия, бронхоспазм, усиление бронхиальной секреции, мышечные подёргивания и слабость при передозировке. Для обоих препаратов в методичке перечислены противопоказания и ограничения, включая гиперчувствительность, бронхиальную астму, механическую непроходимость кишечника; для неостигмина также эпилепсию, брадикардию/аритмии, ИБС, язвенную болезнь, перитонит, обструкцию мочевых путей, беременность и грудное вскармливание. Перечни противопоказаний пиридостигмина и неостигмина различаются; при миастении отдельно учитывают клинические рекомендации и индивидуальную ситуацию."},
  {section:'Средства при отравлении ФОС',icon:'R',color:'var(--error)',bg:'var(--error-soft)',title:'Реактиваторы холинэстеразы',desc:'Восстанавливают фермент, ингибированный ФОС.',drugs:['Карбоксим'],details:"Карбоксим — оксимный реактиватор холинэстеразы, ингибированной фосфорорганическими соединениями. Он помогает восстановить активность фермента; после «старения» комплекса фермент–ФОС возможность реактивации уменьшается, а скорость старения зависит от конкретного соединения. Применяется при отравлении ФОС в составе комплексной антидотной терапии. Атропин уменьшает опасные М-холинергические проявления, но не восстанавливает фермент и не устраняет непосредственно Нм-паралич. Реактиватор не заменяет прекращение контакта с токсикантом, поддержку дыхания и другие необходимые меры. При больших дозах описаны мышечная слабость, головокружение, головная боль, тошнота, тахикардия, преходящие парестезии и изменения внутрисердечной проводимости."},
  {section:'Холиномиметики',icon:'ХА',color:'var(--warm)',bg:'var(--warm-soft)',title:'Холина альфосцерат (центральное действие)',desc:'Источник холина для синтеза АХ. Не прямой агонист.',drugs:['Холина альфосцерат'],details:"Холина альфосцерат не является прямым агонистом М- или Н-холинорецепторов. Он проникает через гематоэнцефалический барьер и расщепляется на холин и глицерофосфат. Холин используется для синтеза ацетилхолина; глицерофосфат — для синтеза фосфатидилхолина мембран нейронов. В методичке среди показаний перечислены ишемические нарушения мозгового кровообращения в остром и восстановительном периодах, восстановительный период геморрагического инсульта, когнитивные нарушения при цереброваскулярной недостаточности, психоорганический синдром и мультиинфарктная деменция; показание при острой ЧМТ зависит от конкретного зарегистрированного препарата. Характерная нежелательная реакция — тошнота; также описаны боль в животе, кратковременная спутанность сознания и аллергические реакции. Классический выраженный периферический мускариновый синдром для него нехарактерен."},
  {section:'Холиноблокаторы',icon:'А',color:'var(--mint)',bg:'var(--mint-soft)',title:'Атропин',desc:'Неселективный М-холиноблокатор системного действия.',drugs:['Атропин'],details:"Атропин неселективно блокирует М-холинорецепторы и проникает в ЦНС. Он ослабляет вагусное влияние на сердце, уменьшает секрецию желёз и тонус ряда гладких мышц; в глазу вызывает мидриаз и длительную циклоплегию. По методичке инъекционная форма применяется при симптомной брадикардии, холинергическом отравлении и в отдельных задачах анестезиологии; глазная — для определения рефракции, осмотра глазного дна и при переднем увеите в составе комплексного лечения. Нежелательные эффекты: сухость во рту, тахикардия, запор, задержка мочи, нарушение зрения вблизи, светобоязнь; уменьшение потоотделения может вызвать гипертермию, при высоком воздействии возможны возбуждение, делирий и галлюцинации. В методичке среди важных ограничений названы закрытоугольная глаукома, тахиаритмии, тяжёлая сердечная недостаточность, ИБС, миастения и обструктивные заболевания ЖКТ; точный перечень зависит от инструкции. При отравлении ФОС атропин уменьшает бронхорею, бронхоспазм и брадикардию, но не реактивирует фермент и не устраняет непосредственно Нм-паралич. Эффект оценивают прежде всего по уменьшению бронхиальной секреции и улучшению дыхания, а не только по зрачкам."},

{section:'Холиноблокаторы',icon:'П',color:'var(--warm)',bg:'var(--warm-soft)',title:'Платифиллин',desc:'Неселективный М-холиноблокатор с дополнительным спазмолитическим действием.',drugs:['Платифиллин'],details:"Платифиллин относится к неселективным М-холиноблокаторам системного действия. В методичке описаны спазмолитическое действие и применение для уменьшения спастического компонента боли при кишечной, желчной и почечной колике, а также при пилороспазме. Нежелательные эффекты: сухость во рту, тахикардия, снижение АД, запор, задержка мочи, мидриаз и нарушение аккомодации; при избыточном воздействии возможны центральные реакции. Требуется осторожность при глаукоме, тахиаритмиях, нарушениях функции печени/почек, кишечной непроходимости и склонности к задержке мочи. Уменьшение боли не исключает хирургическое заболевание."},
{section:'Холиноблокаторы',icon:'Б',color:'var(--accent)',bg:'var(--accent-soft)',title:'Экстракт листьев белладонны',desc:'М-холиноблокатор местного действия.',drugs:['Экстракт листьев белладонны'],details:"Экстракт содержит комплекс алкалоидов с М-холиноблокирующим действием: уменьшает тонус гладких мышц и секрецию. По методичке рассмотренные ректальные формы применяются симптоматически при геморрое и анальных трещинах; они не устраняют причину хронической трещины, кровотечение или тромбоз узла. Возможны сухость во рту, жажда, тахикардия, запор, нарушение зрения и задержка мочи; при выраженном системном действии — перегрев и центральные антихолинергические реакции. Для рассмотренных суппозиториев в методичке перечислены ограничения, включая закрытоугольную глаукому, тахикардию, декомпенсированную сердечную недостаточность, миастению, обструктивные заболевания ЖКТ, нарушение оттока мочи, беременность, лактацию и возраст до 18 лет."},
{section:'Холиноблокаторы',icon:'У',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Урологические М-холиноблокаторы',desc:'Уменьшают непроизвольные сокращения детрузора.',drugs:['Солифенацин','Оксибутинин','Троспия хлорид'],details:"Солифенацин, оксибутинин и троспия хлорид блокируют М-рецепторы и уменьшают непроизвольные сокращения детрузора при накоплении мочи. Показание — гиперактивность детрузора с ургентными позывами, учащённым мочеиспусканием и ургентным недержанием; перед лечением исключают инфекцию и другие причины. Изолированное стрессовое недержание при кашле или нагрузке имеет иной механизм. Общие нежелательные эффекты: сухость во рту, запор, нарушение зрения и задержка мочи. Солифенацин обладает относительной М3-селективностью; учитывают риск удлинения QT, тяжёлые нарушения моторики/проходимости ЖКТ, гемодиализ, тяжёлую печёночную недостаточность и сочетание тяжёлой почечной или умеренной печёночной недостаточности с сильным ингибитором CYP3A4. Оксибутинин дополнительно непосредственно расслабляет гладкую мышцу и проходит в ЦНС, поэтому возможны сонливость, спутанность и галлюцинации; в методичке для Дриптана указаны идиопатическая и нейрогенная гиперактивность детрузора, применение с 5 лет и отдельные ограничения: обструкция ЖКТ/мочевых путей, тяжёлый язвенный колит/токсический мегаколон, гипертермия, лактация и возраст до 5 лет. Троспия хлорид имеет четвертичную структуру, ограниченно проходит в мозг и выводится почками; при нарушении координации детрузора и сфинктера его применение рассматривается в программе с катетеризацией. Дополнительные ограничения включают тахиаритмии, замедленное опорожнение желудка, диализ, наследственные нарушения усвоения лактозы и возраст до 12 лет. Ограничения проверяют по инструкции конкретной формы."},
{section:'Холиноблокаторы',icon:'И',color:'var(--accent)',bg:'var(--accent-soft)',title:'Ингаляционные М-холиноблокаторы',desc:'Блокируют М-рецепторы дыхательных путей.',drugs:['Ипратропия бромид','Тиотропия бромид','Гликопиррония бромид'],details:"Блокада М-рецепторов дыхательных путей уменьшает холинергическое сокращение бронхов. Ипратропий — короткодействующее средство: применяется при ХОБЛ, в том числе при обострении, и как дополнение к быстродействующему β2-агонисту при выраженном обострении астмы. Тиотропий и гликопирроний — длительного действия для поддерживающего лечения; они не предназначены для купирования острого приступа. Для тиотропия в методичке различаются формы: капсулы с порошком — поддерживающая терапия ХОБЛ у взрослых; раствор Респимат — ХОБЛ, а также астма с 6 лет как дополнение к ингаляционным глюкокортикостероидам. Гликопирроний в рассмотренной форме — поддерживающее лечение ХОБЛ у взрослых. Возможны сухость во рту, кашель/раздражение глотки, аллергические реакции, задержка мочи и парадоксальный бронхоспазм. Попадание препарата в глаза опасно при узком угле передней камеры. Учитывают закрытоугольную глаукому, нарушение оттока мочи и, для длительных средств, функцию почек; дополнительные ограничения зависят от формы."},
{section:'Холиноблокаторы',icon:'О',color:'var(--warm)',bg:'var(--warm-soft)',title:'Офтальмологические М-холиноблокаторы',desc:'Вызывают мидриаз и циклоплегию.',drugs:['Тропикамид','Циклопентолат'],details:"Блокада М-рецепторов сфинктера радужки вызывает мидриаз, а блокада цилиарной мышцы — циклоплегию. Мидриаз используют для осмотра глазного дна и подготовки к вмешательствам; циклоплегия нужна для определения рефракции без влияния аккомодации, особенно у детей. Капли также применяют при переднем увеите в составе лечения для уменьшения болезненного спазма и профилактики синехий. Тропикамид действует короче; выраженность циклоплегии зависит от концентрации и может быть недостаточной. В рассмотренной инструкции 1% раствор противопоказан до 6 лет, для младших детей указан 0,5%. Циклопентолат обычно вызывает более выраженную и длительную циклоплегию; дополнительно учитывают посттравматический парез сфинктера зрачка и центральные реакции у детей, возрастные ограничения зависят от марки. Возможны жжение, светобоязнь, нечёткость зрения вблизи и повышение внутриглазного давления; учитывают глаукому и предрасположенность к закрытию угла."},
{section:'Холиноблокаторы',icon:'С',color:'var(--success)',bg:'var(--success-soft)',title:'Периферические М-холиноблокаторы со спазмолитическим действием',desc:'Ослабляют холинергическое сокращение гладкой мускулатуры.',drugs:['Гиосцина бутилбромид','Метоциния йодид'],details:"Гиосцина бутилбромид и метоциния йодид уменьшают холинергическое сокращение гладких мышц внутренних органов. Оба препарата — четвертичные соединения и слабо проходят в мозг; их действие не следует путать с расслаблением скелетных мышц. Для гиосцина бутилбромида в методичке указаны спастическая боль ЖКТ, кишечная/желчная/почечная колика, пилороспазм, спазмы желчных путей и болезненная менструация; формы и показания различаются. Для метоциния йодида описаны спастические состояния и уменьшение слюнной/бронхиальной секреции. Возможны сухость во рту, тахикардия, запор и задержка мочи; ограничения зависят от формы, включая миастению, мегаколон, глаукому и обструкцию ЖКТ/мочевых путей."},
{section:'Холиноблокаторы',icon:'Ц',color:'var(--error)',bg:'var(--error-soft)',title:'Центральные М-холиноблокаторы',desc:'Антипаркинсонические средства.',drugs:['Тригексифенидил','Бипериден'],details:"Тригексифенидил и бипериден проникают в ЦНС и уменьшают холинергические влияния в двигательных цепях, включая стриатум. В методичке указано симптоматическое уменьшение тремора и ригидности при подходящих формах паркинсонизма, а также лечение некоторых лекарственных экстрапирамидных нарушений. Бипериден в инъекционной форме может применяться для быстрого устранения острой лекарственной дистонии; сначала также оценивают возможность коррекции причинного препарата. Эти средства не устраняют причину болезни Паркинсона. Возможны периферические эффекты М-блокады — сухость во рту, запор, задержка мочи и нарушение зрения — и центральные реакции: ухудшение памяти, спутанность, возбуждение или галлюцинации. Особенно важна осторожность у пожилых и при когнитивных нарушениях; дополнительные противопоказания и ограничения различаются между тригексифенидилом и бипериденом и зависят от формы."},
{section:'Холиноблокаторы',icon:'Г',color:'var(--mint)',bg:'var(--mint-soft)',title:'Ганглиоблокаторы',desc:'Блокируют Нн-рецепторы вегетативных ганглиев.',drugs:['Азаметония бромид'],details:"Азаметония бромид блокирует Нн-холинорецепторы в вегетативных ганглиях и нарушает передачу как симпатических, так и парасимпатических импульсов. Поэтому эффекты зависят от преобладающего в органе исходного вегетативного тонуса. Возможны выраженная ортостатическая гипотензия, тахикардия, сухость во рту, запор и задержка мочи. В предоставленных материалах есть классификационная позиция и общий механизм класса; подробный современный перечень показаний для конкретной формы не дополняю."},
  {section:'Миорелаксанты',icon:'Д',color:'var(--warm)',bg:'var(--warm-soft)',title:'Деполяризующие миорелаксанты',desc:'Стойкая деполяризация → блокада нервно-мышечной передачи.',drugs:['Суксаметония йодид','Суксаметония хлорид'],details:"Суксаметония йодид/хлорид активирует Нм-холинорецепторы нервно-мышечного синапса и вызывает стойкую деполяризацию, после которой нормальная передача возбуждения нарушается. В методичке отдельно подчёркнута роль плазменной бутирилхолинэстеразы: при её сниженной активности блок может удлиняться. Риски включают апноэ, гиперкалиемию и аритмии, брадикардию, послеоперационную мышечную боль, аллергию и злокачественную гипертермию. Неостигмин нельзя считать универсальным антидотом к обычному деполяризующему блоку."},
  {section:'Миорелаксанты',icon:'Н',color:'var(--accent)',bg:'var(--accent-soft)',title:'Недеполяризующие миорелаксанты',desc:'Блокируют Нм-рецепторы и прекращают нервно-мышечную передачу.',drugs:['Пипекурония бромид','Рокурония бромид','Атракурия безилат','Цисатракурия безилат'],details:"Пипекурония бромид, рокурония бромид, атракурия безилат и цисатракурия безилат блокируют Нм-холинорецепторы скелетной мышцы и препятствуют передаче импульса от двигательного нерва. Их применяют для облегчения интубации и расслабления скелетных мышц во время операции или по отдельным показаниям интенсивной терапии. Для устранения блока в методичке рассматривается неостигмин в сочетании с атропином; тактика зависит от препарата и клинической ситуации. Эти средства вызывают нервно-мышечную блокаду и требуют контроля дыхания и готовности к его поддержке."},
  {section:'Миорелаксанты',icon:'Б',color:'var(--error)',bg:'var(--error-soft)',title:'Средства, нарушающие высвобождение АХ',desc:'Нарушают высвобождение ацетилхолина.',drugs:['Ботулинический токсин типа А'],details:"Ботулинический токсин типа А нарушает высвобождение ацетилхолина из нервного окончания и уменьшает передачу сигнала к мышце. Это иной механизм, чем блокада М- или Н-холинорецепторов. В предоставленном материале классификационная позиция указана, но отдельные показания и особенности конкретных препаратов здесь не расширяю."},
  {section:'Миорелаксанты',icon:'Ц',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Миорелаксанты центрального действия',desc:'Снижают тонус через ЦНС.',drugs:['Толперизон','Тизанидин','Баклофен','Циклобензаприн'],details:"Толперизон, тизанидин, баклофен и циклобензаприн уменьшают мышечный спазм через центральные механизмы, но не относятся к блокаторам Нм-холинорецепторов. В методичке: толперизон влияет на натриевые/кальциевые каналы в двигательных рефлекторных путях; тизанидин — агонист центральных α2-рецепторов и уменьшает выделение возбуждающих медиаторов в спинальных цепях; баклофен — агонист ГАМК-B-рецепторов; циклобензаприн действует центрально и структурно связан с трициклическими соединениями. Показания зависят от препарата и формы. Возможны слабость и головокружение; для тизанидина, баклофена и циклобензаприна особенно характерна сонливость. Для тизанидина важны гипотензия, брадикардия, повреждение печени и взаимодействия с ципрофлоксацином или флувоксамином."},
  {section:'Миорелаксанты',icon:'П',color:'var(--success)',bg:'var(--success-soft)',title:'Миорелаксанты прямого действия',desc:'Уменьшает выход Ca²⁺ через RyR1 из саркоплазматического ретикулума скелетной мышцы.',drugs:['Дантролен'],details:"Дантролен действует непосредственно на скелетную мышцу: уменьшает выход кальция через RyR1 из саркоплазматического ретикулума, поэтому сократительные белки получают меньше кальциевого сигнала. М- и Н-рецепторы не являются его мишенью. Внутривенная форма применяется для экстренного специфического лечения злокачественной гипертермии вместе с прекращением действия триггеров и поддерживающими мерами. Возможны мышечная, в том числе дыхательная, слабость и реакции со стороны ЖКТ; при внутривенном введении — флебит и повреждение тканей при экстравазации. Гепатотоксичность особенно важна для длительного перорального лечения и не переносится автоматически на экстренную внутривенную форму."},
  {section:'Адреномиметики',icon:'Э',color:'var(--mint)',bg:'var(--mint-soft)',title:'Адреномиметики с широким профилем действия',desc:'Профили рецепторного действия у препаратов различаются.',drugs:['Эпинефрин','Норэпинефрин','Допамин'],details:'Эпинефрин действует на α- и β-адренорецепторы; норэпинефрин преимущественно на α- и β1-рецепторы с незначительным влиянием на β2; допамин также действует на дофаминовые рецепторы, а его эффекты зависят от дозы.'},
  {section:'Адреномиметики',icon:'α1',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'α1-АМ периферические',desc:'Фенилэфрин — прямой периферический α1-адреномиметик.',drugs:['Фенилэфрин'],details:'Фенилэфрин (мезатон) преимущественно стимулирует α1-адренорецепторы. Повышает АД и вызывает рефлекторную брадикардию; непосредственно на сердце практически не действует. По Харкевичу применяется как прессорное средство, местно при рините, может сочетаться с местными анестетиками; также указан при открытоугольной глаукоме.'},
  {section:'Адреномиметики',icon:'Д',color:'var(--accent)',bg:'var(--accent-soft)',title:'Топические деконгестанты',desc:'Местные α1,2-адреномиметики по кафедральной классификации.',drugs:['Нафазолин','Ксилометазолин','Оксиметазолин'],details:'Нафазолин (нафтизин) — местный α2-адреномиметик; по Харкевичу вызывает более длительное сосудосуживающее действие, чем мезатон, и применяется местно при рините. Ксилометазолин (галазолин) — аналог нафазолина, производное имидазолина; применяется местно при остром рините, может раздражать слизистую. Оксиметазолин включён в эту карточку согласно кафедральной классификации; отдельное описание его свойств в доступном фрагменте Харкевича отсутствует.'},
  {section:'Адреномиметики',icon:'О',color:'var(--warm)',bg:'var(--warm-soft)',title:'Офтальмологические α1,2-АМ',desc:'Местные средства для уменьшения покраснения конъюнктивы.',drugs:['Тетризолин'],details:'Тетризолин (Визин Классический, Визоптик) указан в кафедральной классификации как офтальмологический α1,2-адреномиметик местного действия. Подробные эффекты, показания и нежелательные реакции в доступном фрагменте основного учебника не раскрыты; не дополняю их неподтверждёнными сведениями.'},
  {section:'Адреномиметики',icon:'Г',color:'var(--success)',bg:'var(--success-soft)',title:'Офтальмологические α2-АМ',desc:'Офтальмологическая α2-АМ-позиция кафедральной классификации.',drugs:['Бримонидин'],details:'Бримонидин (Альфаган Р, Биманокс) указан в кафедральной классификации как офтальмологическое противоглаукомное средство группы α2-адреномиметиков. Подробные механизм, показания и нежелательные реакции для бримонидина в доступном фрагменте Харкевича и найденных методичках не раскрыты; не дополняю карточку неподтверждёнными сведениями.'},
  {section:'Адреномиметики',icon:'Ц',color:'var(--error)',bg:'var(--error-soft)',title:'α2-АМ центральные',desc:'Средства центрального действия, снижающие симпатические влияния.',drugs:['Клонидин','Метилдопа'],details:'Клонидин (клофелин) и метилдопа включены в эту позицию кафедральной классификации. Харкевич относит их к средствам, влияющим на центральные механизмы регуляции АД. Метилдопа превращается в α-метилнорадреналин, который стимулирует постсинаптические α2-адренорецепторы ЦНС и подавляет активность нейронов, регулирующих АД; характерны седативное действие и сонливость. Для клонидина в учебнике отмечены сухость во рту, возможный запор и задержка натрия и воды; также описана глазная форма при глаукоме. Механизмы этих препаратов не следует смешивать: метилдопа действует через активный метаболит, клонидин — центральный α2-агонист.'},
  {section:'Адреномиметики',icon:'β1',color:'var(--mint)',bg:'var(--mint-soft)',title:'β1-АМ',desc:'Кардиотоническое действие за счёт стимуляции β1-рецепторов сердца.',drugs:['Добутамин'],details:'Добутамин — более избирательный β1-адреномиметик. Стимуляция β1-рецепторов активирует аденилатциклазу, повышает содержание цАМФ и концентрацию Ca²⁺ в кардиомиоцитах, вследствие чего увеличивается сила сокращений. По Харкевичу применяется для непродолжительной стимуляции сердца при его декомпенсации.'},
  {section:'Адреномиметики',icon:'К',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'β2-АМ короткого действия',desc:'Быстродействующие бронходилататоры; для сальбутамола указано действие 4–6 часов.',drugs:['Сальбутамол','Фенотерол'],details:'Сальбутамол и фенотерол преимущественно стимулируют β2-адренорецепторы, расширяют бронхи и обычно применяются ингаляционно. По Харкевичу они вызывают тахикардию в меньшей степени, чем неизбирательные β-адреномиметики; β2-АМ также способствуют отделению мокроты. Харкевич указывает для сальбутамола действие 4–6 часов. β2-адреномиметики этой группы также упоминаются как средства, способные снижать сократительную активность миометрия.'},
  {section:'Адреномиметики',icon:'Д',color:'var(--accent)',bg:'var(--accent-soft)',title:'β2-АМ длительного действия',desc:'Длительно действующие бронходилататоры.',drugs:['Формотерол','Салметерол'],details:'Формотерол и салметерол относятся к длительно действующим β2-адреномиметикам по кафедральной классификации. Харкевич отдельно указывает, что при ингаляции салметерола бронхорасширяющий эффект сохраняется около 12 часов; также описывает сочетание салметерола с ингаляционным глюкокортикоидом флутиказоном. Длительность 12 часов не переношу автоматически на формотерол.'},
  {section:'Адреномиметики',icon:'У',color:'var(--warm)',bg:'var(--warm-soft)',title:'β2-АМ ультрадлительные',desc:'Подгруппа ультрадлительного действия по кафедральной классификации.',drugs:['Индакатерол','Олодатерол'],details:'Индакатерол и олодатерол включены в кафедральную классификацию как β2-адреномиметики ультрадлительного действия. Подробные механизмы, показания и нежелательные реакции для этих препаратов в доступном фрагменте Харкевича и найденных методичках не раскрыты; не добавляю неподтверждённые детали.'},
  {section:'Адреномиметики',icon:'Т',color:'var(--success)',bg:'var(--success-soft)',title:'β2-АМ токолитики',desc:'Подгруппа β2-адреномиметиков токолитического действия.',drugs:['Гексопреналин'],details:'Гексопреналин (Гинипрал) включён в эту позицию кафедральной классификации. Харкевич указывает, что β2-адреномиметики могут снижать сократительную активность миометрия; отдельное описание гексопреналина в доступном фрагменте учебника не найдено.'},
  {section:'Адреномиметики',icon:'β3',color:'var(--error)',bg:'var(--error-soft)',title:'β3-АМ',desc:'Урологическая подгруппа по кафедральной классификации.',drugs:['Мирабегрон'],details:'Мирабегрон (Бетмига) указан в кафедральной классификации как β3-адреномиметик урологического назначения. Подробное описание механизма и применения в доступном фрагменте Харкевича и найденных методичках не обнаружено; не расширяю карточку неподтверждёнными сведениями.'},
  {section:'Адреномиметики',icon:'С',color:'var(--mint)',bg:'var(--mint-soft)',title:'Симпатомиметики',desc:'Эфедрин — симпатомиметик непрямого действия со слабым прямым компонентом.',drugs:['Эфедрин'],details:'Эфедрин действует пресинаптически: усиливает высвобождение норадреналина из варикозных утолщений адренергических волокон; дополнительно оказывает более слабое прямое стимулирующее влияние на адренорецепторы. По основным эффектам напоминает адреналин, но действует медленнее и дольше; эффективен при приёме внутрь. При повторном введении с небольшими интервалами развивается тахифилаксия из-за уменьшения запасов норадреналина. Харкевич указывает применение преимущественно как бронхолитика, иногда для повышения АД, при насморке, AV-блокаде и нарколепсии; возможны возбуждение ЦНС и лекарственная зависимость.'},
  {section:'Адреноблокаторы',icon:'↗',color:'var(--mint)',bg:'var(--mint-soft)',title:'Как передаётся симпатический сигнал',desc:'Нервная передача, катехоламины и уровни действия препаратов.',drugs:['Норадреналин','Адреналин'],details:'Схема: ЦНС → преганглионарное волокно → симпатический ганглий → постганглионарное волокно → орган. В ганглии ацетилхолин активирует Нн-холинорецепторы. Большинство постганглионарных окончаний выделяет норадреналин, действующий на α- и β-адренорецепторы. Адреналин и норадреналин также поступают в кровь из мозгового вещества надпочечников. Адреноблокаторы уменьшают ответ органа через заблокированный рецептор; периферические симпатолитики уменьшают доступность норадреналина, а центральные средства снижают симпатическую импульсацию.'},
  {section:'Адреноблокаторы',icon:'α₁',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Системные α₁-адреноблокаторы',desc:'Расширяют сосуды и расслабляют гладкие мышцы нижних мочевых путей.',drugs:['Доксазозин','Теразозин'],details:'Блокируют постсинаптические α₁-рецепторы сосудов и нижних мочевых путей. Расслабление артериол уменьшает периферическое сопротивление и АД; увеличение ёмкости вен может уменьшать венозный возврат. Расслабление гладких мышц простаты и шейки мочевого пузыря облегчает отток мочи при ДГПЖ. Применение: артериальная гипертензия и симптомы ДГПЖ. Риски: ортостатическая гипотензия, головокружение, слабость и обморок; возможны сердцебиение, заложенность носа и отёки. Возможен эффект первой дозы; дозу подбирают постепенно.'},
  {section:'Адреноблокаторы',icon:'У',color:'var(--warm)',bg:'var(--warm-soft)',title:'Уроселективные α₁-адреноблокаторы',desc:'Преимущественное действие на нижние мочевые пути при ДГПЖ.',drugs:['Тамсулозин','Алфузозин','Силодозин'],details:'Расслабляют гладкие мышцы простаты, простатической части уретры и шейки мочевого пузыря, уменьшая динамический компонент обструкции. Размер простаты существенно не уменьшают. Тамсулозин преимущественно действует на α₁A- и α₁D-рецепторы; силодозин высокоизбирателен к α₁A; алфузозин обладает функциональной уроселективностью без выраженной избирательности к одному подтипу. Применяют внутрь при симптомах ДГПЖ, не для лечения АГ. Возможны головокружение, ортостатическая гипотензия и обморок; нарушения эякуляции особенно характерны для тамсулозина и силодозина. Перед операцией по поводу катаракты важно сообщить офтальмологу о приёме α₁-блокатора, в том числе в прошлом.'},
  {section:'Адреноблокаторы',icon:'Н',color:'var(--success)',bg:'var(--success-soft)',title:'α₁-адреноблокатор для управляемого снижения АД',desc:'Периферическая α₁-блокада и центральный компонент действия.',drugs:['Урапидил'],details:'Сочетает периферическую α₁-блокаду и центральное действие через стимуляцию 5-HT₁A-серотониновых рецепторов. Расширяет сосуды и уменьшает периферическое сопротивление; центральный компонент ограничивает рефлекторное учащение пульса. Внутривенный раствор применяют при гипертоническом кризе, тяжёлой гипертензии и для управляемого снижения АД во время и после операций; капсулы пролонгированного действия — для плановой терапии тяжёлой АГ в составе комбинированного лечения. Возможны чрезмерное снижение АД, головокружение, головная боль, тошнота и нарушения ритма; внутривенное введение требует контроля АД и состояния пациента.'},
  {section:'Адреноблокаторы',icon:'Н',color:'var(--accent)',bg:'var(--accent-soft)',title:'Неселективный α₁-, α₂-адреноблокатор',desc:'Ницерголин — производное эрголина.',drugs:['Ницерголин'],details:'Относится к неселективным α₁-, α₂-адреноблокаторам; имеет дополнительные влияния на церебральные нейромедиаторные системы. В методичке указана симптоматическая терапия когнитивных нарушений при хронических цереброваскулярных и органических поражениях головного мозга. Возможны снижение АД, головокружение, диспепсия и повышение мочевой кислоты. Учитывают ортостатические реакции, брадикардию, недавний инфаркт и острые кровотечения; осторожность нужна при подагре и гиперурикемии.'},
  {section:'Адреноблокаторы',icon:'Й',color:'var(--mint)',bg:'var(--mint-soft)',title:'Селективный α₂-адреноблокатор',desc:'Ослабляет пресинаптическую отрицательную обратную связь.',drugs:['Йохимбин'],details:'Блокирует преимущественно α₂-рецепторы. В норме пресинаптические α₂-рецепторы тормозят дальнейшее высвобождение норадреналина; йохимбин ослабляет эту обратную связь, поэтому выделение норадреналина и симпатические влияния могут усиливаться. Таблетки применяют при отдельных формах эректильной дисфункции; для снижения АД не используют. Возможны тревога, бессонница, тремор, сердцебиение и колебания АД. Осторожность необходима при АГ, тахиаритмиях и выраженных тревожных расстройствах.'},
  {section:'Адреноблокаторы',icon:'αβ',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'α,β-адреноблокатор',desc:'Блокирует α₁-, β₁- и β₂-рецепторы.',drugs:['Карведилол'],details:'β₁-блокада уменьшает ЧСС, сократимость и выделение ренина; α₁-блокада расширяет сосуды и снижает сопротивление выбросу крови. Таблетки применяют при АГ, стабильной ХСН со сниженной фракцией выброса и в определённых ситуациях после инфаркта при дисфункции левого желудочка. При ХСН важна клиническая стабильность пациента; терапию начинают и повышают постепенно. Возможны брадикардия, AV-блокада, гипотензия, головокружение, ортостатические реакции и бронхоспазм; в начале лечения возможны задержка жидкости и ухудшение симптомов ХСН. Ограничения включают бронхиальную астму, выраженную брадикардию, значимую AV-блокаду без кардиостимулятора, кардиогенный шок и декомпенсацию ХСН, требующую внутривенной инотропной поддержки.'},
  {section:'Адреноблокаторы',icon:'β',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Неселективные β₁,β₂-адреноблокаторы',desc:'Снижают сердечную стимуляцию; β₂-блокада повышает риск бронхоспазма.',drugs:['Пропранолол','Тимолол','Соталол'],details:'Блокируют β₁- и β₂-рецепторы. Пропранолол уменьшает ЧСС, сократимость, скорость AV-проведения и выделение ренина; применяют при АГ, стенокардии, отдельных тахиаритмиях, эссенциальном треморе и для профилактики мигрени. Тимолол блокирует β₁- и β₂-рецепторы; глазные капли уменьшают образование водянистой влаги и применяются при открытоугольной глаукоме и офтальмогипертензии. После системного всасывания возможны брадикардия, AV-блокада, снижение АД и бронхоспазм; глазная форма не исключает системных осложнений. Для тимолола противопоказаниями являются бронхиальная астма, в том числе в анамнезе, и тяжёлая ХОБЛ. Соталол дополнительно блокирует калиевые каналы, удлиняет реполяризацию и обладает свойствами антиаритмиков II и III классов; применяют при отдельных аритмиях, а не для обычного снижения АД. Риски: брадикардия, AV-блокада, гипотензия, бронхоспазм, утомляемость и маскировка симптомов гипогликемии. Для соталола важны удлинение QT и риск тахикардии типа «пируэт»; контролируют ЭКГ/QTc, калий, магний и функцию почек. При феохромоцитоме β-блокатор при необходимости назначают только после адекватной α-блокады.'},
  {section:'Адреноблокаторы',icon:'С',color:'var(--accent)',bg:'var(--accent-soft)',title:'Селективные β₁-адреноблокаторы',desc:'Кардиоселективность снижает, но не устраняет влияние на β₂-рецепторы.',drugs:['Метопролол','Бисопролол','Атенолол','Бетаксолол'],details:'Преимущественно блокируют β₁-рецепторы: уменьшают ЧСС и сократимость, замедляют AV-проведение и снижают выделение ренина. Кардиоселективность уменьшается при повышении дозы или концентрации, поэтому бронхоспазм полностью не исключён. Метопролол метаболизируется с участием CYP2D6; формы сукцината пролонгированного высвобождения и тартрата нельзя автоматически считать одинаковыми по режиму применения. Бисопролол имеет доказанное улучшение прогноза при стабильной ХСН со сниженной фракцией выброса. Атенолол относительно гидрофилен, меньше проникает в ЦНС и выводится преимущественно почками. Бетаксолол выпускается также в глазной форме, применяемой при открытоугольной глаукоме и офтальмогипертензии; как β₁-селективный препарат обычно имеет меньший риск бронхоспазма, чем тимолол, но не исключает его. Общие риски: брадикардия, AV-блокада, гипотензия, слабость, утомляемость, похолодание конечностей; возможны бронхоспазм и маскировка симптомов гипогликемии.'},
  {section:'Адреноблокаторы',icon:'В',color:'var(--warm)',bg:'var(--warm-soft)',title:'β₁-блокатор с NO-зависимой вазодилатацией',desc:'Расширение сосудов без α₁-блокады.',drugs:['Небиволол'],details:'Сочетает β₁-блокаду с NO-зависимым расширением сосудов. Применяется в таблетках прежде всего для лечения АГ; в отдельных инструкциях предусмотрено применение при стабильной ХСН у пожилых пациентов, поэтому показания уточняют для конкретного препарата. Общие риски β-блокаторов сохраняются.'},
  {section:'Адреноблокаторы',icon:'У',color:'var(--success)',bg:'var(--success-soft)',title:'Ультракороткодействующий β₁-адреноблокатор',desc:'Внутривенная инфузия позволяет быстро менять выраженность блокады.',drugs:['Эсмолол'],details:'Быстро расщепляется эстеразами, преимущественно в эритроцитах; период полувыведения около 9 минут, поэтому после прекращения инфузии действие быстро ослабевает. Внутривенно применяют для кратковременного контроля ЧСС при отдельных наджелудочковых тахиаритмиях, а также при тахикардии и гипертензии во время и после операций по показаниям. Нужны контроль ЭКГ и АД и возможность быстро изменить скорость или остановить инфузию. Возможны гипотензия, брадикардия, AV-блокада и угнетение сократимости.'},
  {section:'Адреноблокаторы',icon:'О',color:'var(--error)',bg:'var(--error-soft)',title:'β-адреноблокаторы в офтальмологии',desc:'Уменьшают образование водянистой влаги и снижают внутриглазное давление.',drugs:['Тимолол','Бетаксолол'],details:'Глазные капли применяют при открытоугольной глаукоме и офтальмогипертензии. Тимолол блокирует β₁- и β₂-рецепторы; бетаксолол преимущественно блокирует β₁, поэтому риск бронхоспазма обычно ниже, но не исчезает. Возможны жжение, раздражение и сухость глаза. После системного всасывания возможны брадикардия, AV-блокада, снижение АД и бронхоспазм, особенно при тимололе. Для тимолола важны противопоказания при бронхиальной астме, в том числе в анамнезе, и тяжёлой ХОБЛ; глазная форма не исключает системных осложнений.'},
  {section:'Адреноблокаторы',icon:'Р',color:'var(--error)',bg:'var(--error-soft)',title:'Симпатолитики',desc:'Ослабляют симпатическое влияние: уменьшают запасы норадреналина или снижают центральную симпатическую импульсацию.',drugs:['Раунатин','Метилдопа'],details:'В кафедральной классификации в разделе симпатолитических средств указаны алкалоиды раувольфии (Раунатин) и метилдопа. Их механизмы различаются: раунатин уменьшает запасы норадреналина в нервных окончаниях, а метилдопа снижает центральную симпатическую импульсацию. Подробности приведены отдельно для каждого препарата.'},
  {section:'Средства для анестезии',icon:'А',color:'var(--mint)',bg:'var(--mint-soft)',title:'Ингаляционные летучие галогенсодержащие общие анестетики',desc:'Севофлуран, десфлуран, изофлуран и галотан — в кафедральной классификации.',drugs:['Севофлуран','Десфлуран','Изофлуран','Галотан'],details:'Ингаляционные анестетики поступают из лёгких в кровь путём диффузии. Скорость нарастания концентрации зависит от концентрации во вдыхаемом воздухе, вентиляции, альвеолярной поверхности и растворимости вещества в крови. Выведение происходит преимущественно через лёгкие, главным образом в неизменённом виде. В доступном фрагменте Харкевича подробно рассмотрен галотан и приведены общие закономерности; специфические свойства севофлурана и десфлурана не переношу на всю группу.'},
  {section:'Средства для анестезии',icon:'А',color:'var(--accent)',bg:'var(--accent-soft)',title:'Газообразные общие анестетики',desc:'Динитрогена оксид и ксенон по кафедральной классификации.',drugs:['Динитрогена оксид (Азота закись)','Ксенон'],details:'Харкевич подробно описывает закись азота: она обладает выраженным анальгетическим, но сравнительно слабым наркотическим действием, поэтому обычно сочетается с более активными средствами. После прекращения ингаляции пробуждение быстрое; препарат выделяется лёгкими в неизменённом виде. При длительной ингаляции возможны нарушения кроветворения и нейропатия. Ксенон включён в кафедральную классификацию; отдельное описание его фармакологии в доступном фрагменте учебника не найдено.'},
  {section:'Средства для анестезии',icon:'В',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Средства для вводной анестезии короткого действия',desc:'Пропофол и кетамин — неингаляционные средства по кафедральной классификации.',drugs:['Пропофол','Кетамин'],details:'Кетамин вызывает диссоциативную анестезию: общее обезболивание и лёгкий снотворный эффект с частичной утратой сознания; хирургический наркоз в описании Харкевича не развивается. Сохраняются глоточный, гортанный и кашлевой рефлексы; возможны повышение АД и ЧСС, гиперсаливация, неприятные сновидения, психомоторные реакции и галлюцинации. Применяется для введения в наркоз и кратковременных болезненных манипуляций. Пропофол обеспечивает быструю индукцию наркоза (примерно за 30–40 секунд); после однократного введения эффект продолжается около 3–10 минут в зависимости от дозы. Выход из наркоза быстрый; возможно кратковременное апноэ. Кетамин описан отдельно выше.'},
  {section:'Средства для анестезии',icon:'С',color:'var(--warm)',bg:'var(--warm-soft)',title:'Средства средней продолжительности действия для общей анестезии',desc:'Тиопентал натрия — неингаляционное средство по кафедральной классификации.',drugs:['Тиопентал натрия'],details:'При внутривенном введении тиопентал натрия вызывает наркоз примерно через 1 минуту без стадии возбуждения; продолжительность составляет около 20–30 минут. Кратковременность эффекта связана с перераспределением препарата и накоплением в жировой ткани. Применяется для вводного наркоза и кратковременных оперативных вмешательств. Введение должно быть медленным: быстрое нарастание концентрации может угнетать дыхательный и сосудодвигательный центры и сердце; возможны апноэ и коллапс.'},
  {section:'Средства для анестезии',icon:'Д',color:'var(--success)',bg:'var(--success-soft)',title:'Средства длительного действия для общей анестезии',desc:'Натрия оксибутират по кафедральной классификации.',drugs:['Натрия оксибутират'],details:'Харкевич описывает натрия оксибутират как средство для наркоза, которое может применяться для вводного и базисного наркоза, обезболивания родов, а также для получения успокаивающего и снотворного эффектов. Препарат также упоминается среди средств, способных ослаблять сократительную активность миометрия.'},
  {section:'Средства для анестезии',icon:'П',color:'var(--warm)',bg:'var(--warm-soft)',title:'Бензодиазепины для седации и премедикации',desc:'Мидазолам — средство для седации и премедикации по кафедральной классификации.',drugs:['Мидазолам'],details:'Мидазолам включён в кафедральную классификацию средств для седации и премедикации. Харкевич отсылает к его применению в главе о средствах для наркоза; отдельные сведения о препарате не расширяю сверх подтверждённого материала.'},
  {section:'Средства для анестезии',icon:'С',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Селективные α2-адреномиметики для седации',desc:'Дексмедетомидин — средство для седации по кафедральной классификации.',drugs:['Дексмедетомидин'],details:'Дексмедетомидин включён в кафедральную классификацию средств для седации и премедикации. Подробные фармакологические сведения в доступных фрагментах основного учебника и методички не найдены; неподтверждённые детали не добавляю.'},
  {section:'Средства для анестезии',icon:'П',color:'var(--accent)',bg:'var(--accent-soft)',title:'Средства для поверхностной анестезии',desc:'Препараты, перечисленные в кафедральной классификации для поверхностной анестезии.',drugs:['Бензокаин','Лидокаин','Оксибупрокаин','Проксиметакаин','Тетракаин'],details:'Состав группы и распределение препаратов приведены по кафедральной классификации. В доступных фрагментах основного учебника не удалось подтвердить подробные индивидуальные характеристики всех пяти препаратов, поэтому не добавляю к ним неподтверждённые показания, длительность действия и нежелательные реакции.'},
  {section:'Средства для анестезии',icon:'И',color:'var(--mint)',bg:'var(--mint-soft)',title:'Средства для инфильтрационной анестезии',desc:'Лидокаин, артикаин, прокаин и мепивакаин по кафедральной классификации.',drugs:['Лидокаин','Артикаин','Прокаин','Мепивакаин'],details:'Состав группы сохранён по кафедральной классификации. Лидокаин также имеет отдельную позицию в противоаритмической классификации как средство класса IB; это самостоятельное применение и оно не отменяет его повторения в местной анестезии. Подробные индивидуальные сведения по остальным препаратам без подтверждённого фрагмента методички не добавляю.'},
  {section:'Средства для анестезии',icon:'П',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'Средства для проводниковой анестезии',desc:'Артикаин, мепивакаин, лидокаин, бупивакаин, ропивакаин и левобупивакаин.',drugs:['Артикаин','Мепивакаин','Лидокаин','Бупивакаин','Ропивакаин','Левобупивакаин'],details:'Состав группы и повторные вхождения препаратов сохранены по кафедральной классификации. Лидокаин, артикаин и мепивакаин также входят в другие виды местной анестезии; бупивакаин, ропивакаин и левобупивакаин повторяются в разделе длительной регионарной, спинальной и эпидуральной анестезии. Эти повторы не являются ошибками.'},
  {section:'Средства для анестезии',icon:'Р',color:'var(--success)',bg:'var(--success-soft)',title:'Средства для длительной регионарной, спинальной и эпидуральной анестезии',desc:'Бупивакаин, ропивакаин, лидокаин и левобупивакаин.',drugs:['Бупивакаин','Ропивакаин','Лидокаин','Левобупивакаин'],details:'Состав группы сохранён по кафедральной классификации. Бупивакаин, ропивакаин и левобупивакаин также перечислены среди средств для проводниковой анестезии; лидокаин повторяется в поверхностной, инфильтрационной и проводниковой анестезии. Повторные позиции сохранены намеренно.'},
  {section:'Средства для анестезии',icon:'Z',color:'var(--mint)',bg:'var(--mint-soft)',title:'Небензодиазепиновые снотворные средства (Z-препараты)',desc:'Зопиклон, эсзопиклон, золпидем и залеплон по кафедральной классификации.',drugs:['Зопиклон','Эсзопиклон','Золпидем','Залеплон'],details:'Харкевич описывает золпидем и зопиклон как небензодиазепиновые соединения, связывающиеся с бензодиазепиновыми рецепторами и усиливающие ГАМК-ергическое торможение через ГАМК-А-рецепторный комплекс. Эсзопиклон и залеплон включены в кафедральную классификацию; отдельные сведения о них в доступном фрагменте учебника не подтверждены.'},
  {section:'Средства для анестезии',icon:'Б',color:'var(--warm)',bg:'var(--warm-soft)',title:'Бензодиазепиновые снотворные средства',desc:'Нитразепам — бензодиазепиновое снотворное средство.',drugs:['Нитразепам'],details:'Бензодиазепины усиливают действие ГАМК на ГАМК-А-рецепторном комплексе, увеличивая поступление ионов хлора в нейрон и тормозное влияние. Нитразепам вызывает сон продолжительностью около 6–8 часов; по сравнению с барбитуратами меньше изменяет структуру сна и обладает большей широтой терапевтического действия, однако риск привыкания и зависимости сохраняется.'},
  {section:'Средства для анестезии',icon:'Б',color:'var(--accent)',bg:'var(--accent-soft)',title:'Производные барбитуровой кислоты (снотворные средства)',desc:'Фенобарбитал — барбитурат, включённый в кафедральную классификацию снотворных средств.',drugs:['Фенобарбитал'],details:'Барбитураты усиливают ГАМК-ергическое торможение через ГАМК-А-рецепторный комплекс. Харкевич отмечает для фенобарбитала индукцию микросомальных ферментов печени и возможность кумуляции; при нарушении функции почек действие может пролонгироваться. В кафедральной классификации фенобарбитал приведён в разделе снотворных средств.'},
  {section:'Средства для анестезии',icon:'М',color:'var(--success)',bg:'var(--success-soft)',title:'Средства мелатонинового ряда',desc:'Мелатонин по кафедральной классификации.',drugs:['Мелатонин'],details:'Харкевич упоминает препараты мелатонина для нормализации сна, в частности при нарушении сна, связанном с авиаперелётами на длительные расстояния. Более подробные сведения в доступном фрагменте не раскрыты.'},
  {section:'Средства для анестезии',icon:'H₁',color:'var(--lavender-deco)',bg:'var(--lavender-soft)',title:'H1-гистаминоблокаторы с седативным действием',desc:'Доксиламин по кафедральной классификации.',drugs:['Доксиламин'],details:'Харкевич указывает, что отдельные блокаторы H1-гистаминовых рецепторов обладают снотворными свойствами; в качестве примера в учебнике приведён димедрол. Доксиламин включён в кафедральную классификацию этой группы; не переношу на него без отдельного источника индивидуальные сведения о димедроле.'},,
  {section:'Противоаритмические средства',icon:'IB',color:'var(--accent)',bg:'var(--accent-soft)',title:'Лидокаин — антиаритмическое средство класса IB',desc:'Лидокаин 10% указан в кафедральной классификации среди блокаторов Na⁺-каналов класса IB.',drugs:['Лидокаин 10%'],details:'Лидокаин относится к средствам, блокирующим натриевые каналы (класс IB). Это самостоятельная антиаритмическая позиция в кафедральной классификации; она не заменяет и не отменяет повторное включение лидокаина в поверхностную, инфильтрационную, проводниковую и длительную регионарную анестезию. Подробности о применении лидокаина как местного анестетика в этой карточке не смешиваются с его антиаритмическим действием.'},
];

{section:'Холиномиметики',group:'оиХЭ центрального действия',drugs:['Донепезил','Ривастигмин','Галантамин'],mechanism:'Проникают через ГЭБ и усиливают действие ацетилхолина в ЦНС. При болезни Альцгеймера могут уменьшать выраженность симптомов и поддерживать повседневную активность, но не восстанавливают погибшие нейроны.',sideEffects:['Тошнота, рвота, диарея, снижение аппетита','Брадикардия, нарушения сердечной проводимости, головокружение или обмороки','Бессонница и болезненные мышечные спазмы (донепезил)','Снижение массы тела и возможное усиление тремора (ривастигмин); при пластыре — покраснение, зуд или контактный дерматит']},
{section:'Холиномиметики',group:'оиХЭ центрально-периферического действия',drugs:['Ипидакрин'],mechanism:'Сочетает подавление холинэстеразы и блокаду калиевых каналов, за счёт чего электрическое возбуждение нервного окончания длится дольше и улучшается передача сигнала.',sideEffects:['Слюнотечение, потливость','Тошнота, диарея, брадикардия','Усиление бронхиальной секреции','Возможны головокружение и сонливость']},
{section:'Холиномиметики',group:'оиХЭ периферического действия',drugs:['Пиридостигмин','Неостигмин'],mechanism:'Обратимое ингибирование холинэстеразы на периферии → накопление АХ → усиление холинергической передачи.',sideEffects:['Тошнота, спазмы в животе, диарея','Слюнотечение, потливость, усиление бронхиальной секреции','Брадикардия, бронхоспазм','Мышечные подёргивания и слабость при передозировке']},
{section:'Средства при отравлении ФОС',group:'Реактиваторы холинэстеразы',drugs:['Карбоксим'],mechanism:'Оксимный реактиватор, который помогает восстановить активность холинэстеразы, ингибированной ФОС. Возможность реактивации уменьшается после старения комплекса; скорость старения зависит от конкретного соединения.',sideEffects:['При больших дозах — мышечная слабость, головокружение, головная боль, тошнота и тахикардия','Возможны преходящие парестезии и изменения внутрисердечной проводимости']},
{section:'Холиноблокаторы',group:'М-холиноблокатор, рассматриваемый в методичке',drugs:['Атропин'],mechanism:'Неселективно блокирует М-рецепторы; ослабляет вагусное влияние на сердце, секрецию желёз и тонус ряда гладких мышц. Проникает в ЦНС. В глазу вызывает мидриаз и длительную циклоплегию. При симптомной брадикардии увеличивает ЧСС; при холинергическом отравлении уменьшает бронхорею, бронхоспазм и брадикардию. Не восстанавливает холинэстеразу и не устраняет непосредственно Нм-блокаду.',sideEffects:['Сухость во рту, тахикардия, запор, задержка мочи','Нечёткость зрения вблизи и светобоязнь','Снижение потоотделения с риском гипертермии','При высоком воздействии — возбуждение, делирий, галлюцинации','Особая осторожность/ограничения: закрытоугольная глаукома, тахиаритмии, ИБС/тяжёлая сердечная недостаточность, миастения, обструктивные заболевания ЖКТ; перечень зависит от инструкции']},
{section:'Миорелаксанты',group:'Деполяризующие миорелаксанты',drugs:['Суксаметония йодид','Суксаметония хлорид'],mechanism:'Агонист Нм-рецепторов: сначала вызывает деполяризацию и фасцикуляции, затем сохраняющаяся деполяризация и инактивация натриевых каналов не позволяют возникать новым мышечным импульсам — развивается вялый паралич (типичный блок I фазы). Используется для быстрого кратковременного расслабления при интубации и коротких процедурах под анестезией. Не обеспечивает сон, амнезию или обезболивание: необходимы анестезия/седация, поддержка дыхания и мониторинг.',sideEffects:['Апноэ; при длительном блоке может отсутствовать самостоятельное дыхание','Гиперкалиемия и аритмии','Брадикардия','Послеоперационная мышечная боль','Аллергия','Злокачественная гипертермия','Сниженная активность плазменной холинэстеразы замедляет разрушение препарата и удлиняет блок']},
{section:'Миорелаксанты',group:'Недеполяризующие миорелаксанты',drugs:['Пипекурония бромид','Рокурония бромид','Атракурия безилат','Цисатракурия безилат'],mechanism:'Конкурентно блокируют Нм-рецепторы: ацетилхолин не вызывает достаточной деполяризации концевой пластинки, поэтому сокращение не запускается; начальные фасцикуляции обычно отсутствуют. Применяются для интубации и расслабления мышц при общей анестезии; в интенсивной терапии — для отдельных препаратов. Не обеспечивают сон, амнезию или обезболивание. После блока необходимы поддержка дыхания и мониторинг нервно-мышечного восстановления.',sideEffects:['Паралич дыхательных мышц при действии препарата','Остаточная слабость/остаточный блок после операции','Возможна анафилаксия','Осторожность при миастении и других нарушениях нервно-мышечной передачи, электролитных сдвигах, гипотермии и сочетании с лекарствами, усиливающими блок, например аминогликозидами','Неостигмин применим только при достаточном спонтанном восстановлении; не устраняет надёжно любой глубокий блок']},
{section:'Миорелаксанты',group:'Средства, нарушающие высвобождение ацетилхолина',drugs:['Ботулинический токсин типа А'],mechanism:'Действует в пресинаптическом нервном окончании: расщепляет SNAP-25 — белок, необходимый для слияния пузырьков с мембраной. Высвобождение ацетилхолина уменьшается, поэтому локально снижается мышечная активность; в железах уменьшается секреция. Эффект нарастает постепенно и сохраняется недели–месяцы. Показания зависят от конкретного препарата и места инъекции.',sideEffects:['Боль и избыточная местная слабость','Птоз (опущение века), дисфагия (нарушение глотания)','При распространении действия — общая слабость и дыхательные нарушения','После инъекций в детрузор возможны задержка мочи и инфекции','Общие ограничения: гиперчувствительность и воспаление/инфекция в месте введения; остальные определяет инструкция конкретного препарата']},
{section:'Миорелаксанты',group:'Миорелаксанты центрального действия',drugs:['Толперизон','Тизанидин','Баклофен','Циклобензаприн'],mechanism:'Используются для уменьшения патологической мышечной активности, чтобы облегчить движения, уход и реабилитацию. Спастичность при поражении центрального двигательного пути отличается от болезненного защитного спазма при заболеваниях опорно-двигательного аппарата; препараты действуют на разные мишени и не взаимозаменяемы. Толперизон: механизм изучен не полностью, описано мембраностабилизирующее действие и влияние на Na⁺/Ca²⁺-каналы в двигательных рефлекторных путях. Тизанидин: центральный агонист α2-рецепторов, уменьшает выделение возбуждающих медиаторов в спинальных цепях. Баклофен: агонист ГАМК-B-рецепторов, усиливает тормозные влияния в спинном мозге. Циклобензаприн действует преимущественно на уровне ствола мозга, механизм полностью не выяснен; курс кратковременный при остром болезненном спазме.',sideEffects:['Возможны слабость и головокружение; чрезмерное снижение тонуса может ухудшать опору и ходьбу','Для тизанидина, баклофена и циклобензаприна особенно характерна сонливость; толперизон обычно менее седативен','Тизанидин: гипотензия/брадикардия, сухость во рту, повреждение печени; резкая отмена после длительного лечения может вызвать тахикардию и повышение АД','Баклофен: тошнота, гипотензия, спутанность, угнетение дыхания; при почечной недостаточности возможны накопление и токсические нарушения функций мозга','Циклобензаприн: сухость во рту, запор, аритмии; риск серотонинового синдрома с серотонинергическими средствами','Толперизон: возможны ЖКТ-дискомфорт, снижение давления и аллергические реакции вплоть до анафилаксии; противопоказания зависят от формы']},
{section:'Миорелаксанты',group:'Миорелаксанты прямого миотропного действия',drugs:['Дантролен'],mechanism:'Уменьшает выход Ca²⁺ через RyR1 (рианодиновые рецепторы) из саркоплазматического ретикулума — внутриклеточного хранилища кальция скелетной мышцы. Сократительные белки получают меньше кальциевого сигнала, поэтому уменьшается сокращение и патологический мышечный обмен. М- и Н-рецепторы не являются мишенью. Внутривенная форма — экстренное специфическое лечение злокачественной гипертермии, связанной с неконтролируемым выходом кальция после некоторых анестетиков и суксаметония; одновременно прекращают действие триггеров и проводят поддерживающие мероприятия.',sideEffects:['Мышечная, в том числе дыхательная, слабость','Возможны реакции со стороны ЖКТ','При внутривенном введении — флебит и повреждение тканей при попадании раствора за пределы сосуда','Гепатотоксичность особенно важна при длительном пероральном лечении; не следует автоматически переносить её в противопоказания экстренной внутривенной формы']},
{section:'Адреномиметики',group:'Неселективные α-,β-адреномиметики',drugs:['Эпинефрин','Норэпинефрин','Допамин'],mechanism:'Стимуляция всех адренорецепторов: α1 (вазоконстрикция), β1 (усиление работы сердца), β2 (бронходилатация).',sideEffects:['Тахикардия, аритмии','Повышение АД','Тремор, тревога','Головная боль','Гипергликемия']},

{section:'Адреномиметики',group:'α2-адреномиметики местного действия (деконгестанты)',drugs:['Нафазолин','Ксилометазолин'],mechanism:'Местное сужение сосудов слизистой носа → уменьшение отёка и выделений.',sideEffects:['Сухость слизистой, жжение','Ринит отмены','Тахикардия, повышение АД']},
{section:'Адреномиметики',group:'Офтальмологические α1,2-адреномиметики',drugs:['Тетризолин'],mechanism:'Сужение сосудов конъюнктивы → уменьшение покраснения глаз.',sideEffects:['Жжение, раздражение','Синдром рикошета','Редко — системные эффекты']},
{section:'Адреномиметики',group:'Офтальмологические α2-адреномиметики (противоглаукомные)',drugs:['Бримонидин'],mechanism:'Снижение продукции внутриглазной жидкости и увеличение её оттока.',sideEffects:['Аллергический блефароконъюнктивит','Сухость во рту','Сонливость','Гипотензия']},
{section:'Адреномиметики',group:'α2-адреномиметики центрального действия',drugs:['Клонидин','Метилдопа','Гуанфацин'],mechanism:'Стимуляция α2-рецепторов в ЦНС → снижение симпатического тонуса.',sideEffects:['Сухость во рту','Седация, сонливость','Брадикардия','Рикошетная гипертензия при отмене','Гемолитическая анемия (метилдопа)']},
{section:'Адреномиметики',group:'β1-адреномиметики',drugs:['Добутамин'],mechanism:'Стимуляция β1-рецепторов миокарда → усиление сократимости, повышение сердечного выброса.',sideEffects:['Тахикардия','Аритмии','Повышение АД','Головная боль','Тремор']},
{section:'Адреномиметики',group:'β2-адреномиметики короткого действия',drugs:['Сальбутамол','Фенотерол','Тербуталин'],mechanism:'Стимуляция β2-рецепторов бронхов → бронходилатация. Действие 4–6 ч.',sideEffects:['Тремор','Тахикардия','Головная боль','Гипокалиемия','Мышечные судороги']},
{section:'Адреномиметики',group:'Другие β-адреномиметики, применяемые при бронхоспазме',drugs:['Изадрин (изопреналин)','Орципреналина сульфат'],mechanism:'Стимуляция β1- и β2-адренорецепторов; бронхолитический эффект сопровождается влиянием на сердце.',sideEffects:['Тахикардия','Усиление сердечных сокращений','Возможные аритмии']},
{section:'Адреномиметики',group:'β2-адреномиметики длительного действия',drugs:['Формотерол','Салметерол'],mechanism:'Стимуляция β2-рецепторов бронхов длительного действия (12 ч).',sideEffects:['Тремор, тахикардия','Головная боль','Риск обострений астмы при монотерапии']},
{section:'Адреномиметики',group:'β2-адреномиметики ультрадлительного действия',drugs:['Индакатерол','Олодатерол'],mechanism:'Стимуляция β2-рецепторов бронхов длительностью 24 ч.',sideEffects:['Тремор','Тахикардия','Кашель, фарингит','Головная боль']},
{section:'Адреномиметики',group:'β2-адреномиметики токолитического действия',drugs:['Гексопреналин'],mechanism:'Расслабление миометрия через β2-рецепторы.',sideEffects:['Тахикардия у матери и плода','Тремор','Гипокалиемия','Гипергликемия','Отёк лёгких']},
{section:'Адреномиметики',group:'β3-адреномиметики',drugs:['Мирабегрон'],mechanism:'Стимуляция β3-рецепторов детрузора → расслабление мочевого пузыря.',sideEffects:['Сухость во рту','Запор','Головная боль','Повышение АД','Назофарингит']},
{section:'Адреномиметики',group:'Симпатомиметики',drugs:['Эфедрин'],mechanism:'Смешанный механизм: прямое действие + вытеснение норадреналина из пресинаптических депо.',sideEffects:['Повышение АД, тахикардия','Тремор, бессонница','Тахифилаксия']},
{section:'Адреноблокаторы',group:'α,β-адреноблокаторы',drugs:['Карведилол'],mechanism:'Блокирует α₁-, β₁- и β₂-адренорецепторы. β₁-блокада уменьшает ЧСС, сократимость и выделение ренина; α₁-блокада расширяет сосуды и снижает периферическое сопротивление. Применяется при АГ, стабильной ХСН со сниженной фракцией выброса и в определённых ситуациях после инфаркта при дисфункции левого желудочка.',sideEffects:['Брадикардия, AV-блокада, гипотензия, головокружение','Ортостатические реакции','Бронхоспазм из-за β₂-блокады','В начале лечения возможны задержка жидкости и ухудшение симптомов ХСН']},
{section:'Адреноблокаторы',group:'Неселективный α₁-, α₂-адреноблокатор',drugs:['Ницерголин'],mechanism:'Производное эрголина; преимущественно блокирует α₁-адренорецепторы, в меньшей степени влияет на α₂. Имеет дополнительные влияния на церебральные нейромедиаторные системы. В методичке указана симптоматическая терапия когнитивных нарушений при хронических цереброваскулярных и органических поражениях головного мозга.',sideEffects:['Снижение АД, головокружение, диспепсия','Повышение уровня мочевой кислоты','Учитывают ортостатические реакции, брадикардию, недавний инфаркт и острые кровотечения; осторожность при подагре и гиперурикемии']},
{section:'Адреноблокаторы',group:'α₁-адреноблокаторы системного действия',drugs:['Доксазозин','Теразозин'],mechanism:'Блокируют постсинаптические α₁-рецепторы сосудов и нижних мочевых путей. Расслабление артериол снижает периферическое сопротивление и АД; расслабление гладких мышц простаты и шейки мочевого пузыря уменьшает сопротивление оттоку мочи при ДГПЖ.',sideEffects:['Ортостатическая гипотензия, особенно после первой дозы; головокружение, слабость, обморок','Возможны сердцебиение, заложенность носа и отёки','Риск снижения АД выше при обезвоживании, исходно низком АД и сочетании с другими гипотензивными средствами']},
{section:'Адреноблокаторы',group:'Уроселективные α₁-адреноблокаторы',drugs:['Тамсулозин','Алфузозин','Силодозин'],mechanism:'Расслабляют гладкие мышцы простаты, простатической части уретры и шейки мочевого пузыря, уменьшая динамический компонент обструкции при ДГПЖ. Тамсулозин преимущественно действует на α₁A- и α₁D-рецепторы; силодозин высокоизбирателен к α₁A; алфузозин обладает функциональной уроселективностью. Размер простаты существенно не уменьшают и для лечения АГ не предназначены.',sideEffects:['Головокружение, слабость, ортостатическая гипотензия и обморок','Нарушения эякуляции особенно характерны для тамсулозина и силодозина','Учитывают функцию печени и почек и лекарственные взаимодействия; перед операцией по поводу катаракты сообщают офтальмологу о текущем или прежнем приёме']},
{section:'Адреноблокаторы',group:'α₁-адреноблокатор для управляемого снижения АД',drugs:['Урапидил'],mechanism:'Сочетает периферическую α₁-блокаду и центральное действие через стимуляцию 5-HT₁A-серотониновых рецепторов. Расширяет сосуды и уменьшает периферическое сопротивление; центральный компонент ограничивает рефлекторное учащение пульса.',sideEffects:['Чрезмерное снижение АД, головокружение, головная боль, тошнота','Возможны нарушения ритма; слишком быстрое падение АД может вызвать брадикардию и ухудшение кровоснабжения органов','Внутривенное введение требует контроля АД и состояния пациента']},
{section:'Адреноблокаторы',group:'Неселективные α-адреноблокаторы',drugs:['Фентоламин','Тропафен'],mechanism:'Блокируют α₁- и α₂-адренорецепторы; Харкевич описывает их в числе средств, влияющих на адренергическую регуляцию сосудистого тонуса.',sideEffects:['Ортостатическая гипотензия','Рефлекторная тахикардия']},
{section:'Адреноблокаторы',group:'Селективный α₂-адреноблокатор',drugs:['Йохимбин'],mechanism:'Блокирует преимущественно α₂-рецепторы и ослабляет пресинаптическую отрицательную обратную связь, поэтому выделение норадреналина и симпатические влияния могут усиливаться. Таблетки применяют при отдельных формах эректильной дисфункции; для снижения АД не используют.',sideEffects:['Тревога, бессонница, тремор, сердцебиение и колебания АД','Особая осторожность при АГ, тахиаритмиях и выраженных тревожных расстройствах']},
{section:'Адреноблокаторы',group:'Неселективные β₁,β₂-адреноблокаторы',drugs:['Пропранолол','Соталол'],mechanism:'Блокируют β₁- и β₂-рецепторы. β₁-блокада уменьшает ЧСС, сократимость, скорость AV-проведения и выделение ренина; β₂-блокада повышает риск бронхоспазма. Соталол дополнительно блокирует калиевые каналы, удлиняет реполяризацию и обладает свойствами антиаритмиков II и III классов.',sideEffects:['Брадикардия, AV-блокада, гипотензия, утомляемость','Бронхоспазм, особенно опасный при бронхиальной астме','Маскировка тахикардии и тремора при гипогликемии','Соталол: удлинение QT и риск полиморфной желудочковой тахикардии типа «пируэт»; контролируют ЭКГ/QTc, калий, магний и функцию почек']},
{section:'Адреноблокаторы',group:'Селективные β₁-адреноблокаторы',drugs:['Метопролол','Бисопролол','Атенолол','Бетаксолол'],mechanism:'Преимущественно блокируют β₁-рецепторы, снижая ЧСС и сократимость, замедляя AV-проведение и уменьшая выделение ренина. При повышении дозы или концентрации селективность уменьшается, поэтому бронхоспазм полностью не исключён. Для ХСН со сниженной фракцией выброса доказанное снижение смертности относится к бисопрололу и метопролола сукцинату пролонгированного высвобождения.',sideEffects:['Брадикардия, AV-блокада, гипотензия, слабость и утомляемость','Похолодание конечностей; возможны бронхоспазм и маскировка симптомов гипогликемии','Атенолол выводится преимущественно почками и может накапливаться при нарушении их функции','Метопролол метаболизируется с участием CYP2D6; ингибиторы фермента могут усиливать β-блокаду']},
{section:'Адреноблокаторы',group:'β₁-адреноблокатор с NO-зависимой вазодилатацией',drugs:['Небиволол'],mechanism:'Сочетает β₁-блокаду с NO-зависимым расширением сосудов, то есть уменьшает сосудистое сопротивление без α₁-блокады. Применяется прежде всего при АГ; показания при стабильной ХСН уточняют для конкретного препарата.',sideEffects:['Сохраняются общие риски β-блокаторов: брадикардия, гипотензия, головокружение и слабость']},
{section:'Адреноблокаторы',group:'Ультракороткодействующий β₁-адреноблокатор',drugs:['Эсмолол'],mechanism:'Быстро расщепляется эстеразами, преимущественно в эритроцитах; период полувыведения около 9 минут. Внутривенно применяется для кратковременного контроля ЧСС при отдельных наджелудочковых тахиаритмиях, а также при тахикардии и гипертензии во время и после операций по показаниям.',sideEffects:['Гипотензия, брадикардия, AV-блокада и угнетение сократимости','Необходим контроль ЭКГ и АД и возможность быстро изменить скорость или остановить инфузию']},
{section:'Адреноблокаторы',group:'Офтальмологические β-адреноблокаторы',drugs:['Тимолол','Бетаксолол'],mechanism:'Глазные капли уменьшают образование водянистой влаги цилиарным эпителием и снижают внутриглазное давление при открытоугольной глаукоме и офтальмогипертензии. Тимолол неселективен (β₁, β₂); бетаксолол преимущественно блокирует β₁, поэтому риск бронхоспазма обычно меньше, но не исчезает.',sideEffects:['Жжение, раздражение и сухость глаза','После системного всасывания возможны брадикардия, AV-блокада, снижение АД и бронхоспазм','Тимолол противопоказан при бронхиальной астме, в том числе в анамнезе, и тяжёлой ХОБЛ; глазная форма не исключает системных осложнений']},
{section:'Адреноблокаторы',group:'Симпатолитики',drugs:['Раунатин','Метилдопа'],mechanism:'Раунатин истощает запасы норадреналина в нервных окончаниях; метилдопа снижает центральную симпатическую импульсацию через образование α-метилнорадреналина — ложного медиатора.',sideEffects:['Харкевич отмечает, что механизм действия разных симпатолитиков неодинаков; конкретные нежелательные эффекты в данном описании группы не перечислены']}

function classificationGroupTokens(group){
  return String(group||'').toLowerCase()
    .replace(/α/g,' alpha ').replace(/β/g,' beta ')
    .replace(/ё/g,'е')
    .match(/[a-zа-я]+[0-9]*|[0-9]+/g)||[]

    .map(candidate=>{
      const shared=classificationGroupTokens(candidate.group).filter(token=>targetTokens.has(token));
      const score=shared.reduce((sum,token)=>sum+(token.startsWith('alpha')||token.startsWith('beta')?3:token.length>=7?2:1),0);
      return {candidate,score};

    .filter(entry=>entry.score>0)
    .sort((a,b)=>b.score-a.score);

  for(const entry of related){

        distractors.push(drug);
        if(distractors.length===3)return [item.drugs[0],...distractors];

const state={screen:'dashboard',refTab:'drugs',progress:loadProgress(),session:null,caseState:null,selectedTopics:{},classifySession:null,selectedClassifySections:{},classifyMode:'input',distribute:null,selectedSkills:{},sessionOrder:'random',sessionStage:'topics',sessionMode:'study',sessionQuestionCount:'all',sessionTimeLimit:20};
function loadProgress(){
  try{
    const saved=JSON.parse(localStorage.getItem('pharm_progress')||'{}');
    return saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{};
  }catch{return{}}
}
function saveProgress(){localStorage.setItem('pharm_progress',JSON.stringify(state.progress))}
function getStats(progress=state.progress){
  let answered=0,correct=0;
  Object.entries(progress||{}).forEach(([id,p])=>{
    if(id.startsWith('_')||!p||typeof p!=='object')return;
    const right=Number(p.correct)||0;
    const wrong=Number(p.wrong)||0;
    answered+=right+wrong;
    correct+=right;
  });
  const accuracy=answered?Math.round(correct/answered*100):0;
  return{answered,correct,accuracy,tests:Number(progress?._sessions)||0,streak:Number(progress?._streak)||1};
}

const titleEl=document.getElementById('screen-title');

let currentAccount=null;
const accountsEnabled=document.documentElement.dataset.accounts==='enabled';
const accountApi='./api/';
async function accountRequest(route,body){
  const response=await fetch(accountApi+route,{
    cache:'no-store',
    ...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  });
  if(!response.headers.get('Content-Type')?.includes('application/json'))throw new Error('Сервер аккаунтов не подключён.');
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Запрос не выполнен.');
  return data;
}
function canTeach(){return ['admin','teacher'].includes(currentAccount?.role);}
function applyAccount(account){
  currentAccount=account;
  document.querySelector('[data-screen="teacher"]').hidden=!canTeach();
}
async function loginAccount(event){
  event.preventDefault();
  const form=event.currentTarget;
  const status=form.querySelector('[role="status"]');
  const button=form.querySelector('button');
  button.disabled=true;
  try{
    applyAccount(await accountRequest('login',{email:form.elements.email.value,password:form.elements.password.value}));
    if(state.screen==='settings')setScreen('settings');
  }catch(error){status.textContent=error.message;}

async function renderTeacher(){
  const panel=document.createElement('div');
  panel.className='panel';
  panel.textContent='Загрузка групп…';
  screenEl.replaceChildren(panel);
  try{
    const students=await accountRequest('groups');
    if(!panel.isConnected)return;
    const groups=new Map();
    for(const student of students){
      const key=JSON.stringify([student.group_no,student.course,student.academic_year]);
      if(!groups.has(key))groups.set(key,[]);
      groups.get(key).push(student);
    }
    panel.innerHTML=groups.size?[...groups.values()].map(group=>`
