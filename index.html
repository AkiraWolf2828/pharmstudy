<!DOCTYPE html>
<html lang="ru" data-theme="warm-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b8d6ce">
<title>PharmStudy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--mint:#7cc5b8;--mint-soft:#e0f2ef;--lavender-deco:#b8a8e0;--lavender-soft:#ede7f7;--warm:#f5be7c;--warm-soft:#fdf0dd;--success:#7fc99a;--success-soft:#e0f4e7;--error:#f09098;--error-soft:#fde6e8}
[data-theme="warm-light"]{--sidebar-bg:#b8d6ce;--sidebar-text:#5d7268;--sidebar-text-active:#2d3f38;--sidebar-active-bg:rgba(255,255,255,0.7);--bg:#faf4ec;--card:#ffffff;--card-2:#f7f0e6;--text:#3d3535;--text-muted:#8a7d78;--border:rgba(180,160,140,0.12);--shadow:0 4px 20px rgba(180,160,140,0.12);--shadow-sm:0 2px 10px rgba(180,160,140,0.08);--accent:#ff9e85;--accent-soft:#ffe6df;--accent-deep:#e8836a;--hero-from:#ffb8a0;--hero-to:#c5b5e8;--avatar-from:#ffc4b0;--avatar-to:#c5b5e8}
[data-theme="warm-dark"]{--sidebar-bg:#232a28;--sidebar-text:#a8b8b0;--sidebar-text-active:#f0f5f0;--sidebar-active-bg:rgba(124,197,184,0.18);--bg:#2a2520;--card:#38322c;--card-2:#443d36;--text:#f5ede2;--text-muted:#a89c90;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.25);--shadow-sm:0 2px 10px rgba(0,0,0,0.18);--accent:#ffa88e;--accent-soft:rgba(255,168,142,0.15);--accent-deep:#ff9578;--hero-from:#7a5a48;--hero-to:#5a4d70;--avatar-from:#c58a78;--avatar-to:#8a7ab0}
[data-theme="mint-light"]{--sidebar-bg:#c8dfd8;--sidebar-text:#4a6862;--sidebar-text-active:#1f3330;--sidebar-active-bg:rgba(255,255,255,0.75);--bg:#f2f8f6;--card:#ffffff;--card-2:#e8f3ef;--text:#2a3a37;--text-muted:#758a85;--border:rgba(100,140,130,0.1);--shadow:0 4px 20px rgba(120,170,155,0.12);--shadow-sm:0 2px 10px rgba(120,170,155,0.08);--accent:#5fb8a8;--accent-soft:#dcf2ed;--accent-deep:#44948a;--hero-from:#8dd4c4;--hero-to:#a8c8e0;--avatar-from:#8dd4c4;--avatar-to:#a8c8e0}
[data-theme="mint-dark"]{--sidebar-bg:#1d2b28;--sidebar-text:#90aca4;--sidebar-text-active:#e8f5f1;--sidebar-active-bg:rgba(95,184,168,0.2);--bg:#1a2422;--card:#243330;--card-2:#2d3e3a;--text:#e5f2ee;--text-muted:#8aa39c;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-sm:0 2px 10px rgba(0,0,0,0.2);--accent:#7cd0be;--accent-soft:rgba(124,208,190,0.15);--accent-deep:#5fb8a8;--hero-from:#3a6a5f;--hero-to:#3a5a70;--avatar-from:#6db8a8;--avatar-to:#7aa8c0}
[data-theme="lavender-light"]{--sidebar-bg:#d8cce8;--sidebar-text:#63557a;--sidebar-text-active:#2d2140;--sidebar-active-bg:rgba(255,255,255,0.75);--bg:#f7f2fa;--card:#ffffff;--card-2:#f0e8f5;--text:#322a3d;--text-muted:#857a92;--border:rgba(140,120,160,0.1);--shadow:0 4px 20px rgba(170,140,190,0.14);--shadow-sm:0 2px 10px rgba(170,140,190,0.08);--accent:#b89dd6;--accent-soft:#ede2f5;--accent-deep:#9575b8;--hero-from:#c8aae0;--hero-to:#f0b5d0;--avatar-from:#c8aae0;--avatar-to:#f0b5d0}
[data-theme="lavender-dark"]{--sidebar-bg:#252030;--sidebar-text:#a094b5;--sidebar-text-active:#efe8f8;--sidebar-active-bg:rgba(184,157,214,0.2);--bg:#1f1a2a;--card:#2a2438;--card-2:#352d45;--text:#efe8f8;--text-muted:#9d90ad;--border:rgba(255,255,255,0.05);--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-sm:0 2px 10px rgba(0,0,0,0.2);--accent:#c8aae0;--accent-soft:rgba(200,170,224,0.15);--accent-deep:#b89dd6;--hero-from:#5a4870;--hero-to:#7a4868;--avatar-from:#9a7ab8;--avatar-to:#c88aa0}
[data-theme$="-dark"]{--mint-soft:rgba(124,197,184,0.15);--lavender-soft:rgba(197,181,232,0.15);--warm-soft:rgba(245,190,124,0.15);--success-soft:rgba(127,201,154,0.15);--error-soft:rgba(240,144,152,0.15);--accent-soft:rgba(255,168,142,0.15);color-scheme:dark}
[data-theme$="-light"]{color-scheme:light}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--card-2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:5px;border:2px solid var(--card-2)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);padding:24px 14px;display:flex;flex-direction:column;gap:20px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:10;border-radius:0 28px 28px 0;transition:background .3s}
.profile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 4px 20px;border-bottom:1px solid rgba(255,255,255,0.3)}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;box-shadow:0 4px 14px rgba(150,120,140,0.25)}
.profile-name{color:var(--sidebar-text-active);font-weight:700;font-size:16px}
.profile-sub{color:var(--sidebar-text);font-size:12px;text-align:center;opacity:0.85}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:transparent;color:var(--sidebar-text);font-size:14px;font-family:inherit;font-weight:600;border-radius:16px;cursor:pointer;text-align:left;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,0.4);color:var(--sidebar-text-active)}
.nav-btn.active{background:var(--sidebar-active-bg);color:var(--sidebar-text-active);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
.premium-block{background:linear-gradient(150deg,rgba(255,255,255,0.5),rgba(255,255,255,0.25));border-radius:20px;padding:18px 12px;text-align:center;border:1px solid rgba(255,255,255,0.4)}
.premium-block .crown{font-size:26px;margin-bottom:6px}
.premium-block h4{color:var(--sidebar-text-active);font-size:13px;margin-bottom:4px;font-weight:700}
.premium-block p{color:var(--sidebar-text);font-size:11px;margin-bottom:12px}
.premium-block button{width:100%;padding:10px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.content{flex:1;margin-left:240px;padding:28px 36px 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}
.topbar h1{font-size:26px;font-weight:700}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm)}
.theme-toggle svg{width:16px;height:16px}
.hero{background:linear-gradient(135deg,var(--hero-from) 0%,var(--hero-to) 100%);border-radius:28px;padding:32px;margin-bottom:24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(150,120,140,0.22)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,0.15)}
.hero h2{font-size:24px;font-weight:700;margin-bottom:6px;position:relative}
.hero p{font-size:14px;opacity:.95;margin-bottom:20px;position:relative}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:16px;border:none;background:#fff;color:var(--accent-deep);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;position:relative;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
.hero-btn svg{width:16px;height:16px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stat-card:nth-child(1){background:linear-gradient(160deg,var(--mint-soft),var(--card))}
.stat-card:nth-child(2){background:linear-gradient(160deg,var(--accent-soft),var(--card))}
.stat-card:nth-child(3){background:linear-gradient(160deg,var(--lavender-soft),var(--card))}
.stat-card:nth-child(4){background:linear-gradient(160deg,var(--warm-soft),var(--card))}
.stat-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:var(--card)}
.stat-icon svg{width:20px;height:20px}
.stat-icon.mint{color:var(--mint)}.stat-icon.lavender{color:var(--lavender-deco)}.stat-icon.accent{color:var(--accent)}.stat-icon.warm{color:var(--warm)}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.stat-value{font-size:28px;font-weight:700;line-height:1.1}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.row-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px}
.panel{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel-head h3{font-size:16px;font-weight:700}
.panel-head .badge{font-size:11px;color:var(--text-muted);background:var(--card-2);padding:5px 12px;border-radius:10px;font-weight:600}
.topic-list{display:flex;flex-direction:column;gap:16px}
.topic-row{display:flex;flex-direction:column;gap:8px}
.topic-top{display:flex;justify-content:space-between;font-size:12px}
.topic-name{font-weight:600}
.topic-pct{color:var(--text-muted);font-weight:600}
.topic-bar{height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.topic-fill{height:100%;border-radius:4px;transition:width .4s}
.recent-list{display:flex;flex-direction:column;gap:10px}
.recent-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:var(--card-2);cursor:pointer;transition:all .2s}
.recent-item:hover{background:var(--accent-soft);transform:translateX(3px)}
.recent-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.recent-info{flex:1;min-width:0}
.recent-title{font-size:13px;font-weight:700}
.recent-sub{font-size:11px;color:var(--text-muted)}
.question-card,.case-card,.report-card,.case-picker{background:var(--card);border-radius:28px;padding:36px;box-shadow:var(--shadow);max-width:820px;margin:0 auto}
.q-progress{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.q-progress-bar{flex:1;height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.q-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--lavender-deco));border-radius:4px;transition:width .3s}
.q-progress-text{font-size:12px;color:var(--text-muted);font-weight:600}
.q-text{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:28px}
.q-options{display:flex;flex-direction:column;gap:12px}
.q-option{padding:18px 20px;border-radius:18px;background:var(--card-2);border:2px solid transparent;color:var(--text);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:14px}
.q-option:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.q-option:disabled{cursor:default}
.q-option-letter{width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.q-option.correct{background:var(--success-soft);border-color:var(--success)}
.q-option.correct .q-option-letter{background:var(--success);color:#fff}
.q-option.wrong{background:var(--error-soft);border-color:var(--error)}
.q-option.wrong .q-option-letter{background:var(--error);color:#fff}
.explanation{margin-top:24px;padding:22px;background:var(--accent-soft);border-radius:20px;border-left:4px solid var(--accent)}
.explanation h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.3px}
.explanation p{font-size:14px;line-height:1.65;color:var(--text)}
.explanation .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:10px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--card);color:var(--text-muted);letter-spacing:0.2px}
.explanation .source{font-size:11px;color:var(--text-muted);margin-top:12px;font-style:italic}
.next-btn{margin-top:22px;width:100%;padding:16px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,0.1)}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,0.15)}
.case-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.case-badge{padding:5px 12px;border-radius:10px;background:var(--warm-soft);color:#b8801f;font-size:11px;font-weight:700;letter-spacing:0.3px}
.case-title{font-size:17px;font-weight:700}
.case-intro{padding:22px;background:var(--lavender-soft);border-radius:20px;font-size:14px;line-height:1.65;margin-bottom:24px;border-left:4px solid var(--lavender-deco)}
.case-question{font-size:17px;font-weight:600;margin-bottom:18px}
.case-feedback{padding:18px;border-radius:18px;margin-top:18px;font-size:13px;line-height:1.65}
.case-feedback.good{background:var(--success-soft);border-left:4px solid var(--success)}
.case-feedback.bad{background:var(--error-soft);border-left:4px solid var(--error)}
.case-feedback.neutral{background:var(--warm-soft);border-left:4px solid var(--warm)}
.case-pick-item{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--card-2);cursor:pointer;margin-bottom:12px;transition:all .2s}
.case-pick-item:hover{background:var(--accent-soft);transform:translateX(4px)}
.case-pick-icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--lavender-deco));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.case-pick-info{flex:1}
.case-pick-title{font-size:15px;font-weight:700;margin-bottom:2px}
.case-pick-sub{font-size:12px;color:var(--text-muted)}
.report-card{text-align:center}
.report-emoji{font-size:56px;margin-bottom:16px}
.report-title{font-size:24px;font-weight:700;margin-bottom:8px}
.report-sub{font-size:14px;color:var(--text-muted);margin-bottom:28px}
.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.report-stat{background:var(--card-2);border-radius:20px;padding:18px}
.report-stat-val{font-size:26px;font-weight:700}
.report-stat-lbl{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.report-weak{text-align:left;margin-bottom:22px}
.report-weak h4{font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.3px}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{padding:12px 14px;border-radius:14px;background:var(--error-soft);border-left:3px solid var(--error);font-size:13px;font-weight:500}
.theory-section{margin-bottom:32px}
.theory-card{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:12px;cursor:pointer;transition:all .2s}
.theory-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.theory-card-head{display:flex;align-items:center;gap:12px}
.theory-card-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.theory-card-title{font-size:16px;font-weight:700}
.theory-card-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.theory-card-body{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;line-height:1.7;color:var(--text)}
.theory-card-body.show{display:block}
.theory-card-body h4{font-size:12px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:6px;margin-top:14px}
.theory-card-body h4:first-child{margin-top:0}
.theory-card-body ul{margin:0 0 8px 0;padding-left:20px}
.theory-card-body li{margin-bottom:3px}
.theory-card-body strong{color:var(--text)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ref-section{margin-bottom:32px}
.ref-section-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text)}
.ref-card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s}
.ref-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ref-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ref-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.ref-card h3{font-size:14px;font-weight:700;line-height:1.3}
.ref-card p{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5}
.ref-drugs{display:flex;flex-wrap:wrap;gap:6px}
.ref-drug{font-size:11px;padding:4px 10px;border-radius:8px;background:var(--card-2);color:var(--text-muted);font-weight:600}
.palette-card{padding:16px;border-radius:18px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;text-align:center}
.palette-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.palette-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.palette-swatch{width:100%;height:50px;border-radius:12px;margin-bottom:10px}
.palette-name{font-size:13px;font-weight:700;margin-bottom:4px}
.palette-sub{font-size:11px;color:var(--text-muted)}
.topic-pick{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card-2);cursor:pointer;transition:all .2s;border:2px solid transparent;margin-bottom:10px}
.topic-pick:hover{background:var(--accent-soft)}
.topic-pick.selected{border-color:var(--accent);background:var(--accent-soft)}
.topic-check{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;font-weight:700;transition:all .2s}
.topic-pick-info{flex:1}
.topic-pick-title{font-size:14px;font-weight:700;margin-bottom:2px}
.topic-pick-sub{font-size:12px;color:var(--text-muted)}
.topic-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.topic-actions button{padding:8px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.topic-actions button:hover{border-color:var(--accent);color:var(--accent-deep)}
.summary-box{padding:18px;background:var(--card-2);border-radius:18px;margin-bottom:18px;text-align:center}
.summary-box .lbl{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.summary-box .val{font-size:26px;font-weight:700}
.summary-box .sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.classify-hint{font-size:12px;color:var(--text-muted);margin-bottom:10px;font-weight:500}
.classify-input{width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--border);background:var(--card-2);color:var(--text);font-family:inherit;font-size:15px;font-weight:500;transition:border-color .2s;outline:none}
.classify-input:focus{border-color:var(--accent);background:var(--card)}
.classify-input::placeholder{color:var(--text-muted);opacity:0.7}
.classify-result{margin-top:18px;padding:18px;background:var(--card-2);border-radius:16px;display:flex;flex-direction:column;gap:8px}
.classify-line{font-size:14px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.classify-mark{font-weight:700;flex-shrink:0;width:20px;text-align:center}
.classify-mark.ok{color:var(--success)}
.classify-mark.miss{color:var(--error)}
.classify-mark.extra{color:var(--warm)}
.conspect{margin-top:20px;padding:20px;background:var(--card-2);border-radius:18px;display:flex;flex-direction:column;gap:16px}
.conspect-block{display:flex;flex-direction:column;gap:6px}
.conspect-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--accent-deep)}
.conspect-text{font-size:13px;line-height:1.6;color:var(--text)}
.conspect-list{margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:var(--text)}
.conspect-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.conspect-card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.conspect-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.conspect-card-title{font-size:15px;font-weight:700}
.conspect-card-drugs{font-size:12px;color:var(--text-muted);margin-bottom:14px;font-weight:500}
.viz-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.viz-tab{padding:10px 16px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.viz-tab:hover{border-color:var(--accent);color:var(--text)}
.viz-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.synapse-wrap{max-width:1100px;margin:0 auto}
.synapse-scenarios{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.scen-btn{padding:8px 14px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.scen-btn:hover{border-color:var(--accent);color:var(--accent-deep)}
.scen-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 10px rgba(232,131,106,0.25)}
.synapse-stage{position:relative;background:#1a2138;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.synapse-svg,.eye-svg{display:block;width:100%;height:auto}
.synapse-svg .synapse-el,.eye-svg .synapse-el{cursor:pointer;transition:filter .2s}
.synapse-svg .synapse-el:hover,.eye-svg .synapse-el:hover{filter:brightness(1.35) drop-shadow(0 0 10px rgba(255,180,120,0.8))}
.synapse-tooltip{position:absolute;padding:8px 12px;background:rgba(15,23,42,0.95);color:#fff;font-size:12px;font-weight:600;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;white-space:nowrap;border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(4px)}
.synapse-tooltip.show{opacity:1}
.synapse-info{padding:20px;background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm);margin-bottom:16px;min-height:90px}
.synapse-info-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text)}
.synapse-info-desc{font-size:13px;line-height:1.6;color:var(--text-muted)}
.synapse-chain{padding:20px;background:var(--accent-soft);border-radius:20px;border-left:4px solid var(--accent)}
.synapse-chain-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--accent-deep);margin-bottom:8px}
.synapse-chain-text{font-size:14px;line-height:1.6;color:var(--text)}
.ach-float{animation:achFloat 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vesicle-bob{animation:vesicleBob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vesicle-bob.d1{animation-delay:-0.7s}
.vesicle-bob.d2{animation-delay:-1.5s}
.vesicle-bob.d3{animation-delay:-2.3s}
.ache-pulse{animation:achePulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ca-ion-flow{animation:caFlow 3s linear infinite;transform-box:fill-box;transform-origin:center}
.ca-ion-flow.d1{animation-delay:-1.5s}
.na-ion-flow{animation:naFlow 3.5s linear infinite;transform-box:fill-box;transform-origin:center}
.na-ion-flow.d1{animation-delay:-1.2s}
.na-ion-flow.d2{animation-delay:-2.4s}
.m-recept,.n-recept{transform-box:fill-box;transform-origin:center;transition:filter .3s}
.ca-channel-anim{transform-box:fill-box;transform-origin:center;animation:channelGlow 2.5s ease-in-out infinite}
.block-x{display:none}
@keyframes achFloat{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(5px,-7px) rotate(8deg)}50%{transform:translate(-3px,-12px) rotate(-5deg)}75%{transform:translate(-7px,-5px) rotate(6deg)}}
@keyframes vesicleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes achePulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.2)}}
@keyframes caFlow{0%{transform:translate(0,-45px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,45px);opacity:0}}
@keyframes naFlow{0%{transform:translate(0,25px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,-55px);opacity:0}}
@keyframes channelGlow{0%,100%{filter:drop-shadow(0 0 3px #a88adf)}50%{filter:drop-shadow(0 0 12px #d0b8ff)}}
@keyframes receptorPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes receptorFade{0%,100%{opacity:1}50%{opacity:0.5}}
.synapse-svg[data-scenario="m-agonist"] .m-recept{animation:receptorPulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #c8aaff) brightness(1.3)}
.synapse-svg[data-scenario="n-agonist"] .n-recept{animation:receptorPulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #7ce8c8) brightness(1.3)}
.synapse-svg[data-scenario="m-blocker"] .m-recept{animation:receptorFade 2.5s ease-in-out infinite;filter:drop-shadow(0 0 10px #ff6080) brightness(0.7)}
.synapse-svg[data-scenario="m-blocker"] .m-recept .block-x{display:block}
.synapse-svg[data-scenario="n-blocker"] .n-recept{animation:receptorFade 2.5s ease-in-out infinite;filter:drop-shadow(0 0 10px #ff6080) brightness(0.7)}
.synapse-svg[data-scenario="n-blocker"] .n-recept .block-x{display:block}
.synapse-svg[data-scenario="ache-block"] .ache,.synapse-svg[data-scenario="fos"] .ache{filter:drop-shadow(0 0 16px #ff4060) brightness(1.15);animation:achePulse 1.5s ease-in-out infinite}
.synapse-svg[data-scenario="ache-block"] .ach-float,.synapse-svg[data-scenario="fos"] .ach-float{animation-duration:1.4s;filter:drop-shadow(0 0 10px #ff80a0)}
.synapse-svg[data-scenario="ache-block"] .n-recept,.synapse-svg[data-scenario="fos"] .n-recept{animation:receptorPulse 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #7ce8c8) brightness(1.3)}
.synapse-svg[data-scenario="ache-block"] .m-recept,.synapse-svg[data-scenario="fos"] .m-recept{animation:receptorPulse 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #c8aaff) brightness(1.3)}
.synapse-svg[data-scenario="reactivator"] .ache{filter:drop-shadow(0 0 18px #7fc99a) brightness(1.4);animation:achePulse 2s ease-in-out infinite}
.synapse-svg[data-scenario="botox"] .vesicle-bob{opacity:0.35;filter:grayscale(1);animation-play-state:paused}
.synapse-svg[data-scenario="botox"] .ach-float{opacity:0.15;animation-play-state:paused}
.synapse-svg[data-scenario="normal"] .ca-channel-anim{filter:drop-shadow(0 0 8px #b8a0ff)}

/* ===== ГЛАЗ: АНИМАЦИИ ===== */
.eye-svg .eye-part{transition:transform 1s cubic-bezier(0.4,0,0.2,1),fill 0.8s ease,opacity 0.8s ease,filter 0.8s ease;transform-origin:center;transform-box:fill-box}
.eye-svg .pupil{transform-origin:220px 300px}
.eye-svg .lens-shape{transform-origin:290px 300px}
.eye-svg .ciliary-muscle{transform-origin:center}
.eye-svg .iris-upper{transform-origin:200px 270px}
.eye-svg .iris-lower{transform-origin:200px 330px}
.eye-svg .trabecular-upper,.eye-svg .trabecular-lower{transform-origin:center}

/* Пилокарпин */
.eye-svg[data-scenario="m-agonist"] .pupil{transform:scale(0.4);filter:drop-shadow(0 0 8px #7c3aed)}
.eye-svg[data-scenario="m-agonist"] .lens-shape{transform:scaleX(1.25) scaleY(1.15);filter:drop-shadow(0 0 12px #fbbf24)}
.eye-svg[data-scenario="m-agonist"] .ciliary-muscle{transform:scale(1.15);fill:#dc2626;filter:drop-shadow(0 0 10px #ef4444)}
.eye-svg[data-scenario="m-agonist"] .trabecular-upper,.eye-svg[data-scenario="m-agonist"] .trabecular-lower{fill:#34d399;filter:drop-shadow(0 0 12px #10b981);opacity:1}

/* Атропин */
.eye-svg[data-scenario="m-blocker"] .pupil{transform:scale(1.6);filter:drop-shadow(0 0 10px #1e1b4b)}
.eye-svg[data-scenario="m-blocker"] .lens-shape{transform:scaleX(0.85) scaleY(0.9);filter:drop-shadow(0 0 8px #d97706)}
.eye-svg[data-scenario="m-blocker"] .ciliary-muscle{transform:scale(0.85);fill:#3b82f6;filter:drop-shadow(0 0 10px #60a5fa)}
.eye-svg[data-scenario="m-blocker"] .trabecular-upper,.eye-svg[data-scenario="m-blocker"] .trabecular-lower{fill:#fbbf24;opacity:0.6}

/* Глаукома */
.eye-svg[data-scenario="acute-glaucoma"] .pupil{transform:scale(1.5);filter:drop-shadow(0 0 12px #7f1d1d)}
.eye-svg[data-scenario="acute-glaucoma"] .lens-shape{transform:scaleX(1.1) scaleY(1.05)}
.eye-svg[data-scenario="acute-glaucoma"] .iris-upper{transform:translate(6px,3px);filter:drop-shadow(0 0 8px #dc2626)}
.eye-svg[data-scenario="acute-glaucoma"] .iris-lower{transform:translate(6px,-3px);filter:drop-shadow(0 0 8px #dc2626)}
.eye-svg[data-scenario="acute-glaucoma"] .trabecular-upper,.eye-svg[data-scenario="acute-glaucoma"] .trabecular-lower{fill:#ef4444;animation:glaucomaPulse 0.8s ease-in-out infinite alternate;filter:drop-shadow(0 0 15px #dc2626)}
.eye-svg[data-scenario="acute-glaucoma"] .cornea{filter:drop-shadow(0 0 20px rgba(252,165,165,0.5))}

@keyframes glaucomaPulse{from{opacity:0.6;filter:drop-shadow(0 0 8px #dc2626)}to{opacity:1;filter:drop-shadow(0 0 20px #ef4444)}}

.eye-svg .synapse-el:hover .eye-part{filter:brightness(1.2) drop-shadow(0 0 12px rgba(255,200,100,0.8))}
[data-theme$="-dark"] .eye-bg-rect{fill:#0f172a !important}
[data-theme$="-dark"] .eye-svg text{fill:#cbd5e1 !important}

@media (max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.row-2{grid-template-columns:1fr}}
@media (max-width:768px){.sidebar{top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;padding:10px 8px;gap:4px;overflow-x:auto;border-radius:24px 24px 0 0}.profile,.premium-block{display:none}.nav{flex-direction:row;flex:1;justify-content:space-around}.nav-btn{flex-direction:column;gap:4px;padding:10px 6px;font-size:10px;flex:1;justify-content:center;align-items:center;min-width:60px;border-radius:14px}.nav-btn svg{width:22px;height:22px}.content{margin-left:0;padding:16px 14px 100px}.topbar h1{font-size:22px}.hero{padding:24px;border-radius:24px}.hero h2{font-size:20px}.hero p{font-size:13px}.question-card,.case-card,.report-card,.case-picker{padding:24px 20px;border-radius:24px}.q-text{font-size:16px}.report-stats{grid-template-columns:1fr 1fr}.theme-toggle span{display:none}.stat-value{font-size:24px}.synapse-stage{border-radius:16px}}
</style>
</head>

const QUESTIONS=[
{id:'q_001',section:'Холиномиметики',text:'Какой препарат относится к прямым М-холиномиметикам?',options:['Пилокарпин','Неостигмин','Цитизин','Карбоксим'],correct:0,explanation:'Пилокарпин — прямой М-холиномиметик, действует непосредственно на М-холинорецепторы.',tags:['Прямые холиномиметики','Механизм','Пилокарпин','Сложность 1'],source:'Харкевич Д.А., «Фармакология»'},
{id:'q_002',section:'Холиномиметики',text:'Пациенту с болезнью Альцгеймера назначен Галантамин. К какой группе он относится?',options:['М-холиномиметик','оиХЭ центрального действия','оиХЭ периферического действия','Реактиватор холинэстеразы'],correct:1,explanation:'Галантамин — обратимый ингибитор холинэстеразы центрального действия.',tags:['оиХЭ центрального действия','Показания','Галантамин','Сложность 2'],source:'Харкевич Д.А., «Фармакология»'},

const state={screen:'dashboard',progress:loadProgress(),session:null,caseState:null,selectedTopics:{},classifySession:null,selectedClassifySections:{},classifyMode:'input',distribute:null,selectedSkills:{},vizTab:'synapse'};
function loadProgress(){try{return JSON.parse(localStorage.getItem('pharm_progress')||'{}')}catch{return{}}}
function saveProgress(){localStorage.setItem('pharm_progress',JSON.stringify(state.progress))}
function getStats(){let answered=0,correct=0;Object.entries(state.progress).forEach(([id,p])=>{if(id.startsWith('_'))return;answered+=p.correct+p.wrong;correct+=p.correct});const accuracy=answered?Math.round(correct/answered*100):0;return{answered,correct,accuracy,tests:state.progress._sessions||0,streak:state.progress._streak||1}}
const screenEl=document.getElementById('screen');
const titleEl=document.getElementById('screen-title');
function setScreen(name){state.screen=name;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));const titles={dashboard:'Дашборд',session:'Тестирование',classify:'Классификация',synapse:'Визуализация',case:'Кейсы',reference:'Справочник',settings:'Настройки'};document.title='PharmStudy — '+(titles[name]||'');if(name==='dashboard'){titleEl.textContent='Дашборд';screenEl.innerHTML=renderDashboard()}else if(name==='session'){titleEl.textContent='Тестирование';renderSessionSetup()}else if(name==='classify'){titleEl.textContent='Классификация';state.classifyMode='input';renderClassifySetup()}else if(name==='synapse'){titleEl.textContent='Визуализация';renderVisualization()}else if(name==='case'){titleEl.textContent='Кейсы';renderCasePicker()}else if(name==='reference'){titleEl.textContent='Справочник';screenEl.innerHTML=renderReference()}else if(name==='settings'){titleEl.textContent='Настройки';screenEl.innerHTML=renderSettings()}}
function renderDashboard(){const s=getStats();const sections=[...new Set(QUESTIONS.map(q=>q.section))];const colors=['var(--mint)','var(--accent)','var(--lavender-deco)','var(--warm)','var(--success)'];const topics=sections.map((sec,i)=>({name:sec,pct:Math.min(100,Math.round(s.accuracy*0.9)),color:colors[i%colors.length]}));return `<div class="hero"><h2>Добрый вечер, Студент!</h2><p>${sections.length} разделов · ${QUESTIONS.length} вопросов · ${Object.keys(CASES).length} кейсов</p><button class="hero-btn" onclick="setScreen('session')">Начать тестирование</button></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon mint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div><div class="stat-label">Пройдено</div><div class="stat-value">${s.answered}</div><div class="stat-sub">вопросов</div></div><div class="stat-card"><div class="stat-icon lavender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-label">Точность</div><div class="stat-value">${s.accuracy}%</div><div class="stat-sub">правильных</div></div><div class="stat-card"><div class="stat-icon accent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-label">Тестов</div><div class="stat-value">${s.tests}</div><div class="stat-sub">пройдено</div></div><div class="stat-card"><div class="stat-icon warm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></div><div class="stat-label">Дней подряд</div><div class="stat-value">${s.streak}</div><div class="stat-sub">streak</div></div></div><div class="row-2"><div class="panel"><div class="panel-head"><h3>Содержание базы</h3></div><div class="recent-list">${sections.map((sec,i)=>{const count=QUESTIONS.filter(q=>q.section===sec).length;const col=colors[i%colors.length];return `<div class="recent-item"><div class="recent-icon" style="background:${col}">${count}</div><div class="recent-info"><div class="recent-title">${sec}</div><div class="recent-sub">${count} вопросов</div></div></div>`;}).join('')}</div></div><div class="panel"><div class="panel-head"><h3>Прогресс по темам</h3></div><div class="topic-list">${topics.map(t=>`<div class="topic-row"><div class="topic-top"><span class="topic-name">${t.name}</span><span class="topic-pct">${t.pct}%</span></div><div class="topic-bar"><div class="topic-fill" style="width:${t.pct}%;background:${t.color}"></div></div></div>`).join('')}</div></div></div>`}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderSessionSetup(){const sections=[...new Set(QUESTIONS.map(q=>q.section))];const colors=['var(--mint)','var(--accent)','var(--lavender-deco)','var(--warm)','var(--success)'];if(state.selectedTopics._init!==true){sections.forEach(s=>state.selectedTopics[s]=true);state.selectedTopics._init=true;}const selectedCount=sections.filter(s=>state.selectedTopics[s]).length;const totalSelected=sections.filter(s=>state.selectedTopics[s]).reduce((sum,s)=>sum+QUESTIONS.filter(q=>q.section===s).length,0);screenEl.innerHTML=`<div class="case-picker"><div style="font-size:20px;font-weight:700;margin-bottom:6px">Выбор темы</div><div class="topic-actions"><button onclick="selectAllTopics(true)">✓ Все</button><button onclick="selectAllTopics(false)">✗ Снять</button></div><div style="margin-bottom:24px">${sections.map((sec,i)=>`<div class="topic-pick ${state.selectedTopics[sec]?'selected':''}" onclick="toggleTopic('${sec}')"><div class="topic-check" style="background:${state.selectedTopics[sec]?colors[i%colors.length]:'var(--card)'}">${state.selectedTopics[sec]?'✓':''}</div><div class="topic-pick-info"><div class="topic-pick-title">${sec}</div><div class="topic-pick-sub">${QUESTIONS.filter(q=>q.section===sec).length} вопросов</div></div></div>`).join('')}</div><div class="summary-box"><div class="lbl">Выбрано</div><div class="val">${totalSelected} вопросов</div></div><button class="next-btn" ${totalSelected===0?'disabled style="opacity:0.4"':''} onclick="startSession()">Начать</button><button class="next-btn" style="background:transparent;color:var(--text-muted);margin-top:8px" onclick="setScreen('dashboard')">На главную</button></div>`}
function toggleSkill(s){state.selectedSkills[s]=!state.selectedSkills[s];renderSessionSetup();}
function toggleTopic(sec){state.selectedTopics[sec]=!state.selectedTopics[sec];renderSessionSetup();}
function selectAllTopics(v){const sections=[...new Set(QUESTIONS.map(q=>q.section))];sections.forEach(s=>state.selectedTopics[s]=v);state.selectedTopics._init=true;renderSessionSetup();}
function startSession(){const sections=[...new Set(QUESTIONS.map(q=>q.section))];const selected=sections.filter(s=>state.selectedTopics[s]);let pool=QUESTIONS.filter(q=>selected.includes(q.section));if(pool.length===0){alert('Нет вопросов');return;}pool=shuffle(pool);state.session={questions:pool,index:0,answers:[]};titleEl.textContent='Тестирование';renderQuestion();}
function renderQuestion(){const s=state.session;if(s.index>=s.questions.length){renderReport();return}const q=s.questions[s.index];const progress=(s.index/s.questions.length)*100;screenEl.innerHTML=`<div class="question-card"><div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${progress}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.questions.length}</span></div><div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:700">${q.section}</div><div class="q-text">${q.text}</div><div class="q-options" id="qOptions">${q.options.map((opt,i)=>`<button class="q-option" onclick="answerQuestion(${i})"><span class="q-option-letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></button>`).join('')}</div><div id="feedbackArea"></div></div>`}
function answerQuestion(i){const s=state.session;const q=s.questions[s.index];const buttons=document.querySelectorAll('#qOptions .q-option');buttons.forEach(b=>b.disabled=true);const isCorrect=i===q.correct;buttons[i].classList.add(isCorrect?'correct':'wrong');if(!isCorrect)buttons[q.correct].classList.add('correct');s.answers.push({id:q.id,correct:isCorrect,section:q.section});if(!state.progress[q.id])state.progress[q.id]={correct:0,wrong:0};if(isCorrect)state.progress[q.id].correct++;else state.progress[q.id].wrong++;saveProgress();document.getElementById('feedbackArea').innerHTML=`<div class="explanation"><h4>${isCorrect?'✓ Верно':'✗ Правильный: '+String.fromCharCode(65+q.correct)}</h4><p>${q.explanation}</p><div class="tags">${q.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><button class="next-btn" onclick="nextQuestion()">${s.index+1>=s.questions.length?'Завершить':'Далее'}</button>`}
function nextQuestion(){state.session.index++;renderQuestion()}
function renderReport(){const s=state.session;const correct=s.answers.filter(a=>a.correct).length;const total=s.answers.length;const pct=Math.round(correct/total*100);state.progress._sessions=(state.progress._sessions||0)+1;saveProgress();screenEl.innerHTML=`<div class="report-card"><div class="report-emoji">${pct>=80?'🎉':pct>=50?'👍':'📚'}</div><div class="report-title">Тест завершён</div><div class="report-sub">${total} вопросов</div><div class="report-stats"><div class="report-stat"><div class="report-stat-val" style="color:var(--success)">${correct}</div><div class="report-stat-lbl">правильно</div></div><div class="report-stat"><div class="report-stat-val" style="color:var(--error)">${total-correct}</div><div class="report-stat-lbl">ошибок</div></div><div class="report-stat"><div class="report-stat-val">${pct}%</div><div class="report-stat-lbl">точность</div></div></div><button class="next-btn" onclick="setScreen('session')">Новый тест</button><button class="next-btn" style="background:transparent;color:var(--text-muted);margin-top:8px" onclick="setScreen('dashboard')">На главную</button></div>`}
function renderClassifySetup(){const sections=[...new Set(GROUPS.map(g=>g.section))];const colors=['var(--mint)','var(--accent)','var(--lavender-deco)','var(--warm)','var(--success)'];if(state.selectedClassifySections._init!==true){sections.forEach(s=>state.selectedClassifySections[s]=true);state.selectedClassifySections._init=true;}const selectedCount=sections.filter(s=>state.selectedClassifySections[s]).length;const totalSelected=sections.filter(s=>state.selectedClassifySections[s]).reduce((sum,s)=>sum+GROUPS.filter(g=>g.section===s).length,0);screenEl.innerHTML=`<div class="case-picker"><div style="font-size:20px;font-weight:700;margin-bottom:6px">Классификация</div><div class="topic-actions"><button onclick="selectAllClassify(true)">✓ Все</button><button onclick="selectAllClassify(false)">✗ Снять</button></div><div style="margin-bottom:24px">${sections.map((sec,i)=>`<div class="topic-pick ${state.selectedClassifySections[sec]?'selected':''}" onclick="toggleClassifySection('${sec}')"><div class="topic-check" style="background:${state.selectedClassifySections[sec]?colors[i%colors.length]:'var(--card)'}">${state.selectedClassifySections[sec]?'✓':''}</div><div class="topic-pick-info"><div class="topic-pick-title">${sec}</div><div class="topic-pick-sub">${GROUPS.filter(g=>g.section===sec).length} групп</div></div></div>`).join('')}</div><div class="summary-box"><div class="lbl">Выбрано</div><div class="val">${totalSelected} групп</div></div><button class="next-btn" ${totalSelected===0?'disabled style="opacity:0.4"':''} onclick="startClassify()">Начать</button><button class="next-btn" style="background:transparent;color:var(--text-muted);margin-top:8px" onclick="setScreen('dashboard')">На главную</button></div>`}
function toggleClassifySection(sec){state.selectedClassifySections[sec]=!state.selectedClassifySections[sec];renderClassifySetup();}
function selectAllClassify(v){const sections=[...new Set(GROUPS.map(g=>g.section))];sections.forEach(s=>state.selectedClassifySections[s]=v);state.selectedClassifySections._init=true;renderClassifySetup();}
function startClassify(){const sections=[...new Set(GROUPS.map(g=>g.section))];const selected=sections.filter(s=>state.selectedClassifySections[s]);let pool=GROUPS.filter(g=>selected.includes(g.section));if(pool.length===0){alert('Выбери раздел');return;}pool=shuffle(pool);state.classifySession={groups:pool,index:0,results:[]};titleEl.textContent='Классификация';renderClassifyQuestion();}
function renderClassifyQuestion(){const s=state.classifySession;if(s.index>=s.groups.length){renderClassifyReport();return;}const g=s.groups[s.index];const progress=(s.index/s.groups.length)*100;screenEl.innerHTML=`<div class="question-card"><div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${progress}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.groups.length}</span></div><div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:700">${g.section}</div><div class="q-text">${g.group}</div><div class="classify-hint">Перечислите препараты через запятую</div><input type="text" id="classifyInput" class="classify-input" placeholder="Например: Пилокарпин" onkeydown="if(event.key==='Enter')checkClassifyAnswer()"><button class="next-btn" onclick="checkClassifyAnswer()">Проверить</button></div>`;setTimeout(()=>{const i=document.getElementById('classifyInput');if(i)i.focus();},50);}
function checkClassifyAnswer(){const s=state.classifySession;const g=s.groups[s.index];const input=document.getElementById('classifyInput').value;const parts=input.split(/[,;]+/).map(s=>s.trim()).filter(s=>s);const matched=parts.filter(p=>g.drugs.some(d=>d.toLowerCase().includes(p.toLowerCase())));const missed=g.drugs.filter(d=>!parts.some(p=>d.toLowerCase().includes(p.toLowerCase())));s.results.push({group:g.group,correct:matched.length,total:g.drugs.length,missed});const status=matched.length===g.drugs.length?'good':matched.length===0?'bad':'neutral';screenEl.innerHTML=`<div class="question-card"><div class="q-progress"><div class="q-progress-bar"><div class="q-progress-fill" style="width:${((s.index+1)/s.groups.length)*100}%"></div></div><span class="q-progress-text">${s.index+1} / ${s.groups.length}</span></div><div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:700">${g.section}</div><div class="q-text">${g.group}</div><div class="case-feedback ${status}" style="margin-top:16px">${matched.length===g.drugs.length?'✓ Всё верно':matched.length===0?'✗ Ничего не угадано':`~ Частично: ${matched.length} из ${g.drugs.length}`}</div>${missed.length?`<div class="classify-result"><div class="classify-line"><span class="classify-mark miss">✗</span> Пропущено: ${missed.join(', ')}</div></div>`:''}<div class="conspect"><div class="conspect-block"><div class="conspect-label">Механизм</div><div class="conspect-text">${g.mechanism}</div></div></div><button class="next-btn" onclick="nextClassify()">${s.index+1>=s.groups.length?'Завершить':'Далее'}</button></div>`}
function nextClassify(){state.classifySession.index++;renderClassifyQuestion();}
function renderClassifyReport(){const s=state.classifySession;const totalGroups=s.results.length;const fullCorrect=s.results.filter(r=>r.correct===r.total).length;const pct=totalGroups?Math.round(fullCorrect/totalGroups*100):0;state.progress._classifyTests=(state.progress._classifyTests||0)+1;saveProgress();screenEl.innerHTML=`<div class="report-card"><div class="report-emoji">${pct>=80?'🎉':pct>=50?'':'📚'}</div><div class="report-title">Классификация завершена</div><div class="report-sub">${totalGroups} групп</div><div class="report-stats"><div class="report-stat"><div class="report-stat-val" style="color:var(--success)">${fullCorrect}</div><div class="report-stat-lbl">полностью</div></div><div class="report-stat"><div class="report-stat-val">${pct}%</div><div class="report-stat-lbl">точность</div></div></div><button class="next-btn" onclick="setScreen('classify')">Ещё раз</button><button class="next-btn" style="background:transparent;color:var(--text-muted);margin-top:8px" onclick="setScreen('dashboard')">На главную</button></div>`}
function renderVisualization(){const tab=state.vizTab||'synapse';screenEl.innerHTML=`<div class="viz-tabs"><button class="viz-tab ${tab==='synapse'?'active':''}" onclick="switchViz('synapse')"> Синапс</button><button class="viz-tab ${tab==='eye'?'active':''}" onclick="switchViz('eye')">👁 Глаз</button></div><div id="vizContent"></div>`;if(tab==='synapse')renderSynapseContent();else renderEyeContent();}
function switchViz(t){state.vizTab=t;renderVisualization();}
function renderSynapseContent(){document.getElementById('vizContent').innerHTML=`<div class="synapse-wrap"><div class="synapse-scenarios" id="synapseScenarios">${Object.entries(SCENARIOS).map(([k,v])=>`<button class="scen-btn ${k==='normal'?'active':''}" data-scen="${k}">${v.name}</button>`).join('')}</div><div class="synapse-stage"><svg class="synapse-svg" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" data-scenario="normal" id="synapseSvg"><defs><radialGradient id="bgGrad" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#3a4870"/><stop offset="100%" stop-color="#1a2138"/></radialGradient><linearGradient id="preCytoplasm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a2828"/><stop offset="100%" stop-color="#5a3a30"/></linearGradient><linearGradient id="preMembrane" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0c0a8"/><stop offset="50%" stop-color="#d49a80"/><stop offset="100%" stop-color="#a86a58"/></linearGradient><linearGradient id="cleftGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2140"/><stop offset="100%" stop-color="#2a3158"/></linearGradient><linearGradient id="postMembrane" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8ac0e0"/><stop offset="50%" stop-color="#6a9cc8"/><stop offset="100%" stop-color="#3a5a80"/></linearGradient><linearGradient id="postCytoplasm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a3850"/><stop offset="100%" stop-color="#1a2440"/></linearGradient><radialGradient id="vesicleGrad" cx="30%" cy="25%" r="75%"><stop offset="0%" stop-color="#c8b8e8"/><stop offset="40%" stop-color="#9a86c8"/><stop offset="100%" stop-color="#5a4a88"/></radialGradient><radialGradient id="achGrad" cx="30%" cy="25%" r="70%"><stop offset="0%" stop-color="#ffd0d8"/><stop offset="40%" stop-color="#ff7090"/><stop offset="100%" stop-color="#c83060"/></radialGradient><radialGradient id="caIon" cx="30%" cy="25%" r="70%"><stop offset="0%" stop-color="#ffe0e8"/><stop offset="40%" stop-color="#ff80a8"/><stop offset="100%" stop-color="#c04070"/></radialGradient><radialGradient id="naIon" cx="30%" cy="25%" r="70%"><stop offset="0%" stop-color="#e0f0ff"/><stop offset="40%" stop-color="#80c8ff"/><stop offset="100%" stop-color="#3070c0"/></radialGradient><linearGradient id="caChannelGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8a7ac8"/><stop offset="50%" stop-color="#b8a8e8"/><stop offset="100%" stop-color="#5a4a98"/></linearGradient><linearGradient id="mReceptGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d8b8f0"/><stop offset="50%" stop-color="#a888d0"/><stop offset="100%" stop-color="#6a4a98"/></linearGradient><linearGradient id="nReceptGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a8e8d0"/><stop offset="50%" stop-color="#5ac8a0"/><stop offset="100%" stop-color="#2a8868"/></linearGradient><radialGradient id="acheGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffe8a8"/><stop offset="40%" stop-color="#ffb840"/><stop offset="100%" stop-color="#c07820"/></radialGradient><filter id="softGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="strongGlow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter></defs><rect width="1000" height="700" fill="url(#bgGrad)"/><path d="M 50 40 Q 500 -30 950 40 L 950 310 Q 500 350 50 310 Z" fill="url(#preCytoplasm)"/><path d="M 50 40 Q 500 -30 950 40 L 950 310 Q 500 350 50 310 Z" fill="none" stroke="url(#preMembrane)" stroke-width="10" filter="url(#shadow)"/><g class="vesicle synapse-el vesicle-bob" data-name="Везикула"><ellipse cx="315" cy="160" rx="40" ry="38" fill="url(#vesicleGrad)"/><circle cx="305" cy="150" r="5" fill="url(#achGrad)"/><circle cx="330" cy="158" r="5" fill="url(#achGrad)"/></g><g class="vesicle synapse-el vesicle-bob d1" data-name="Везикула"><ellipse cx="475" cy="125" rx="36" ry="34" fill="url(#vesicleGrad)"/><circle cx="465" cy="120" r="4" fill="url(#achGrad)"/></g><g class="vesicle synapse-el vesicle-bob d2" data-name="Везикула"><ellipse cx="635" cy="165" rx="42" ry="40" fill="url(#vesicleGrad)"/><circle cx="620" cy="158" r="5" fill="url(#achGrad)"/></g><g class="ca-channel synapse-el ca-channel-anim" data-name="Ca²⁺-канал"><path d="M 250 290 L 290 290 L 295 320 L 285 335 L 255 335 L 245 320 Z" fill="url(#caChannelGrad)"/><text x="270" y="318" font-size="10" text-anchor="middle" fill="#fff">Ca²⁺</text></g><path d="M 50 350 Q 500 320 950 350 L 950 420 Q 500 450 50 420 Z" fill="url(#cleftGrad)"/><g class="ach-molecule synapse-el" data-name="Ацетилхолин"><g class="ach-float"><circle cx="150" cy="380" r="9" fill="url(#achGrad)" filter="url(#strongGlow)"/></g><g class="ach-float" style="animation-delay:-1.2s"><circle cx="540" cy="400" r="9" fill="url(#achGrad)" filter="url(#strongGlow)"/></g></g><g class="ache synapse-el ache-pulse" data-name="АХЭ"><path d="M 410 390 Q 410 355 460 355 Q 510 355 510 390 L 520 415 Q 515 435 500 435 L 490 415 Q 460 430 430 415 L 420 435 Q 405 435 400 415 Z" fill="url(#acheGrad)" stroke="#a06818" stroke-width="2"/><text x="460" y="470" font-size="12" text-anchor="middle" fill="#ffb840">АХЭ</text></g><path d="M 50 460 Q 500 430 950 460 L 950 680 Q 500 720 50 680 Z" fill="url(#postCytoplasm)"/><path d="M 50 460 Q 500 430 950 460 L 950 680 Q 500 720 50 680 Z" fill="none" stroke="url(#postMembrane)" stroke-width="10" filter="url(#shadow)"/><g class="m-receptor synapse-el m-recept" data-name="М-рецептор"><path d="M 158 480 L 158 448 Q 158 428 178 428 Q 198 428 198 448 L 198 480" fill="url(#mReceptGrad)"/><text class="block-x" x="178" y="458" font-size="18" text-anchor="middle" fill="#ff4060">✕</text></g><g class="m-receptor synapse-el m-recept" data-name="М-рецептор"><path d="M 378 480 L 378 448 Q 378 428 398 428 Q 418 428 418 448 L 418 480" fill="url(#mReceptGrad)"/><text class="block-x" x="398" y="458" font-size="18" text-anchor="middle" fill="#ff4060">✕</text></g><g class="n-receptor synapse-el n-recept" data-name="Н-рецептор"><rect x="252" y="440" width="36" height="42" rx="8" fill="url(#nReceptGrad)"/><text class="block-x" x="270" y="470" font-size="18" text-anchor="middle" fill="#ff4060">✕</text></g><g class="n-receptor synapse-el n-recept" data-name="Н-рецептор"><rect x="512" y="440" width="36" height="42" rx="8" fill="url(#nReceptGrad)"/><text class="block-x" x="530" y="470" font-size="18" text-anchor="middle" fill="#ff4060">✕</text></g><g class="na-ion-flow"><circle cx="270" cy="490" r="8" fill="url(#naIon)" filter="url(#strongGlow)"/><text x="270" y="493" font-size="7" text-anchor="middle" fill="#fff">Na</text></g><g class="na-ion-flow d1"><circle cx="530" cy="500" r="8" fill="url(#naIon)" filter="url(#strongGlow)"/><text x="530" y="503" font-size="7" text-anchor="middle" fill="#fff">Na</text></g><g font-family="-apple-system,sans-serif"><text x="80" y="80" font-size="15" font-weight="700" fill="#f0c0a8">Пресинаптический нейрон</text><text x="80" y="510" font-size="15" font-weight="700" fill="#8ac0e0">Постсинаптический нейрон</text><text x="500" y="405" font-size="11" font-weight="700" fill="#6a7a9a" text-anchor="middle">Синаптическая щель</text></g></svg><div class="synapse-tooltip" id="synapseTooltip"></div></div><div class="synapse-info" id="synapseInfo"><div class="synapse-info-title">Наведи на элемент</div><div class="synapse-info-desc">Кликни для описания.</div></div><div class="synapse-chain"><div class="synapse-chain-title">Что происходит</div><div class="synapse-chain-text" id="synapseChainText">Физиологическая передача.</div></div></div>`;const svg=document.getElementById('synapseSvg');const tooltip=document.getElementById('synapseTooltip');const stage=svg.parentElement;svg.querySelectorAll('.synapse-el').forEach(el=>{el.addEventListener('mousemove',e=>{const r=stage.getBoundingClientRect();tooltip.textContent=el.dataset.name;tooltip.style.left=(e.clientX-r.left+14)+'px';tooltip.style.top=(e.clientY-r.top+14)+'px';tooltip.classList.add('show');});el.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));el.addEventListener('click',()=>{document.getElementById('synapseInfo').innerHTML='<div class="synapse-info-title">'+el.dataset.name+'</div><div class="synapse-info-desc">Элемент синапса.</div>';});});document.querySelectorAll('#synapseScenarios .scen-btn').forEach(b=>{b.addEventListener('click',()=>{const key=b.dataset.scen;document.querySelectorAll('#synapseScenarios .scen-btn').forEach(x=>x.classList.toggle('active',x===b));svg.setAttribute('data-scenario',key);document.getElementById('synapseChainText').innerHTML=SCENARIOS[key].chain;});});}
function renderEyeContent(){document.getElementById('vizContent').innerHTML=`<div class="synapse-wrap"><div class="synapse-scenarios" id="eyeScenarios">${Object.entries(EYE_SCENARIOS).map(([k,v])=>`<button class="scen-btn ${k==='normal'?'active':''}" data-scen="${k}">${v.name}</button>`).join('')}</div><div class="synapse-stage" style="background:#0d1117"><svg class="eye-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" data-scenario="normal" id="eyeSvg" style="max-height:75vh;width:100%;max-width:800px">${EYE_SVG}</svg><div class="synapse-tooltip" id="eyeTooltip"></div></div><div class="synapse-info" id="eyeInfo"><div class="synapse-info-title">Наведи на элемент</div><div class="synapse-info-desc">Кликни для описания.</div></div><div class="synapse-chain"><div class="synapse-chain-title">Что происходит</div><div class="synapse-chain-text" id="eyeChainText">В покое.</div></div></div>`;const svg=document.getElementById('eyeSvg');const tooltip=document.getElementById('eyeTooltip');const stage=svg.parentElement;svg.querySelectorAll('.eye-part').forEach(el=>{el.addEventListener('mousemove',e=>{const r=stage.getBoundingClientRect();tooltip.textContent=el.dataset.name||'Часть глаза';tooltip.style.left=(e.clientX-r.left+14)+'px';tooltip.style.top=(e.clientY-r.top+14)+'px';tooltip.classList.add('show');});el.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));el.addEventListener('click',()=>{document.getElementById('eyeInfo').innerHTML='<div class="synapse-info-title">'+(el.dataset.name||'Часть глаза')+'</div><div class="synapse-info-desc">Анатомическая структура глаза.</div>';});});document.querySelectorAll('#eyeScenarios .scen-btn').forEach(b=>{b.addEventListener('click',()=>{const key=b.dataset.scen;document.querySelectorAll('#eyeScenarios .scen-btn').forEach(x=>x.classList.toggle('active',x===b));svg.setAttribute('data-scenario',key);document.getElementById('eyeChainText').innerHTML=EYE_SCENARIOS[key].chain;});});}
function renderCasePicker(){const cases=Object.values(CASES);screenEl.innerHTML=`<div class="case-picker"><div style="font-size:16px;font-weight:700;margin-bottom:8px">Выбери кейс</div>${cases.map(c=>`<div class="case-pick-item" onclick="startCase('${c.id}')"><div class="case-pick-icon">▶</div><div class="case-pick-info"><div class="case-pick-title">${c.title}</div><div class="case-pick-sub">${c.section}</div></div></div>`).join('')}</div>`}
function startCase(id){state.caseState={caseId:id,nodeId:CASES[id].start};renderCaseNode()}
function renderCaseNode(){const cs=state.caseState;const C=CASES[cs.caseId];const node=C.nodes[cs.nodeId];if(node.isEnd){screenEl.innerHTML=`<div class="case-card"><div class="case-header"><span class="case-badge">ЗАВЕРШЁН</span><span class="case-title">${C.title}</span></div><div class="case-intro">${C.intro}</div><div style="padding:20px;background:var(--success-soft);border-radius:16px;margin-bottom:16px"><div style="font-size:13px;font-weight:700;color:#2f8b5c;margin-bottom:8px">Итог</div><div style="font-size:13px;line-height:1.6">${node.summary}</div></div><button class="next-btn" onclick="startCase('${C.id}')">Заново</button><button class="next-btn" style="background:transparent;color:var(--text-muted);margin-top:8px" onclick="setScreen('dashboard')">На главную</button></div>`;return;}screenEl.innerHTML=`<div class="case-card"><div class="case-header"><span class="case-badge">КЕЙС</span><span class="case-title">${C.title}</span></div><div class="case-intro">${C.intro}</div><div class="case-question">${node.question}</div><div class="q-options" id="caseOptions">${node.options.map((opt,i)=>`<button class="q-option" onclick="answerCase(${i})"><span class="q-option-letter">${i+1}</span><span>${opt.text}</span></button>`).join('')}</div><div id="caseFeedback"></div></div>`}
function answerCase(i){const cs=state.caseState;const node=CASES[cs.caseId].nodes[cs.nodeId];const opt=node.options[i];document.querySelectorAll('#caseOptions .q-option').forEach(b=>b.disabled=true);const fbClass=opt.type==='good'?'good':opt.type==='bad'?'bad':'neutral';document.getElementById('caseFeedback').innerHTML=`<div class="case-feedback ${fbClass}">${opt.feedback}</div><button class="next-btn" onclick="advanceCase('${opt.next}')">Далее</button>`}
function advanceCase(nextId){state.caseState.nodeId=nextId;renderCaseNode()}
function renderReference(){const sections=[...new Set(REFERENCE.map(r=>r.section))];return `<div class="theory-section"><div class="ref-section-title">📚 Основы</div>${THEORY.map((t,i)=>`<div class="theory-card" onclick="toggleTheory(${i})"><div class="theory-card-head"><div class="theory-card-icon" style="background:${t.bg};color:${t.color}">${t.icon}</div><div style="flex:1"><div class="theory-card-title">${t.title}</div><div class="theory-card-sub">${t.sub}</div></div></div><div class="theory-card-body" id="theoryBody${i}">${t.body}</div></div>`).join('')}</div>${sections.map(sec=>`<div class="ref-section"><div class="ref-section-title">${sec}</div><div class="ref-grid">${REFERENCE.filter(r=>r.section===sec).map(r=>{const idx=REFERENCE.indexOf(r);return `<div class="ref-card" onclick="toggleRef(${idx})"><div class="ref-card-head"><div class="ref-icon" style="background:${r.bg};color:${r.color}">${r.icon}</div><h3>${r.title}</h3></div><p>${r.desc}</p><div class="ref-drugs">${r.drugs.map(d=>`<span class="ref-drug">${d}</span>`).join('')}</div><div id="refDetails${idx}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px">${r.details}</div></div>`;}).join('')}</div></div>`).join('')}`}
function toggleTheory(i){const el=document.getElementById('theoryBody'+i);el.classList.toggle('show');}
function toggleRef(i){const el=document.getElementById('refDetails'+i);el.style.display=el.style.display==='none'?'block':'none'}
function renderSettings(){const s=getStats();const palettes=[{id:'warm',name:'Тёплая',grad:'linear-gradient(135deg,#ffb8a0,#c5b5e8)'},{id:'mint',name:'Мятная',grad:'linear-gradient(135deg,#8dd4c4,#a8c8e0)'},{id:'lavender',name:'Лавандовая',grad:'linear-gradient(135deg,#c8aae0,#f0b5d0)'}];return `<div style="max-width:700px"><div class="panel" style="margin-bottom:16px"><h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Палитра</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${palettes.map(p=>`<div class="palette-card ${getPalette()===p.id?'active':''}" onclick="setPalette('${p.id}')"><div class="palette-swatch" style="background:${p.grad}"></div><div class="palette-name">${p.name}</div></div>`).join('')}</div></div><div class="panel" style="margin-bottom:16px"><h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Режим</h3><div style="display:flex;gap:10px">${[{v:'light',l:'Светлая'},{v:'dark',l:'Тёмная'}].map(o=>`<button class="theme-toggle" onclick="setMode('${o.v}')" style="${getMode()===o.v?'border-color:var(--accent)':''}">${o.l}</button>`).join('')}</div></div><div class="panel"><h3 style="font-size:15px;font-weight:700;margin-bottom:12px">Прогресс</h3><div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">Вопросов: <strong>${s.answered}</strong><br>Тестов: <strong>${s.tests}</strong><br>Точность: <strong>${s.accuracy}%</strong></div><button class="next-btn" style="background:var(--error);max-width:240px" onclick="resetProgress()">Сбросить</button></div></div>`}
function resetProgress(){if(confirm('Сбросить прогресс?')){state.progress={};saveProgress();setScreen('dashboard')}}
function getPalette(){return localStorage.getItem('pharm_palette')||'warm'}
function getMode(){return localStorage.getItem('pharm_mode')||'light'}
function applyTheme(){const palette=getPalette();let mode=getMode();if(mode==='system')mode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',palette+'-'+mode);let meta=document.querySelector('meta[name="theme-color"]');if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta);}const colors={warm:{light:'#faf4ec',dark:'#2a2520'},mint:{light:'#f2f8f6',dark:'#1a2422'},lavender:{light:'#f7f2fa',dark:'#1f1a2a'}};meta.content=colors[palette][mode];const icon=document.getElementById('themeIcon');const label=document.getElementById('themeLabel');if(mode==='dark'){icon.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';label.textContent='Тёмная'}else{icon.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';label.textContent='Светлая'}}
function setMode(v){localStorage.setItem('pharm_mode',v);applyTheme();if(state.screen==='settings')setScreen('settings')}
function setPalette(v){localStorage.setItem('pharm_palette',v);applyTheme();if(state.screen==='settings')setScreen('settings')}

// ЭКСПОРТ ФУНКЦИЙ
window.setScreen=setScreen;
window.toggleSkill=toggleSkill;
window.toggleTopic=toggleTopic;
window.selectAllTopics=selectAllTopics;
window.startSession=startSession;
window.answerQuestion=answerQuestion;
window.nextQuestion=nextQuestion;
window.startClassify=startClassify;
window.checkClassifyAnswer=checkClassifyAnswer;
window.nextClassify=nextClassify;
window.switchViz=switchViz;
window.startCase=startCase;
window.answerCase=answerCase;
window.advanceCase=advanceCase;
window.toggleTheory=toggleTheory;
window.toggleRef=toggleRef;
window.resetProgress=resetProgress;
window.setMode=setMode;
window.setPalette=setPalette;

document.getElementById('themeToggle').addEventListener('click',()=>{setMode(getMode()==='dark'?'light':'dark')});
document.getElementById('nav').addEventListener('click',e=>{const btn=e.target.closest('.nav-btn');if(btn)setScreen(btn.dataset.screen)});
applyTheme();setScreen('dashboard');
</script>
</body>
</html>
